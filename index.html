<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proanchat</title>
  <meta name="description" content="A Discord-inspired community chat, voice, video, and server management app powered by Supabase.">
  <meta property="og:title" content="Proanchat">
  <meta property="og:description" content="A Discord-inspired community chat, voice, video, and server management app powered by Supabase.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#08080a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23d6182a'/%3E%3Cpath d='M20 15h14a12 12 0 0 1 0 24h-6v10l-8-7z' fill='%23fff'/%3E%3C/svg%3E">

  <!-- Supabase client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <style>
    /* Colour palette (dark by default; themes override it below) */
    :root {
      --rail: #08080a;
      --side: #101012;
      --main: #161618;
      --input: #1d1d21;
      --hover: #1c1c20;
      --text: #efeded;
      --mute: #a1a1aa;
      --accent: #e11d2e;
      --green: #23a559;
      --red: #f23f43;
      --border: #ffffff10;
    }

    [data-theme=midnight] {
      --accent: #ff2d55;
      --rail: #000;
      --side: #08080d;
      --main: #0e0e16;
      --input: #191925;
      --hover: #151520;
    }

    [data-theme=sunset] {
      --accent: #e8590c;
      --main: #2f2a2e;
      --side: #272226;
      --rail: #1c181b;
      --input: #3a3339;
      --hover: #352f34;
    }

    /* Base page styles */
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #2a1114;
      border-radius: 4px;
    }

    .brand {
      width: 48px;
      height: 48px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card .logo {
      display: block;
      margin: 0 auto 12px;
    }

    body {
      background: var(--main);
      color: var(--text);
      font: 16px/1.375 "gg sans", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    button, input, textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    /* Main layout: server rail | channels | chat | members */
    #app {
      display: grid;
      grid-template-columns: 72px 240px 1fr 240px;
      height: 100%;
    }

    /* Server rail (far left) */
    #rail {
      background: var(--rail);
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      overflow-y: auto;
    }

    .sv {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--main);
      border: 0;
      font-weight: 600;
      transition: .15s;
      flex: none;
      position: relative;
    }

    .sv:hover, .sv.on {
      border-radius: 16px;
      background: var(--accent);
      color: #fff;
    }

    .sv.on:before {
      content: "";
      position: absolute;
      left: -12px;
      top: 12px;
      width: 4px;
      height: 24px;
      background: #fff;
      border-radius: 0 4px 4px 0;
    }

    .sv.add {
      color: var(--accent);
      font-size: 24px;
    }

    .sv.add:hover {
      background: var(--accent);
      color: #fff;
    }

    .sep {
      width: 32px;
      height: 2px;
      background: var(--main);
      border-radius: 1px;
    }

    /* Channel sidebar */
    #side {
      background: var(--side);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #sh {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      border-bottom: 1px solid #0003;
      box-shadow: 0 1px 0 #0002;
    }

    #chl {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .lbl {
      display: flex;
      justify-content: space-between;
      color: var(--mute);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 12px 8px 4px;
    }

    .lbl button {
      background: none;
      border: 0;
      color: var(--mute);
      font-size: 18px;
      padding: 0;
    }

    .ch {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-radius: 4px;
      padding: 6px 8px;
      color: var(--mute);
      font-weight: 500;
    }

    .ch:hover {
      background: var(--hover);
      color: var(--text);
    }

    .ch.on {
      background: #4e505899;
      color: #fff;
    }

    /* Your user bar at the bottom of the sidebar */
    #me {
      background: #232428;
      height: 52px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #me .nm {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Icon buttons */
    .ib {
      background: none;
      border: 0;
      color: var(--mute);
      font-size: 18px;
      border-radius: 4px;
      padding: 4px 6px;
    }

    .ib:hover {
      background: var(--hover);
      color: var(--text);
    }

    /* Avatars */
    .av {
      border-radius: 50%;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #fff;
      flex: none;
    }

    /* Chat area */
    #main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    #ch {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      border-bottom: 1px solid #0003;
      flex: none;
    }

    #msgs {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
    }

    /* Messages */
    .msg {
      display: flex;
      gap: 16px;
      padding: 2px 16px 2px 16px;
      position: relative;
      margin-top: 16px;
    }

    .msg.grp {
      margin-top: 0;
    }

    .msg:hover {
      background: #0000000a;
    }

    .msg > div:first-child, .gt {
      width: 40px;
      flex: none;
    }

    .gt {
      font-size: 11px;
      color: var(--mute);
      visibility: hidden;
      text-align: right;
      line-height: 22px;
    }

    .msg:hover .gt {
      visibility: visible;
    }

    .mb {
      min-width: 0;
      flex: 1;
    }

    .mh {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .mh b {
      cursor: pointer;
    }

    .mh b:hover {
      text-decoration: underline;
    }

    .ts {
      font-size: 12px;
      color: var(--mute);
    }

    .mc {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .del {
      position: absolute;
      right: 16px;
      top: -8px;
      background: var(--side);
      border: 1px solid #0004;
      border-radius: 4px;
      display: none;
    }

    .msg:hover .del {
      display: block;
    }


    /* Message box */
    #comp {
      padding: 0 16px 24px;
      position: relative;
      flex: none;
    }

    #cbox {
      background: var(--input);
      border-radius: 8px;
      display: flex;
      align-items: flex-end;
      padding: 0 8px;
    }

    #inp {
      flex: 1;
      background: none;
      border: 0;
      outline: 0;
      resize: none;
      padding: 11px 8px;
      max-height: 200px;
      line-height: 22px;
    }

    #cnt {
      font-size: 11px;
      color: var(--red);
      padding: 0 16px;
      height: 14px;
    }

    /* Emoji picker */
    #emo {
      display: none;
      position: absolute;
      right: 16px;
      bottom: 64px;
      width: 300px;
      max-height: 260px;
      overflow-y: auto;
      background: var(--side);
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 8px 24px #0006;
      z-index: 5;
    }

    #emo.on {
      display: block;
    }

    #emo button {
      background: none;
      border: 0;
      font-size: 22px;
      width: 36px;
      height: 36px;
      border-radius: 4px;
    }

    #emo button:hover {
      background: var(--hover);
    }

    #emo p {
      margin: 6px 4px;
      font-size: 12px;
      color: var(--mute);
      font-weight: 600;
    }

    /* Member list (far right) */
    #mem {
      background: var(--side);
      overflow-y: auto;
      padding: 8px;
    }

    .mm {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }

    .mm:hover {
      background: var(--hover);
    }

    .mm.off {
      opacity: .45;
    }

    .dot {
      position: relative;
    }

    .dot i {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green);
      border: 3px solid var(--side);
    }

    .empty {
      margin: auto;
      text-align: center;
      color: var(--mute);
      padding: 24px;
      max-width: 380px;
    }

    /* Pop-up windows */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000a;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 16px;
    }

    #modal.on {
      display: flex;
    }

    .mbox {
      background: var(--main);
      border-radius: 8px;
      width: 440px;
      max-width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }

    .mbox h2 {
      margin: 0 0 4px;
    }

    .mbox p {
      color: var(--mute);
      margin: 0 0 16px;
    }

    /* Form fields and buttons */
    .f {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--mute);
      text-transform: uppercase;
      margin: 14px 0 6px;
    }

    .t {
      width: 100%;
      background: #1e1f22;
      border: 0;
      border-radius: 4px;
      padding: 10px;
      outline: 0;
    }

    .t:focus {
      outline: 2px solid var(--accent);
    }

    .b {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 9px 16px;
      font-weight: 500;
    }

    .b:hover {
      filter: brightness(.9);
    }

    .b.g {
      background: none;
      color: var(--text);
    }

    .b.r {
      background: var(--red);
    }

    .b.pr {
      background: linear-gradient(135deg, #ff4d5a, #b3091a);
    }

    .row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .err {
      color: var(--red);
      font-size: 14px;
      margin-top: 8px;
      min-height: 20px;
    }

    /* Login / signup screen */
    #auth {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 15%, #7a0a14 0, #050505 60%);
      padding: 16px;
    }

    .card {
      background: var(--main);
      padding: 32px;
      border-radius: 8px;
      width: 480px;
      max-width: 100%;
      box-shadow: 0 2px 10px #0004;
    }

    .card h1 {
      text-align: center;
      margin: 0 0 4px;
      font-size: 24px;
    }

    .card .sub {
      text-align: center;
      color: var(--mute);
      margin-bottom: 8px;
    }

    /* Profile card */
    .ban {
      height: 60px;
      border-radius: 8px 8px 0 0;
      margin: -24px -24px 0;
    }

    .pop {
      margin: -30px 0 0 16px;
      border: 6px solid var(--main);
      border-radius: 50%;
      width: 92px;
      height: 92px;
      overflow: hidden;
    }

    /* Colour swatches in settings */
    .sw {
      display: inline-block;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      margin: 0 6px 0 0;
      border: 2px solid transparent;
      cursor: pointer;
    }

    /* Animations and Discord-style extras */
    @keyframes pop { from { transform: scale(.92); opacity: 0; } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes slide { from { opacity: 0; transform: translateY(10px); } }
    @keyframes blink { 50% { opacity: .2; } }
    #modal.on { animation: fade .15s; }
    .mbox, .card { animation: pop .22s cubic-bezier(.2, .9, .3, 1.2); }
    #emo.on { animation: pop .15s; }
    .msg.new { animation: slide .25s ease-out; }
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #000; color: #fff; border: 1px solid var(--accent); border-radius: 8px; padding: 10px 18px; z-index: 20; animation: slide .25s; }
    .sv:before { content: ""; position: absolute; left: -12px; top: 50%; width: 4px; height: 0; background: #fff; border-radius: 0 4px 4px 0; transform: translateY(-50%); transition: height .15s; }
    .sv:hover:before { height: 20px; }
    .sv.on:before { top: 50%; height: 36px; }
    .ch, .mm, .ib, .b { transition: background .12s, color .12s, filter .12s; }
    .b:active { transform: scale(.97); }
    .dd { display: flex; align-items: center; gap: 8px; margin: 18px 16px 0; color: var(--mute); font-size: 12px; font-weight: 600; }
    .dd:before, .dd:after { content: ""; flex: 1; height: 1px; background: #ffffff18; }
    .acts { position: absolute; right: 16px; top: -14px; display: none; background: var(--side); border: 1px solid #0006; border-radius: 6px; }
    .msg:hover .acts { display: flex; }
    .mc { font-size: var(--fs, 16px); }
    .mc code { background: #000a; padding: 2px 5px; border-radius: 4px; font-family: Consolas, monospace; font-size: .9em; }
    .mc a { color: #ff6b78; }
    .mention { background: #e11d2e33; color: #ffb3b9; border-radius: 3px; padding: 0 3px; }
    .ed { font-size: 11px; color: var(--mute); }
    #typ { height: 20px; padding: 0 16px; font-size: 12px; color: var(--mute); }
    .dots i { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--mute); margin-right: 2px; animation: blink 1.2s infinite; }
    .dots i:nth-child(2) { animation-delay: .2s; }
    .dots i:nth-child(3) { animation-delay: .4s; }
    .dot i.idle { background: #f0b132; }
    .dot i.dnd { background: var(--red); }
    .dot i.off { background: #80848e; }
    #me .nm small { display: block; font-weight: 400; color: var(--mute); font-size: 11px; }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 12px 0 4px; }
    .tab { background: none; border: 0; border-radius: 4px; padding: 6px 12px; color: var(--mute); font-weight: 500; }
    .tab:hover { background: var(--hover); color: var(--text); }
    .tab.on { background: var(--accent); color: #fff; }
    .opt { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #ffffff12; }
    .opt input { width: 18px; height: 18px; accent-color: var(--accent); }
    body.compact .msg { margin-top: 6px; }
    body.compact .msg.grp { margin-top: 0; }
    body.noanim *, body.noanim *:before { animation: none !important; transition: none !important; }

    /* Full-page settings, channels, uploads */
    .badge { background: linear-gradient(135deg, #ff4d5a, #b3091a); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 700; vertical-align: middle; }
    #set { position: fixed; inset: 0; z-index: 12; background: var(--main); display: grid; grid-template-columns: minmax(220px, 36%) 1fr; animation: fade .15s; }
    #setnav { background: var(--side); padding: 60px 8px 20px; display: flex; justify-content: flex-end; overflow-y: auto; }
    #setnav > div { width: 192px; margin-right: 12px; }
    .sg { font-size: 12px; font-weight: 700; color: var(--mute); text-transform: uppercase; padding: 6px 10px; margin-top: 12px; }
    .sn { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 4px; padding: 6px 10px; color: var(--mute); font-weight: 500; margin: 1px 0; transition: background .12s; }
    .sn:hover { background: var(--hover); color: var(--text); }
    .sn.on { background: #ffffff1c; color: #fff; }
    #setmain { overflow-y: auto; padding: 60px 40px 80px; }
    #setmain > div { max-width: 660px; }
    #setx { position: fixed; top: 40px; right: 40px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--mute); background: none; color: var(--mute); font-size: 16px; }
    #setx:hover { color: #fff; border-color: #fff; }
    .srow { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 10px 0; }
    .srow b { display: block; }
    .card2 { background: var(--side); border-radius: 8px; padding: 16px; margin: 12px 0; overflow: hidden; }
    .pc .ban { margin: -16px -16px 0; }
    .mob { display: none; }
    .perk { padding: 8px 0; border-bottom: 1px solid #ffffff12; display: flex; justify-content: space-between; gap: 12px; }
    .perk i { font-style: normal; color: var(--mute); font-size: 13px; text-align: right; }
    .chw { position: relative; }
    .cog { position: absolute; right: 4px; top: 3px; display: none; font-size: 14px; }
    .chw:hover .cog { display: block; }
    .topic { color: var(--mute); font-weight: 400; font-size: 14px; margin-left: 12px; padding-left: 12px; border-left: 1px solid #ffffff22; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .att { max-width: min(420px, 100%); max-height: 320px; border-radius: 8px; margin-top: 6px; display: block; }
    .file { display: inline-block; background: var(--side); border: 1px solid #ffffff18; border-radius: 8px; padding: 10px 14px; margin-top: 6px; }
    #inp:disabled { cursor: not-allowed; }
    @media (max-width: 700px) { #set { grid-template-columns: 1fr; } #setnav { display: none; } .mob { display: flex; } #setmain { padding: 60px 16px 80px; } #setx { top: 12px; right: 12px; } }

    /* Right-click menu and Discord-style create dialogs */
    #ctx { position: fixed; z-index: 30; background: #111214; border-radius: 6px; padding: 6px 8px; min-width: 190px; box-shadow: 0 8px 16px #0009; animation: pop .1s; }
    #ctx button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 3px; padding: 8px; font-size: 14px; color: var(--mute); font-weight: 500; }
    #ctx button:hover { background: var(--accent); color: #fff; }
    #ctx button.dg { color: #f23f43; }
    #ctx button.dg:hover { background: var(--red); color: #fff; }
    #ctx hr { border: 0; border-top: 1px solid #ffffff14; margin: 4px 0; }
    .mbox { position: relative; }
    .mx { position: absolute; top: 14px; right: 14px; font-size: 18px; }
    .f2 { display: block; font-weight: 600; margin: 12px 0 6px; }
    .kind { display: flex; gap: 12px; align-items: center; padding: 6px 12px; border-radius: 8px; cursor: pointer; margin: 1px 0; }
    .kind:has(input:checked) { background: #ffffff12; }
    .kind input { accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
    .kind .ki { font-size: 20px; width: 24px; text-align: center; flex: none; }
    .kind b { font-weight: 600; }
    .kind small, .lockrow small { display: block; color: var(--mute); font-size: 13px; margin-top: 2px; }
    .kind em { font-size: 10px; font-style: normal; background: #ffffff1c; border-radius: 4px; padding: 1px 6px; color: var(--mute); margin-left: 6px; }
    .kind.off { opacity: .45; cursor: not-allowed; }
    .nm2 { display: flex; align-items: center; background: #1e1f22; border-radius: 4px; padding: 0 12px; outline: 2px solid transparent; }
    .nm2:focus-within { outline-color: var(--accent); }
    .nm2 span { color: var(--mute); margin-right: 8px; font-size: 18px; }
    .nm2 input { flex: 1; background: none; border: 0; outline: 0; padding: 11px 0; }
    .lockrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 20px; }
    .tg { appearance: none; -webkit-appearance: none; width: 40px; height: 24px; flex: none; background: #80848e; border-radius: 12px; position: relative; cursor: pointer; transition: background .15s; }
    .tg:before { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
    .tg:checked { background: var(--green); }
    .tg:checked:before { left: 19px; }
    .b:disabled { opacity: .5; cursor: not-allowed; filter: none; }

    /* Voice, forums, friends, badges */
    #vbar { background: #111214; padding: 8px 12px; border-bottom: 1px solid #0006; display: flex; align-items: center; gap: 4px; }
    #vbar:empty { display: none; }

    function fmtText(text) {

        return escapeHtml(part)
          .replace(/`([^`\n]+)`/g, '<code>$1</code>')
          .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
          .replace(/(^|\s)\*(.+?)\*(?=\s|$)/g, '$1<i>$2</i>')

          .replace(/@(\w+)/g, (x, n) => members.some(m => (m.username || '').toLowerCase() === n.toLowerCase()) ? `<span class="mention">${x}</span>` : x);

    // ---------- Server Invite Links (proanchat.com/example) & Previews ----------
    const INV_CACHE = {};
    const INVITE_DOMAIN = 'https://proanchat.com';
    const RESERVED_SLUGS = new Set(['index', 'index.html', 'api', 'assets', 'src', 'public', 'invite', 'login', 'signup', 'app', 'favicon.ico']);
    const inviteUrl = code => `${INVITE_DOMAIN}/${encodeURIComponent(code)}`;
    function parseInviteCode(raw) {
      const s = String(raw || '').trim();
      if (!s) return '';
      const m = /(?:[?#]invite=|\/invite\/)([a-zA-Z0-9_-]{2,40})/i.exec(s);
      if (m) return m[1];
      try {
        const u = new URL(/^https?:\/\//i.test(s) ? s : (s.includes('.') && s.includes('/') ? 'https://' + s : 'http://x/' + s));
        const seg = u.pathname.replace(/^\/+|\/+$/g, '').split('/')[0];
        if (seg && !RESERVED_SLUGS.has(seg.toLowerCase())) return seg;
      } catch (e) {}
      return s.replace(/^\/+|\/+$/g, '');
    }
    function extractInviteCodes(text) {
      const out = [], seen = new Set();
      const push = c => {
        if (!c || RESERVED_SLUGS.has(c.toLowerCase())) return;
        if (!seen.has(c.toLowerCase())) { seen.add(c.toLowerCase()); out.push(c); }
      };
      const hostEsc = location.origin.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`(?:https?:\\/\\/(?:www\\.)?proanchat\\.com\\/|\\bproanchat\\.com\\/|(?:${hostEsc})\\/|\\/invite\\/|[?#]invite=)([a-zA-Z0-9_-]{2,40})`, 'gi');
      let m;
      while ((m = re.exec(text || ''))) push(m[1]);
      return out;
    }
    function readUrlInvite() {
      try {
        const sp = new URLSearchParams(location.search);
        let code = sp.get('invite');
        if (!code && location.hash) {
          const hm = /invite=([a-zA-Z0-9_-]{2,40})/i.exec(location.hash);
          if (hm) code = hm[1];
        }
        if (!code) {
          const pm = /\/invite\/([a-zA-Z0-9_-]{2,40})\/?$/i.exec(location.pathname);
          if (pm) code = pm[1];
        }
        if (!code) {
          const rm = /^\/([a-zA-Z0-9_-]{2,40})\/?$/i.exec(location.pathname);
          if (rm && !RESERVED_SLUGS.has(rm[1].toLowerCase())) code = rm[1];
        }
        if (code) {
          sessionStorage.setItem('procord-invite', code);
          return code;
        }
        return sessionStorage.getItem('procord-invite') || '';
      } catch (e) { return ''; }
    }
    function clearUrlInvite() {
      pendingInvite = '';
      try { sessionStorage.removeItem('procord-invite'); } catch (e) {}
      try {
        const u = new URL(location.href);
        let changed = false;
        if (u.searchParams.has('invite')) { u.searchParams.delete('invite'); changed = true; }
        if (/invite=/.test(u.hash)) { u.hash = ''; changed = true; }
        const pm = /^\/(?:invite\/)?([a-zA-Z0-9_-]{2,40})\/?$/i.exec(u.pathname);
        if (pm && !RESERVED_SLUGS.has(pm[1].toLowerCase())) { u.pathname = '/'; changed = true; }
        if (changed) history.replaceState(null, '', u.pathname + u.search + u.hash);
      } catch (e) {}
    }
    let pendingInvite = readUrlInvite();

    async function fetchInvitePreview(code) {
      const k = (code || '').toLowerCase();
      if (!k) return null;
      if (k in INV_CACHE) return INV_CACHE[k];
      const mine = servers.find(s => (s.invite_code || '').toLowerCase() === k);
      if (mine) {
        INV_CACHE[k] = { id: mine.id, name: mine.name, member_count: mine.id === cur?.id ? members.length : null };
        return INV_CACHE[k];
      }
      try {
        const { data, error } = await supabaseClient.rpc('preview_invite', { code });
        INV_CACHE[k] = !error && data ? data : null;
      } catch (e) { INV_CACHE[k] = null; }
      return INV_CACHE[k];
    }

      const rows = data || [];

    async function selectServer(id) {
      cur = servers.find(s => s.id === id);
      const c = await supabaseClient.from('channels').select('*').eq('server_id', id).order('created_at');
  channels = c.data || [];
  const k = await supabaseClient.from('categories').select('*').eq('server_id', id).order('created_at');
  cats = k.data || [];
  await loadRoles(id);
  liveServer(id);
      await loadMembers();
      online = new Map();
      if (pr) supabaseClient.removeChannel(pr);
      pr = supabaseClient.channel('pres-' + id, { config: { presence: { key: me.id } } });
      pr.on('presence', { event: 'sync' }, () => {
        online = new Map(Object.entries(pr.presenceState()).map(([k, v]) => [k, v[0]?.status || 'online']));
        renderMembers();
      }).subscribe(s => { if (s === 'SUBSCRIBED') pr.track({ status: S.status }); });
      renderAll();
      if (channels.length) selectChannel(channels[0].id);
      else { curCh = null; msgs = []; renderChat(); }
    }

    async function selectChannel(id) {
      curCh = channels.find(c => c.id === id);
      curThread = null; dmWith = null; typers = {};
      if (rt) { supabaseClient.removeChannel(rt); rt = null; }
      renderSide();
      if (curCh.kind === 'voice') { msgs = []; return renderChat(); }
      if (curCh.kind === 'forum') await loadThreads(); else await loadMessages();
      const tbl = { schema: 'public', table: 'messages' };
      rt = supabaseClient.channel('msg-' + id)
        .on('postgres_changes', { event: 'INSERT', ...tbl, filter: 'channel_id=eq.' + id }, async p => {
          if ((p.new.thread_id || null) !== (curThread?.id || null)) return;
          if (msgs.some(m => m.id === p.new.id)) return;
          const { data } = await supabaseClient.from('profiles').select('*').eq('id', p.new.user_id).single();
          addMsg({ ...p.new, profiles: data });
          if (p.new.user_id !== me.id) beep();
        })
        .on('postgres_changes', { event: 'UPDATE', ...tbl, filter: 'channel_id=eq.' + id }, p => {
          const m = msgs.find(x => x.id === p.new.id);
          if (m) { Object.assign(m, p.new); renderChat(true); }
        })
        .on('postgres_changes', { event: 'DELETE', ...tbl }, p => { msgs = msgs.filter(m => m.id !== p.old.id); renderChat(true); })
        .on('broadcast', { event: 'typing' }, ({ payload }) => {
          if (payload.id === me.id) return;
          typers[payload.u] = Date.now();
          renderTyping();
          setTimeout(renderTyping, 3200);
        })
        .subscribe();
    }

    function addMsg(m) {
      if (msgs.some(x => x.id === m.id)) return;
      msgs.push(m);
      animateLast = true;
      renderChat();
    }

      const { data } = await supabaseClient.from('profiles').select('id,username').ilike('username', name).neq('id', me.id).limit(1);

    function liveReload(t) {
      clearTimeout(rtimers[t]);
      rtimers[t] = setTimeout(async () => {
        if (!cur) return;
        const id = cur.id;
        if (t === 'channels') {
          const c = await supabaseClient.from('channels').select('*').eq('server_id', id).order('created_at');
          channels = c.data || [];
          if (curCh && !channels.some(x => x.id === curCh.id)) { curCh = null; if (channels.length) selectChannel(channels[0].id); }
          else if (curCh) curCh = channels.find(x => x.id === curCh.id);
      watchVoice();
          renderSide(); renderChat(true);
        } else if (t === 'categories') {
          const k = await supabaseClient.from('categories').select('*').eq('server_id', id).order('created_at');
          cats = k.data || []; renderSide();
        } else if (t === 'roles' || t === 'member_roles') {

          await loadMembers();

          renderMembers(); renderChat(true);

          if (curCh?.kind === 'forum' && !curThread) loadThreads();

          const { data } = await supabaseClient.from('servers').select('*').eq('id', id);

    async function regenerateInvite() {
      if (!cur) return;
      if (!confirm('Generate a new invite link? Existing invite links for this server will stop working.')) return;
      let newCode = null;
      const r = await supabaseClient.rpc('regenerate_invite', { srv_id: cur.id });
      if (!r.error && r.data) newCode = r.data;
      else if (cur.owner_id === me.id) {
        const bytes = new Uint8Array(4);
        crypto.getRandomValues(bytes);
        const gen = [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
        const { error } = await supabaseClient.from('servers').update({ invite_code: gen }).eq('id', cur.id);
        if (error) return toast(error.message);
        newCode = gen;
      } else {
        return toast(r.error?.message || 'Run invite-links.sql in Supabase first.');
      }
      cur.invite_code = newCode;
      const s = servers.find(x => x.id === cur.id);
      if (s) s.invite_code = newCode;
      toast('New invite link generated');
      logAudit('Invite Regenerated', 'proanchat.com/' + newCode);
      if ($('#set')?.dataset.kind === 'server') serverSettings('invites');
      else if ($('#modal')?.classList.contains('on')) serverMenu();
    }

    async function saveCustomInvite() {
      if (!cur) return;
      const slug = ($('#cslug')?.value || '').trim().toLowerCase();
      if (!/^[a-z0-9_-]{2,32}$/.test(slug)) return toast('Use 2–32 letters, numbers, hyphens (-), or underscores (_).');
      if (RESERVED_SLUGS.has(slug)) return toast('That invite link name is reserved.');
      let saved = null;
      const r = await supabaseClient.rpc('set_invite_code', { srv_id: cur.id, new_code: slug });
      if (!r.error && r.data) saved = r.data;
      else if (cur.owner_id === me.id && (!r.error || /could not find|does not exist|PGRST202/i.test(r.error.message || ''))) {
        const { error } = await supabaseClient.from('servers').update({ invite_code: slug }).eq('id', cur.id);
        if (error) return toast(error.message.includes('duplicate') ? 'That invite link is already taken.' : error.message);
        saved = slug;
      } else {
        return toast(r.error?.message || 'Could not update invite link.');
      }
      cur.invite_code = saved;
      const s = servers.find(x => x.id === cur.id);
      if (s) s.invite_code = saved;
      toast('Invite link updated to proanchat.com/' + saved);
      logAudit('Invite URL Updated', 'proanchat.com/' + saved);
      serverSettings('invites');
    }

    function serverSettings(tab = 'profile') {
      if (!cur) return;
      if (tab === 'overview') tab = 'profile';
      const firstOpen = !$('#set') || $('#set').dataset.kind !== 'server';
      if (firstOpen) {
        sset.sdraft = null;
        sset.sdirty = false;
        loadServerExtras();
      }
      sset.tab = tab;
      const NAV = [
        { g: cur.name },
        ['profile', 'Server Profile'],
        ['tag', 'Server Tag'],
        ['engagement', 'Engagement'],
        ['boost', 'Boost Perks'],
        { sep: 1 },
        { g: 'Expression' },
        ['emoji', 'Emoji'],
        ['stickers', 'Stickers'],
        ['soundboard', 'Soundboard'],
        { sep: 1 },
        { g: 'People' },
        ['members', 'Members', '↗'],
        ['roles', 'Roles'],
        ['invites', 'Invites'],
        ['access', 'Access'],
        { sep: 1 },
        { g: 'Apps' },
        ['integrations', 'Integrations'],
        ['apps', 'App Directory', '↗'],
        { sep: 1 },
        { g: 'Moderation' },
        ['safety', 'Safety Setup'],
        ['audit', 'Audit Log'],
        ['bans', 'Bans'],
        { sep: 1 },
        { g: 'Community' },
        ['community', 'Community Overview'],
        ['onboarding', 'Onboarding'],
        ['insights', 'Server Insights'],
        ['webpage', 'Server Web Page'],
        { sep: 1 },
        ['template', 'Server Template'],
        ...(cur.owner_id === me.id ? [['__del', 'Delete Server']] : [])
      ];
      const pages = {
        profile: srvProfileHtml,
        tag: srvTagHtml,
        engagement: srvEngagementHtml,
        boost: srvBoostHtml,
        emoji: () => srvExprHtml('emojis'),
        stickers: () => srvExprHtml('stickers'),
        soundboard: () => srvExprHtml('sounds'),
        members: membersHtml,
        roles: rolesHtml,
        invites: srvInvitesHtml,
        access: srvAccessHtml,
        integrations: srvIntegrationsHtml,
        apps: srvAppsHtml,
        safety: srvSafetyHtml,
        audit: srvAuditHtml,
        bans: srvBansHtml,
        community: srvCommunityHtml,
        onboarding: srvOnboardingHtml,
        insights: srvInsightsHtml,
        webpage: srvWebPageHtml,
        template: srvTemplateHtml
      };
      const go = k => k === '__del' ? 'delServer()' : `sset.rid=null;sset.dirty=false;sset.sdraft=null;sset.sdirty=false;serverSettings('${k}')`;
      const nav = NAV.map(n => n.sep ? '<div class="ssep"></div>'
        : n.g ? `<div class="sg">${escapeHtml(n.g)}</div>`
        : `<button class="sn ${n[0] === '__del' ? 'danger' : ''} ${n[0] === tab ? 'on' : ''}" onclick="${go(n[0])}"><span class="sn-ic">${SSET_IC[n[0] === '__del' ? 'del' : n[0]] || ''}</span><span>${n[1]}</span>${n[2] ? `<span class="sn-ext">${n[2]}</span>` : ''}</button>`).join('');
      const mob = `<div class="tabs mob" style="overflow-x:auto;flex-wrap:nowrap">${NAV.filter(Array.isArray).filter(n => n[0] !== '__del').map(n => `<button class="tab ${n[0] === tab ? 'on' : ''}" style="white-space:nowrap" onclick="${go(n[0])}">${n[1]}</button>`).join('')}</div>`;
      const wide = ['profile', 'tag', 'insights', 'webpage'].includes(tab);
      let el = $('#set');
      if (!el) { el = document.createElement('div'); el.id = 'set'; document.body.append(el); }
      el.dataset.kind = 'server';
      const renderFn = pages[tab] || srvProfileHtml;
      el.innerHTML = `<div id="setnav"><div>${nav}</div></div><div id="setmain"><div class="${wide ? 'wide' : ''}">${mob}${renderFn()}</div></div><button id="setx" title="Close (Esc)" onclick="closeSet()">✕</button><span class="esc">ESC</span>`;
    }

    function ensureSrvDraft() {
      if (!sset.sdraft) sset.sdraft = { name: cur.name, ...JSON.parse(JSON.stringify(srvMeta(cur))) };
      return sset.sdraft;
    }

    function srvCardPreviewHtml(name, m) {
      const onCount = Math.max(1, members.filter(p => (p.id === me.id ? S.status : online.get(p.id)) && (p.id === me.id ? S.status : online.get(p.id)) !== 'invisible').length);
      const est = new Date(cur.created_at || Date.now()).toLocaleDateString([], { month: 'short', year: 'numeric' });
      const mono = (name || '').split(/\s+/).map(w => w[0]).join('').slice(0, 3).toUpperCase() || 'S';
      const icoInner = m.icon_url && /^https?:\/\//i.test(m.icon_url) ? `<img src="${escapeHtml(m.icon_url)}" alt="">` : escapeHtml(mono);
      const traits = (m.traits || []).filter(t => t && (t.l || '').trim()).map(t => `<span class="srv-tpill"><span data-noico>${escapeHtml(t.e || '✨')}</span>${escapeHtml(t.l)}</span>`).join('');
      return `<div class="srv-card">
        <div class="srv-card-ban" id="sp-ban" style="${srvBannerCss(m)}"></div>
        <div class="srv-card-body">
          <div class="srv-card-ico" id="sp-ico">${icoInner}</div>
          <div class="srv-card-name"><span id="sp-name">${escapeHtml(name || cur.name)}</span><span title="Server Badge" style="color:#b8c0ff;font-size:13px">✦</span></div>
          <div class="srv-card-meta">
            <span><i style="background:#23a559"></i>${onCount} Online</span>
            <span><i style="background:#80848e"></i>${members.length} Member${members.length === 1 ? '' : 's'}</span>
          </div>
          <div class="srv-card-est">Est. ${escapeHtml(est)}</div>
          ${traits ? `<div class="srv-card-traits" id="sp-traits">${traits}</div>` : '<div class="srv-card-traits" id="sp-traits" style="display:none"></div>'}
          <div class="srv-card-desc" id="sp-desc">${escapeHtml(m.description || '')}</div>
        </div>
      </div>`;
    }

    function refreshSrvCardPreview() {
      const d = ensureSrvDraft();
      if ($('#sp-name')) $('#sp-name').textContent = d.name || cur.name;
      if ($('#sp-desc')) $('#sp-desc').textContent = d.description || '';
      if ($('#sp-ban')) $('#sp-ban').setAttribute('style', srvBannerCss(d));
      if ($('#sp-ico')) {
        const mono = (d.name || cur.name).split(/\s+/).map(w => w[0]).join('').slice(0, 3).toUpperCase() || 'S';
        $('#sp-ico').innerHTML = d.icon_url && /^https?:\/\//i.test(d.icon_url) ? `<img src="${escapeHtml(d.icon_url)}" alt="">` : escapeHtml(mono);
      }
      if ($('#sp-traits')) {
        const html = (d.traits || []).filter(t => t && (t.l || '').trim()).map(t => `<span class="srv-tpill"><span data-noico>${escapeHtml(t.e || '✨')}</span>${escapeHtml(t.l)}</span>`).join('');
        $('#sp-traits').innerHTML = html;
        $('#sp-traits').style.display = html ? 'flex' : 'none';
      }
      if ($('#ssavebar')) $('#ssavebar').style.display = sset.sdirty ? 'flex' : 'none';
    }

    function srvProfileHtml() {
      const d = ensureSrvDraft();
      const canEdit = cur.owner_id === me.id || can('manage_channels') || can('administrator');
      const dis = canEdit ? '' : 'disabled';
      return `<h2>Server Profile</h2>
        <p class="srv-sub">Customise how your server appears in invite links and, if enabled, in Server Discovery and Announcement Channel messages.</p>
        <div class="srv-split">
          <div>
            <div class="srv-sec">
              <label class="srv-lbl">Name</label>
              <div class="nm2"><input id="sp-in-name" value="${escapeHtml(d.name)}" maxlength="50" ${dis} oninput="sset.sdraft.name=this.value;sset.sdirty=true;refreshSrvCardPreview()"></div>
            </div>
            <div class="srv-sec">
              <label class="srv-lbl">Icon</label>
              <p class="srv-sub">We recommend an image of at least 512x512.</p>
              <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                <button class="b" style="background:#5865f2" ${dis} onclick="pickSrvImage('icon_url')">Change Server Icon</button>
                <button class="b g" ${dis} onclick="sset.sdraft.icon_url='';$('#sp-in-ico').value='';sset.sdirty=true;refreshSrvCardPreview()">Remove Icon</button>
              </div>
              <input class="t" id="sp-in-ico" style="margin-top:8px" placeholder="Or paste icon image URL (https://...)" value="${escapeHtml(d.icon_url || '')}" ${dis} oninput="sset.sdraft.icon_url=this.value.trim();sset.sdirty=true;refreshSrvCardPreview()">
            </div>
            <div class="srv-sec">
              <label class="srv-lbl">Banner</label>
              <div class="srv-ban-grid">
                ${SRV_BANNERS.map(([id, grad]) => `<button type="button" class="srv-ban-tile ${!d.banner_url && d.banner_id === id ? 'on' : ''}" style="background:${grad}" title="${id}" ${dis} onclick="sset.sdraft.banner_id='${id}';sset.sdraft.banner_url='';sset.sdirty=true;serverSettings('profile')"></button>`).join('')}
              </div>
              <div style="display:flex;gap:8px;margin-top:10px">
                <input class="t" id="sp-in-ban" placeholder="Custom banner image URL (optional)" value="${escapeHtml(d.banner_url || '')}" ${dis} oninput="sset.sdraft.banner_url=this.value.trim();sset.sdirty=true;refreshSrvCardPreview()">
                <button class="b g" ${dis} onclick="pickSrvImage('banner_url')">Upload</button>
              </div>
            </div>
            <div class="srv-sec">
              <label class="srv-lbl">Traits</label>
              <p class="srv-sub">Add up to 5 traits to show off your server's interests and personality.</p>
              <div class="srv-traits" data-noico>
                ${(d.traits || []).slice(0, 5).map((t, i) => `<div class="srv-trait"><input class="temo" value="${escapeHtml(t.e || '😊')}" maxlength="4" ${dis} oninput="sset.sdraft.traits[${i}].e=this.value;sset.sdirty=true;refreshSrvCardPreview()"><input class="tlbl" placeholder="Add trait..." value="${escapeHtml(t.l || '')}" maxlength="20" ${dis} oninput="sset.sdraft.traits[${i}].l=this.value;sset.sdirty=true;refreshSrvCardPreview()"></div>`).join('')}
              </div>
            </div>
            <div class="srv-sec">
              <label class="srv-lbl">Description</label>
              <p class="srv-sub">How did your server get started? Why should people join?</p>
              <textarea class="t" rows="3" maxlength="300" placeholder="Tell people about your community..." ${dis} oninput="sset.sdraft.description=this.value;sset.sdirty=true;refreshSrvCardPreview()">${escapeHtml(d.description || '')}</textarea>
            </div>
          </div>
          <div>${srvCardPreviewHtml(d.name, d)}</div>
        </div>
        <div id="ssavebar" class="savebar" style="display:${sset.sdirty ? 'flex' : 'none'}">
          <span>Careful, you have unsaved changes!</span>
          <button class="b g" onclick="sset.sdraft=null;sset.sdirty=false;serverSettings('profile')">Reset</button>
          <button class="b" style="background:var(--green)" onclick="saveSrvProfile()">Save Changes</button>
        </div>`;
    }

    async function pickSrvImage(field) {
      const i = document.createElement('input');
      i.type = 'file'; i.accept = 'image/*';
      i.onchange = async () => {
        if (!i.files[0]) return;
        toast('Uploading…');
        const url = await uploadFile(i.files[0]);
        if (!url) return;
        ensureSrvDraft()[field] = url;
        sset.sdirty = true;
        toast('Uploaded');
        serverSettings('profile');
      };
      i.click();
    }

    async function saveSrvProfile() {
      const d = ensureSrvDraft();
      const newName = (d.name || '').trim();
      if (!newName) return toast('Server needs a name.');
      const { name: _drop, ...patch } = d;
      await saveSrvMeta(patch, newName !== cur.name ? newName : null);
      sset.sdirty = false;
      logAudit('Server Profile Updated', cur.name);
      toast('Server profile saved');
      serverSettings('profile');
    }

    function srvTagHtml() {
      const m = srvMeta(cur);
      const c = safeColor(m.tag_color || '#5865f2');
      const sample = (m.tag_text || 'PRO').slice(0, 4).toUpperCase();
      return `<h2>Server Tag</h2>
        <p class="srv-sub">Give members a 4-character guild tag badge shown next to their display name across the server.</p>
        <div class="srv-split">
          <div>
            <label class="opt"><span><b>Enable Server Tag</b><small class="ts">Display the server tag next to members' names.</small></span><input type="checkbox" class="tg" id="st-en" ${m.tag_enabled ? 'checked' : ''}></label>
            <span class="f2">Tag Text (max 4 characters)</span>
            <div class="nm2"><input id="st-txt" maxlength="4" value="${escapeHtml(m.tag_text || '')}" placeholder="e.g. MIMI" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'');$('#st-prev-pill').textContent=this.value||'PRO'"></div>
            <span class="f2">Badge Icon</span>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px" data-noico>
              ${['🛡️', '🌸', '⚡', '👑', '🔥', '🎮', '💎', '⭐'].map(ic => `<button type="button" class="b g" style="padding:6px 10px" onclick="$('#st-ico').value='${ic}';$('#st-prev-ic').textContent='${ic}'">${ic}</button>`).join('')}
            </div>
            <input class="t" id="st-ico" maxlength="4" value="${escapeHtml(m.tag_icon || '🛡️')}" oninput="$('#st-prev-ic').textContent=this.value||'🛡️'">
            <span class="f2">Tag Accent Colour</span>
            <div class="row" style="justify-content:flex-start"><input type="color" id="st-col" value="${c}"></div>
            <div class="row" style="justify-content:flex-start;margin-top:16px"><button class="b" onclick="saveSrvTag()">Save Server Tag</button></div>
          </div>
          <div class="card2" style="margin:0">
            <div class="prof-preview-lbl">Tag Preview</div>
            <div class="msg" style="margin:0;padding:8px 0">
              <div>${avatarHtml(me, 40)}</div>
              <div class="mb">
                <div class="mh"><b>${escapeHtml(me.username)}</b><span class="stag" style="border-color:${c}66;background:${c}24"><span id="st-prev-ic" data-noico>${escapeHtml(m.tag_icon || '🛡️')}</span><span id="st-prev-pill">${escapeHtml(sample)}</span></span> <span class="ts">Today</span></div>
                <div class="mc">Everyone in ${escapeHtml(cur.name)} can rep this tag!</div>
              </div>
            </div>
          </div>
        </div>`;
    }

    async function saveSrvTag() {
      const enabled = $('#st-en').checked;
      const text = ($('#st-txt').value || '').trim().toUpperCase().slice(0, 4);
      const icon = ($('#st-ico').value || '🛡️').trim();
      const color = $('#st-col').value || '#5865f2';
      if (enabled && text.length < 2) return toast('Enter at least 2 letters/numbers for the Server Tag.');
      await saveSrvMeta({ tag_enabled: enabled, tag_text: text, tag_icon: icon, tag_color: color });
      logAudit('Server Tag Updated', enabled ? text : 'Disabled');
      toast('Server Tag saved');
      serverSettings('tag');
    }

    function srvEngagementHtml() {
      const m = srvMeta(cur), e = m.engagement;
      const tChs = channels.filter(c => ['text', 'announcement'].includes(c.kind));
      return `<h2>Engagement</h2>
        <p class="srv-sub">Configure system messages, welcome prompts, and default notification rules.</p>

    async function kick(uid) {
      if (!confirm('Kick this member from the server?')) return;
      const target = members.find(m => m.id === uid)?.username || uid;
      const { error } = await supabaseClient.from('members').delete().eq('server_id', cur.id).eq('user_id', uid);
      if (error) return toast(error.message);
      logAudit('Member Kicked', target);
      await loadMembers(); renderMembers(); serverSettings('members');
    }

    async function banMember(uid) {
      const target = members.find(m => m.id === uid);
      const reason = prompt(`Ban ${target?.username || 'this member'}? Optional reason:`, 'Rule violation');
      if (reason === null) return;
      try {
        await supabaseClient.from('server_bans').upsert({ server_id: cur.id, user_id: uid, reason: reason.trim(), banned_by: me.id });
      } catch (e) {}
      await supabaseClient.from('members').delete().eq('server_id', cur.id).eq('user_id', uid);
      const m = srvMeta(cur);
      const bans = [{ user_id: uid, username: target?.username || uid, reason: reason.trim(), created_at: new Date().toISOString() }, ...(m.bans || []).filter(b => b.user_id !== uid)];
      await saveSrvMeta({ bans });
      srvBans = bans;
      logAudit('Member Banned', target?.username || uid, { reason: reason.trim() });
      await loadMembers(); renderMembers();
      toast('Member banned');
      serverSettings(sset.tab);
    }

    async function unbanMember(uid) {
      if (!confirm('Unban this user?')) return;
      try {
        await supabaseClient.from('server_bans').delete().eq('server_id', cur.id).eq('user_id', uid);
      } catch (e) {}
      const old = srvBans.find(b => b.user_id === uid);
      const m = srvMeta(cur);
      const bans = (m.bans || []).filter(b => b.user_id !== uid);
      await saveSrvMeta({ bans });
      srvBans = bans;
      logAudit('Member Unbanned', old?.username || uid);
      toast('User unbanned');
      serverSettings('bans');
    }

    async function applySrvPreset(id) {
      const map = {
        gaming: [{ name: 'looking-for-group', kind: 'text', category: 'Text channels' }, { name: 'clips', kind: 'text', category: 'Text channels' }, { name: 'squad-voice', kind: 'voice', category: 'Voice channels' }],

      };
      const items = (map[id] || []).filter(c => !channels.some(x => x.name === c.name));
      if (!items.length) return toast('Those preset channels already exist on this server.');
      for (const c of items) {
        const row = { id: uuid(), server_id: cur.id, name: c.name, kind: c.kind, category: c.category, private: false };

      renderSide();
      toast(`Added ${items.length} preset channels!`);

    function editRole(id) {
      const r = roles.find(x => x.id === id);
      sset.rid = id; sset.rtab = 'display'; sset.dirty = false;
      sset.draft = { ...r, perms: [...(r.perms || [])] };
      serverSettings('roles');

    function closeRole() { sset.rid = null; sset.draft = null; sset.dirty = false; serverSettings('roles'); }
    function roleTab(t) { sset.rtab = t; serverSettings('roles'); }
    function dirty() { sset.dirty = true; const b = $('#savebar'); if (b) b.style.display = 'flex'; }
    function togglePerm(k, on) {
      const p = new Set(sset.draft.perms);
      if (on) p.add(k); else p.delete(k);
      sset.draft.perms = [...p]; dirty();
    }

    async function newRole() {
      const { data, error } = await supabaseClient.from('roles').insert({ server_id: cur.id, name: 'new role', color: '#99aab5', position: roles.length }).select().single();
      if (error) return toast(error.message + ' (Run update6.sql in Supabase first.)');
      roles.push(data);
      logAudit('Role Created', data.name);
      editRole(data.id);
    }

    async function saveRole() {
      const d = sset.draft;
      if (!d.name.trim()) return toast('A role needs a name.');
      const u = { name: d.name.trim(), color: d.color, perms: d.perms, style: d.style || 'solid', color2: d.color2 || d.color, icon: d.icon || null };
      const { error } = await supabaseClient.from('roles').update(u).eq('id', d.id);
      if (error) return toast(error.message + ' (Run update7.sql in Supabase first.)');
      Object.assign(roles.find(r => r.id === d.id), u);
      sset.dirty = false; toast('Role saved');
      logAudit('Role Updated', u.name);
      serverSettings('roles'); renderMembers(); renderChat(true); renderSide();
    }

    async function moveRole(id, dir) {
      const i = roles.findIndex(r => r.id === id), j = i + dir;
      if (j < 0 || j >= roles.length) return;
      [roles[i], roles[j]] = [roles[j], roles[i]];
      await Promise.all(roles.map((r, k) => { if (r.position === k) return null; r.position = k; return supabaseClient.from('roles').update({ position: k }).eq('id', r.id); }));
      serverSettings('roles'); renderMembers(); renderChat(true);
    }

    // ---------- Colour themes ----------

      ['Ultraviolet', '#0f0a2e', '#5b2bd6', 135, '#8b5cf6'], ['Ocean', '#03122b', '#0b5fa5', 150, '#38bdf8'], ['Sunset', '#2a0a2e', '#e8590c', 160, '#ff8a3d'],
      ['Forest', '#04150c', '#1f6b3a', 145, '#34d399'], ['Rose Gold', '#2b0f1b', '#b4536a', 135, '#fb7185'], ['Midnight Blue', '#050b24', '#1e3a8a', 135, '#60a5fa'],
      ['Candy', '#2a0a3a', '#d6338a', 135, '#f472b6'], ['Ember', '#1a0600', '#b34a00', 150, '#fb923c'], ['Cyberpunk', '#1a0536', '#0aa3c2', 120, '#22d3ee'],

    function currentTheme() {
      let t = findTheme(S.theme);
      if (!t) { S.theme = S.theme === 'sunset' ? 'g_sunset' : S.theme === 'midnight' ? 'onyx' : 'dark'; t = findTheme(S.theme); }
      if (S.accent === '#e11d2e') S.accent = null;
      return { ...t, accent: S.accent || t.accent };
    }

    function applyTheme(t) {
      const root = document.documentElement;
      ['--rail', '--side', '--main', '--input', '--hover', '--solid', '--gbg', '--setdim'].forEach(k => root.style.removeProperty(k));
      let bg = '';
      if (t.vars) Object.entries(t.vars).forEach(([k, v]) => root.style.setProperty(k, v));
      if (t.c1) {
        const d = t.dark ?? .38, c1 = safeColor(t.c1), c2 = safeColor(t.c2 || t.c1);
        root.style.setProperty('--rail', `rgba(0,0,0,${Math.min(.92, d + .2)})`);
        root.style.setProperty('--side', `rgba(0,0,0,${Math.min(.9, d + .06)})`);
        root.style.setProperty('--main', `rgba(0,0,0,${Math.max(.05, d - .08)})`);
        root.style.setProperty('--input', `rgba(0,0,0,${d})`);
        root.style.setProperty('--hover', 'rgba(255,255,255,.07)');
        root.style.setProperty('--solid', `color-mix(in srgb, ${c1} 55%, #0c0c0f)`);
        const g = `linear-gradient(${+t.angle || 0}deg, ${c1}, ${c2})`;
    root.style.setProperty('--gbg', g);
    root.style.setProperty('--setdim', 'rgba(0,0,0,.32)');
    bg = g + ' fixed';
      }
      document.body.style.background = bg;
      document.body.classList.toggle('grad', !!bg);
      root.style.setProperty('--accent', safeColor(t.accent));
    }

    function pickTheme(id) { S.theme = id; S.accent = null; tdraft = null; saveS(); settings('appearance'); }

    function editTheme(id) {
      const t = id && (S.custom || []).find(x => x.id === id);

      applyS(); settings('appearance');
    }

    const gradOf = t => `linear-gradient(${+t.angle || 0}deg,${safeColor(t.c1)},${safeColor(t.c2 || t.c1)})`;
function tdPrev(k, v) { tdraft[k] = v; applyS(); const b = $('#tdbar'); if (b) b.style.background = gradOf(tdraft); }

      const id = tdraft.id;

    // ---------- Voice engine v2: audio, camera and screen share (WebRTC "perfect negotiation") ----------
    const vlobby = {}; // who is in each voice channel of this server (for the sidebar)
    const meta = () => ({ name: me.username, muted: vc.muted, deaf: vc.deaf, cam: !!vc.cam, screen: !!vc.screen });
    const lobbyTrack = () => { const l = vc && vlobby[vc.room]; if (l) l.ch.track(meta()); };
    const IC = {
      mic: 'M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z',
      cam: 'M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z',
      screen: 'M20 3H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h6v2H8v2h8v-2h-2v-2h6a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 12H4V5h16v10z',
      head: 'M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h3v-8H5v-1a7 7 0 0 1 14 0v1h-3v8h3a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z',
      end: 'M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.96.96 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28a11.27 11.27 0 0 0-2.67-1.85.996.996 0 0 1-.56-.9v-3.1A15.9 15.9 0 0 0 12 9z'
    };
    const icon = (n, off, s = 22) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="currentColor"><path d="${IC[n]}"/>${off ? '<path d="M3.5 3.5l17 17" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>' : ''}</svg>`;

    function audioConstraints() {
      return {
        ...(S.audioIn ? { deviceId: { exact: S.audioIn } } : {}),
        echoCancellation: S.echo !== false,
        noiseSuppression: S.noise !== false,
        autoGainControl: S.agc !== false
      };
    }

    function applyOutPrefs(audio) {
      if (!audio) return;
      audio.volume = Math.max(0, Math.min(1, (S.outVol ?? 100) / 100));
      if (typeof audio.setSinkId === 'function') audio.setSinkId(S.audioOut || '').catch(() => {});
    }

    async function joinVoice(room, label) {
      if (vc) await leaveVoice();
      label = label || (channels.find(c => c.id === room)?.name ? '#' + channels.find(c => c.id === room).name : dmWith ? 'Call with ' + dmWith.username : 'Call');
      let rawStream;
      try { rawStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints() }); }
      catch (e) {
        try { rawStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
        catch (e2) { toast('Allow microphone access to join voice.'); return false; }
      }
      const actx = new (window.AudioContext || window.webkitAudioContext)();
      const gain = actx.createGain();
      gain.gain.value = (S.inVol ?? 100) / 100;
      const dest = actx.createMediaStreamDestination();
      const micSrc = actx.createMediaStreamSource(rawStream);
      micSrc.connect(gain);
      gain.connect(dest);
      const stream = dest.stream;
      const sig = supabaseClient.channel('voice-' + room, { config: { presence: { key: me.id } } });
      vc = { room, label, rawStream, stream, actx, gain, dest, micSrc, sig, peers: {}, muted: false, deaf: false, cam: null, screen: null, vels: {}, meters: {}, speaking: new Set() };
      sig.on('presence', { event: 'sync' }, voiceSync)
        .on('broadcast', { event: 'rtc' }, ({ payload }) => onSignal(payload))
        .on('broadcast', { event: 'sfx' }, ({ payload }) => playSfx(payload))
        .subscribe(s => { if (s === 'SUBSCRIBED') { sig.track(meta()); lobbyTrack(); } });
      startMeters();
      renderMe(); renderSide(); renderChat(true);
      return true;
    }

    function voiceSync() {
      if (!vc) return;
      const ids = Object.keys(vc.sig.presenceState()).filter(k => k !== me.id);
      ids.forEach(id => { if (!vc.peers[id]) makePeer(id); });
      Object.keys(vc.peers).forEach(id => { if (!ids.includes(id)) dropPeer(id); });
      renderChat(true);
    }

    function makePeer(id) {
      const pc = new RTCPeerConnection(ICE), audio = new Audio();
      audio.autoplay = true; audio.muted = vc.deaf;
      applyOutPrefs(audio);
      const peer = { pc, audio, q: [], videos: {}, labels: {}, senders: {}, making: false, ignore: false, polite: me.id > id };
      vc.peers[id] = peer;
      vc.stream.getTracks().forEach(t => pc.addTrack(t, vc.stream));
      pc.ontrack = e => {
        const s = e.streams[0];
        if (e.track.kind === 'audio') { audio.srcObject = s; applyOutPrefs(audio); meter(id, s); return; }
        const kind = peer.labels[s.id] || 'cam';
        const on = () => { peer.videos[kind] = s; renderChat(true); };
        const off = () => { delete peer.videos[kind]; renderChat(true); };
        e.track.onunmute = on; e.track.onmute = off; e.track.onended = off; s.onremovetrack = off;
        on();
      };
      pc.onicecandidate = e => { if (e.candidate && vc) vsend(id, { ice: e.candidate }); };
      pc.onnegotiationneeded = async () => {
        try { peer.making = true; await pc.setLocalDescription(); if (vc) vsend(id, { sdp: pc.localDescription }); }
        catch (e) { console.warn('negotiation', e); } finally { peer.making = false; }
      };
      ['cam', 'screen'].forEach(k => { if (vc[k]) attachVideo(id, peer, k, vc[k]); });
    }

    function dropPeer(id) {
      const p = vc?.peers[id];
      if (!p) return;
      p.pc.close(); p.audio.srcObject = null;
      delete vc.peers[id]; delete vc.meters[id];
      Object.keys(vc.vels).filter(k => k.startsWith(id + ':')).forEach(k => delete vc.vels[k]);
    }

    async function onSignal(p) {
      if (!vc || p.to !== me.id) return;
      if (!vc.peers[p.from]) makePeer(p.from);
      const peer = vc.peers[p.from], pc = peer.pc;
      if (p.label) { peer.labels[p.label.id] = p.label.kind; return; }
      try {
        if (p.sdp) {
          const collision = p.sdp.type === 'offer' && (peer.making || pc.signalingState !== 'stable');
          peer.ignore = !peer.polite && collision;
          if (peer.ignore) return;
          await pc.setRemoteDescription(p.sdp);
          peer.q.forEach(c => pc.addIceCandidate(c).catch(() => {}));
          peer.q = [];
          if (p.sdp.type === 'offer') { await pc.setLocalDescription(); if (vc) vsend(p.from, { sdp: pc.localDescription }); }
        } else if (p.ice) {
          if (!pc.remoteDescription) peer.q.push(p.ice);
          else { try { await pc.addIceCandidate(p.ice); } catch (e) { if (!peer.ignore) throw e; } }
        }
      } catch (e) { console.warn('voice signal', e); }
    }

    async function leaveVoice() {
      if (!vc) return;
      closeVcPop();
      const v = vc;
      clearInterval(v.timer);
      const l = vlobby[v.room];
      if (l) l.ch.untrack();
      vc = null;
      Object.values(v.peers).forEach(p => { p.pc.close(); p.audio.srcObject = null; });
      [v.rawStream, v.stream, v.cam, v.screen].forEach(s => { if (s) s.getTracks().forEach(t => t.stop()); });
      try { v.actx.close(); } catch (e) {}
      await supabaseClient.removeChannel(v.sig);
      renderMe(); renderSide(); renderChat(true);
    }

    function voiceToggle(kind) {
      if (!vc) return;
      vc[kind] = !vc[kind];
      if (kind === 'deaf') vc.muted = vc.deaf; // deafening also mutes your mic
      if (vc.rawStream) vc.rawStream.getAudioTracks().forEach(t => { t.enabled = !vc.muted; });
      vc.stream.getAudioTracks().forEach(t => { t.enabled = !vc.muted; });
      Object.values(vc.peers).forEach(p => { p.audio.muted = vc.deaf; });
      vc.sig.track(meta()); lobbyTrack();
      renderMe(); renderChat(true);
    }

    // Live device switching while in a call or VC
    async function refreshMicStream() {
      if (!vc) return;
      try {
        const next = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints() });
        next.getAudioTracks().forEach(t => { t.enabled = !vc.muted; });
        try { vc.micSrc.disconnect(); } catch (e) {}
        if (vc.rawStream) vc.rawStream.getTracks().forEach(t => t.stop());
        vc.rawStream = next;
        vc.micSrc = vc.actx.createMediaStreamSource(next);
        vc.micSrc.connect(vc.gain);
        if (vc.actx.state === 'suspended') vc.actx.resume();
        toast('Microphone updated');
      } catch (e) { toast('Could not switch microphone: ' + e.message); }
    }

    async function switchAudioIn(id) { S.audioIn = id; saveS(); await refreshMicStream(); }
    function switchAudioOut(id) { S.audioOut = id; saveS(); if (vc) Object.values(vc.peers).forEach(p => applyOutPrefs(p.audio)); toast('Output device updated'); }
    function setInVol(val) { S.inVol = +val; saveS(); if (vc?.gain) vc.gain.gain.value = S.inVol / 100; }
    function setOutVol(val) { S.outVol = +val; saveS(); if (vc) Object.values(vc.peers).forEach(p => applyOutPrefs(p.audio)); }
    async function toggleAudioOpt(k, on) { S[k] = on; saveS(); await refreshMicStream(); }

    async function switchVideoIn(id) {
      S.videoIn = id; saveS();
      if (!vc || !vc.cam) return;
      try {
        const next = await navigator.mediaDevices.getUserMedia({ video: { ...vqc(), ...(id ? { deviceId: { exact: id } } : {}) } });
        const newTrack = next.getVideoTracks()[0];
        const oldStream = vc.cam;
        vc.cam = next;
        await Promise.all(Object.values(vc.peers).map(async p => {
          const sender = (p.senders.cam || []).find(s => s.track && s.track.kind === 'video');
          if (sender) await sender.replaceTrack(newTrack);
        }));
        oldStream.getTracks().forEach(t => t.stop());
        delete vc.vels[me.id + ':cam'];
        renderChat(true);
        toast('Camera switched');
      } catch (e) { toast('Could not switch camera: ' + e.message); }
    }

    function closeVcPop() { const p = $('#vcpop'); if (p) p.remove(); }
    document.addEventListener('mousedown', e => { const p = $('#vcpop'); if (p && !p.contains(e.target) && !e.target.closest('.vchev,.cchev')) closeVcPop(); });

    async function openVcPop(ev, mode) {
      ev.stopPropagation();
      const existing = $('#vcpop');
      if (existing && existing.dataset.mode === mode) return closeVcPop();
      const btn = ev.currentTarget || ev.target?.closest?.('button');
      const r = btn ? btn.getBoundingClientRect() : { left: ev.clientX || 20, top: ev.clientY || 20, bottom: (ev.clientY || 20) + 20 };
      closeVcPop();
      let devs = [];
      try { if (navigator.mediaDevices?.enumerateDevices) devs = await navigator.mediaDevices.enumerateDevices(); } catch (e) {}
      const mics = devs.filter(d => d.kind === 'audioinput');
      const spks = devs.filter(d => d.kind === 'audiooutput');
      const cams = devs.filter(d => d.kind === 'videoinput');
      const opts = (list, curId, fallback) => `<option value="" ${!curId ? 'selected' : ''}>System Default (${fallback})</option>`
        + list.map((d, i) => `<option value="${escapeHtml(d.deviceId)}" ${d.deviceId === curId ? 'selected' : ''}>${escapeHtml(d.label || `${fallback} ${i + 1}`)}</option>`).join('');
      const pop = document.createElement('div');
      pop.id = 'vcpop';
      pop.dataset.mode = mode;
      if (mode === 'mic') {
        pop.innerHTML = `<h4>Input Device &amp; Audio</h4>
          <label class="f" style="margin-top:0">Microphone</label>
          <select class="t" onchange="switchAudioIn(this.value)">${opts(mics, S.audioIn, 'Microphone')}</select>
          <label class="f">Input Volume</label>
          <div class="vol-row"><input type="range" min="0" max="200" value="${S.inVol ?? 100}" oninput="this.nextElementSibling.textContent=this.value+'%';setInVol(this.value)"><span>${S.inVol ?? 100}%</span></div>
          <div class="mic-meter"><div id="vc-lvl"></div></div>
          <label class="opt" style="padding:8px 0"><span>Noise Suppression</span><input type="checkbox" ${S.noise !== false ? 'checked' : ''} onchange="toggleAudioOpt('noise',this.checked)"></label>
          <label class="opt" style="padding:8px 0"><span>Echo Cancellation</span><input type="checkbox" ${S.echo !== false ? 'checked' : ''} onchange="toggleAudioOpt('echo',this.checked)"></label>
          <label class="opt" style="padding:8px 0;border:0"><span>Auto Gain Control</span><input type="checkbox" ${S.agc !== false ? 'checked' : ''} onchange="toggleAudioOpt('agc',this.checked)"></label>`;
      } else if (mode === 'spk') {
        pop.innerHTML = `<h4>Output Device</h4>
          <label class="f" style="margin-top:0">Speaker / Headphones</label>
          <select class="t" onchange="switchAudioOut(this.value)">${opts(spks, S.audioOut, 'Speaker')}</select>
          <label class="f">Output Volume</label>
          <div class="vol-row"><input type="range" min="0" max="100" value="${S.outVol ?? 100}" oninput="this.nextElementSibling.textContent=this.value+'%';setOutVol(this.value)"><span>${S.outVol ?? 100}%</span></div>
          <div class="row" style="margin-top:12px"><button class="b g" onclick="closeVcPop();settings('voice')">Voice &amp; Video Settings</button></div>`;
      } else {
        pop.innerHTML = `<h4>Camera &amp; Stream Quality</h4>
          <label class="f" style="margin-top:0">Camera</label>
          <select class="t" onchange="switchVideoIn(this.value)">${opts(cams, S.videoIn, 'Camera')}</select>
          <label class="f">Stream Quality</label>
          <select class="t" onchange="S.vq=this.value;saveS();boostVideo()">${[['720p30', '720p · 30 fps'], ['1080p60', '1080p · 60 fps (HD)'], ['4k60', '4K · 60 fps']].map(([v, l]) => `<option value="${v}" ${(S.vq || '720p30') === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
      }
      closeVcPop();
      document.body.append(pop);
      const pr = pop.getBoundingClientRect();
      pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pr.width - 8)) + 'px';
      pop.style.top = (r.top - pr.height - 10 > 8 ? r.top - pr.height - 10 : r.bottom + 8) + 'px';
    }

    // Camera and screen share are extra tracks added to every connection
    function attachVideo(id, peer, kind, stream) {
      vsend(id, { label: { id: stream.id, kind } });
      peer.senders[kind] = stream.getTracks().map(t => peer.pc.addTrack(t, stream));
    }

    function addVideo(kind, stream) {
      Object.entries(vc.peers).forEach(([id, p]) => attachVideo(id, p, kind, stream));
      vc.sig.track(meta()); lobbyTrack();
      renderMe(); renderChat(true);
    }

    function stopVideo(kind) {
      const s = vc && vc[kind];
      if (!s) return;
      s.getTracks().forEach(t => t.stop());
      Object.values(vc.peers).forEach(p => { (p.senders[kind] || []).forEach(x => { try { p.pc.removeTrack(x); } catch (e) {} }); p.senders[kind] = []; });
      vc[kind] = null;
      vc.sig.track(meta()); lobbyTrack();
      renderMe(); renderChat(true);
    }

    async function toggleCam() {
      if (!vc) return;
      if (vc.cam) return stopVideo('cam');
      try { vc.cam = await navigator.mediaDevices.getUserMedia({ video: { ...vqc(), ...(S.videoIn ? { deviceId: { exact: S.videoIn } } : {}) } }); }
      catch (e) {
        try { vc.cam = await navigator.mediaDevices.getUserMedia({ video: vqc() }); }
        catch (e2) { return toast('Allow camera access to turn on video.'); }
      }
      addVideo('cam', vc.cam); setTimeout(boostVideo, 800);
    }

    async function toggleScreen() {
      if (!vc) return;
      if (vc.screen) return stopVideo('screen');
      try { vc.screen = await navigator.mediaDevices.getDisplayMedia({ video: vqc(), audio: true }); }
      catch (e) { return; }
      vc.screen.getVideoTracks()[0].onended = () => stopVideo('screen');
      addVideo('screen', vc.screen); setTimeout(boostVideo, 800);
    }

    // Green ring around whoever is talking + live mic meter
    function meter(id, stream) {
      try {
        const an = vc.actx.createAnalyser();
        an.fftSize = 512;
        vc.actx.createMediaStreamSource(stream).connect(an);
        vc.meters[id] = an;
      } catch (e) {}
    }

    function startMeters() {
      meter(me.id, vc.stream);
      vc.timer = setInterval(() => {
        if (!vc) return;
        const buf = new Uint8Array(512), now = new Set();
        let myPct = 0;
        Object.entries(vc.meters).forEach(([id, an]) => {
          an.getByteTimeDomainData(buf);
          let max = 0; buf.forEach(v => { max = Math.max(max, Math.abs(v - 128)); });
          if (id === me.id) myPct = vc.muted ? 0 : Math.min(100, Math.round(max * 2.2));
          if (max > 12 && !(id === me.id && vc.muted)) now.add(id);
        });
        const lvl = $('#vc-lvl');
        if (lvl) lvl.style.width = myPct + '%';
        vc.speaking = now;
        document.querySelectorAll('[data-vt]').forEach(el => el.classList.toggle('speaking', now.has(el.dataset.vt)));
      }, 100);
    }

    // Keep playing <video> elements alive when the screen is redrawn
    function mountVideos() {
      if (!vc) return;
      document.querySelectorAll('.vslot').forEach(slot => {
        const [uid, kind] = slot.dataset.k.split(':');
        const st = uid === me.id ? vc[kind] : vc.peers[uid]?.videos[kind];
        if (!st) return;
        let v = vc.vels[slot.dataset.k];
        if (!v) { v = document.createElement('video'); v.autoplay = true; v.playsInline = true; v.muted = true; vc.vels[slot.dataset.k] = v; }
        if (v.srcObject !== st) v.srcObject = st;
        slot.append(v);
        v.play().catch(() => {});
      });
    }

    // Who is in each voice channel, shown under the channel name in the sidebar
    function watchVoice() {
      const ids = channels.filter(c => c.kind === 'voice').map(c => c.id);
      Object.keys(vlobby).forEach(id => { if (!ids.includes(id)) { supabaseClient.removeChannel(vlobby[id].ch); delete vlobby[id]; } });
      ids.forEach(id => {
        if (vlobby[id]) return;
        const ch = supabaseClient.channel('vl-' + id, { config: { presence: { key: me.id } } });
        vlobby[id] = { ch, users: [] };
        ch.on('presence', { event: 'sync' }, () => {
          if (!vlobby[id]) return;
          vlobby[id].users = Object.entries(ch.presenceState()).map(([uid, a]) => ({ uid, ...(a[0] || {}) }));
          renderSide();
          if (curCh?.id === id) renderChat(true);
        }).subscribe();
      });
    }

    function vusersHtml(c) {
      if (c.kind !== 'voice') return '';
      return (vlobby[c.id]?.users || []).map(u => {
        const p = members.find(m => m.id === u.uid) || (u.uid === me.id ? me : { username: u.name || '?' });
        return `<div class="vu" data-vt="${u.uid}">${avatarHtml(p, 22)}<span>${escapeHtml(p.username)}</span>${u.deaf ? '🙉' : u.muted ? '🔇' : ''}${u.cam ? '📷' : ''}${u.screen ? '🖥️' : ''}</div>`;
      }).join('');
    }

    // ---------- Voice and call screens ----------
    function ctlHtml() {
      const b = (cls, title, code, svg) => `<button class="cbtn ${cls}" title="${title}" onclick="${code}">${svg}</button>`;
      const sp = (cls, title, code, svg, mode) => `<div class="csplit"><button class="cbtn ${cls}" title="${title}" onclick="${code}">${svg}</button><button class="cchev" title="Choose device" onclick="openVcPop(event,'${mode}')">▾</button></div>`;
      return `<div class="vctl"><div class="cgroup">${sp(vc.muted ? 'off' : '', vc.muted ? 'Unmute' : 'Mute', "voiceToggle('muted')", icon('mic', vc.muted), 'mic')}${sp(vc.cam ? 'on' : '', vc.cam ? 'Turn off camera' : 'Turn on camera', 'toggleCam()', icon('cam', !vc.cam), 'cam')}</div>`
        + `<div class="cgroup">${b(vc.screen ? 'on' : '', vc.screen ? 'Stop sharing' : 'Share your screen', 'toggleScreen()', icon('screen'))}${sp(vc.deaf ? 'off' : '', vc.deaf ? 'Undeafen' : 'Deafen', "voiceToggle('deaf')", icon('head', vc.deaf), 'spk')}</div>`
        + `<div class="cgroup">${b('', 'Soundboard', 'soundboard()', '🔊')}</div>`
        + `${b('end', 'Disconnect', 'leaveVoice()', icon('end'))}</div>`;
    }

    function personOf(uid, m) { return members.find(u => u.id === uid) || (uid === me.id ? me : dmWith && uid === dmWith.id ? dmWith : { username: m.name || '?' }); }

    function tilesHtml(compact) {
      const out = [], st = vc.sig.presenceState();
      Object.entries(st).forEach(([uid, a]) => {
        const m = a[0] || {}, p = personOf(uid, m);
        const hasCam = m.cam && (uid === me.id ? vc.cam : vc.peers[uid]?.videos.cam);
        const hasScr = m.screen && (uid === me.id ? vc.screen : vc.peers[uid]?.videos.screen);
        if (compact && !hasCam && !hasScr) { out.push(`<div class="callav" data-vt="${uid}" title="${escapeHtml(p.username)}">${avatarHtml(p, 84)}</div>`); return; }
        out.push(`<div class="vtile" data-vt="${uid}">${hasCam ? `<div class="vslot" data-k="${uid}:cam"></div>` : `<div class="vav">${avatarHtml(p, 92)}</div>`}<div class="vname">${escapeHtml(p.username)}${m.deaf ? ' 🙉' : m.muted ? ' 🔇' : ''}</div></div>`);
        if (hasScr) out.push(`<div class="vtile wide"><div class="vslot" data-k="${uid}:screen"></div><div class="vname">🖥️ ${escapeHtml(p.username)}'s screen</div></div>`);
      });
      return out.join('');
    }

    function voiceRoomHtml() {
      const joined = vc && vc.room === curCh.id;
      if (!joined) {
        const users = vlobby[curCh.id]?.users || [];
        return `<div class="vstage"><div class="vgrid">${users.map(u => `<div class="vtile"><div class="vav">${avatarHtml(personOf(u.uid, u), 80)}</div><div class="vname">${escapeHtml(personOf(u.uid, u).username)}</div></div>`).join('')}</div>
          <div class="vjoin"><h2>🔊 ${escapeHtml(curCh.name)}</h2><p>${users.length ? users.length + ' in voice right now' : 'No one is here yet.'}</p><button class="b" onclick="joinVoice('${curCh.id}')">Join Voice</button></div></div>`;
      }
      return `<div class="vstage"><div class="vgrid">${tilesHtml(false)}</div><div class="vfoot"><button class="b g" onclick="serverMenu()">Invite to Voice</button>${ctlHtml()}</div></div>`;
    }

    function iconize(root) {
      if (!root || (root.nodeType !== 1 && root.nodeType !== 3)) return;
      const skip = 'input, textarea, select, option, script, style, #emo, #eauto, #rxp, #etip, .mc, .ricon, [data-noico]';
      const nodes = [];
      if (root.nodeType === 3) nodes.push(root);
      else { const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); for (let n = w.nextNode(); n; n = w.nextNode()) nodes.push(n); }
      nodes.forEach(n => {
        if (!EMOJI_RE.test(n.nodeValue)) return;

        if (!p || p.closest(skip)) return;
        const frag = document.createDocumentFragment();
        n.nodeValue.split(EMOJI_RE).forEach(part => {

          ? `<button class="b g" style="padding:8px 14px;background:#ffffff14" onclick="selectServer('${joined.id}')">Joined</button>`
          : `<button class="b" style="padding:8px 16px;background:var(--green)" onclick="acceptInvite('${escapeHtml(code)}')">Join</button>`;
        return `<div class="inv-embed" data-invc="${escapeHtml(k)}"><div class="inv-embed-hdr">You've been invited to join a server</div><div class="inv-embed-row"><div class="inv-ico">${ico}</div><div class="inv-meta"><b>${escapeHtml(name)}</b><small>${escapeHtml(sub)}</small></div>${btn}</div></div>`;

    function hydrateInviteEmbeds() {
      const nodes = document.querySelectorAll('.inv-embed[data-invc]');
      const seen = new Set();
      nodes.forEach(n => {
        const k = n.dataset.invc;
        if (!k || k in INV_CACHE || seen.has(k)) return;
        seen.add(k);
        fetchInvitePreview(k).then(info => {
          if (!info) return;
          document.querySelectorAll(`.inv-embed[data-invc="${k}"]`).forEach(card => {
            card.querySelector('.inv-meta b').textContent = info.name;
            card.querySelector('.inv-ico').textContent = info.name.split(/\s+/).map(w => w[0]).join('').slice(0, 3).toUpperCase();
            if (info.member_count != null) card.querySelector('.inv-meta small').textContent = `${info.member_count} Member${info.member_count === 1 ? '' : 's'}`;

    // ---------- Sending and deleting messages ----------
    async function send() {
      const inp = $('#inp'), t = inp.value.trim();
      if (!t || (!curCh && !dmWith)) return;
      if (t.length > 4000) return toast('Messages are limited to 4000 characters.');
      if (cur && curCh && cur.owner_id !== me.id && !can('administrator')) {
        const sm = srvMeta(cur).safety || {};
        if (sm.block_invites && extractInviteCodes(t).length) {
          return toast('External server invite links are blocked in this server.');
        }
        if (sm.blocked_words) {
          const words = sm.blocked_words.split(',').map(w => w.trim().toLowerCase()).filter(Boolean);
          const low = t.toLowerCase();
          if (words.some(w => low.includes(w))) return toast('Message blocked by server Safety Setup.');
        }
        if (sm.slowmode > 0) {
          const waitMs = sm.slowmode * 1000 - (Date.now() - (slowLast[curCh.id] || 0));
          if (waitMs > 0) return toast(`Slowmode active: wait ${Math.ceil(waitMs / 1000)}s before sending.`);
          slowLast[curCh.id] = Date.now();
        }
      }
      inp.value = ''; inp.style.height = 'auto'; $('#cnt').textContent = '';
      if ($('#eauto')) $('#eauto').classList.remove('on');
      const { data, error } = await postMessage({ content: t });
      if (error) { inp.value = t; return toast(error.message); }
      addMsg(data);
    }

    // ---------- Custom emojis, stickers, reactions, soundboard ----------

    async function loadLibrary() {
      const q = t => supabaseClient.from(t).select('*').limit(1000);
      const [a, b, c] = await Promise.all([q('custom_emojis'), q('stickers').eq('owner_id', me.id), q('sounds').eq('owner_id', me.id)]);
