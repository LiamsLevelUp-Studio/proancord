<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procord</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23d6182a'/%3E%3Cpath d='M20 15h14a12 12 0 0 1 0 24h-6v10l-8-7z' fill='%23fff'/%3E%3C/svg%3E">

  <!-- Supabase client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <style>
    /* Colour palette (dark by default; premium themes override it below) */
    :root {
      --rail: #050505;
      --side: #0e0e0f;
      --main: #151516;
      --input: #1e1e20;
      --hover: #1b1b1d;
      --text: #efe9e9;
      --mute: #9a9091;
      --accent: #e11d2e;
      --green: #23a559;
      --red: #f23f43;
    }

    [data-theme=midnight] {
      --accent: #ff2d55;
      --rail: #000;
      --side: #08080d;
      --main: #0e0e16;
      --input: #191925;
      --hover: #151520;
    }

    [data-theme=sunset] {
      --accent: #e8590c;
      --main: #2f2a2e;
      --side: #272226;
      --rail: #1c181b;
      --input: #3a3339;
      --hover: #352f34;
    }

    /* Base page styles */
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #2a1114;
      border-radius: 4px;
    }

    .brand {
      width: 48px;
      height: 48px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card .logo {
      display: block;
      margin: 0 auto 12px;
    }

    body {
      background: var(--main);
      color: var(--text);
      font: 16px/1.375 "gg sans", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    button, input, textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    /* Main layout: server rail | channels | chat | members */
    #app {
      display: grid;
      grid-template-columns: 72px 240px 1fr 240px;
      height: 100%;
    }

    /* Server rail (far left) */
    #rail {
      background: var(--rail);
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      overflow-y: auto;
    }

    .sv {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--main);
      border: 0;
      font-weight: 600;
      transition: .15s;
      flex: none;
      position: relative;
    }

    .sv:hover, .sv.on {
      border-radius: 16px;
      background: var(--accent);
      color: #fff;
    }

    .sv.on:before {
      content: "";
      position: absolute;
      left: -12px;
      top: 12px;
      width: 4px;
      height: 24px;
      background: #fff;
      border-radius: 0 4px 4px 0;
    }

    .sv.add {
      color: var(--accent);
      font-size: 24px;
    }

    .sv.add:hover {
      background: var(--accent);
      color: #fff;
    }

    .sep {
      width: 32px;
      height: 2px;
      background: var(--main);
      border-radius: 1px;
    }

    /* Channel sidebar */
    #side {
      background: var(--side);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #sh {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      border-bottom: 1px solid #0003;
      box-shadow: 0 1px 0 #0002;
    }

    #chl {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .lbl {
      display: flex;
      justify-content: space-between;
      color: var(--mute);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 12px 8px 4px;
    }

    .lbl button {
      background: none;
      border: 0;
      color: var(--mute);
      font-size: 18px;
      padding: 0;
    }

    .ch {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-radius: 4px;
      padding: 6px 8px;
      color: var(--mute);
      font-weight: 500;
    }

    .ch:hover {
      background: var(--hover);
      color: var(--text);
    }

    .ch.on {
      background: #4e505899;
      color: #fff;
    }

    /* Your user bar at the bottom of the sidebar */
    #me {
      background: #232428;
      height: 52px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #me .nm {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Icon buttons */
    .ib {
      background: none;
      border: 0;
      color: var(--mute);
      font-size: 18px;
      border-radius: 4px;
      padding: 4px 6px;
    }

    .ib:hover {
      background: var(--hover);
      color: var(--text);
    }

    /* Avatars */
    .av {
      border-radius: 50%;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #fff;
      flex: none;
    }

    /* Chat area */
    #main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    #ch {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      border-bottom: 1px solid #0003;
      flex: none;
    }

    #msgs {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
    }

    /* Messages */
    .msg {
      display: flex;
      gap: 16px;
      padding: 2px 16px 2px 16px;
      position: relative;
      margin-top: 16px;
    }

    .msg.grp {
      margin-top: 0;
    }

    .msg:hover {
      background: #0000000a;
    }

    .msg > div:first-child, .gt {
      width: 40px;
      flex: none;
    }

    .gt {
      font-size: 11px;
      color: var(--mute);
      visibility: hidden;
      text-align: right;
      line-height: 22px;
    }

    .msg:hover .gt {
      visibility: visible;
    }

    .mb {
      min-width: 0;
      flex: 1;
    }

    .mh {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .mh b {
      cursor: pointer;
    }

    .mh b:hover {
      text-decoration: underline;
    }

    .ts {
      font-size: 12px;
      color: var(--mute);
    }

    .mc {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .del {
      position: absolute;
      right: 16px;
      top: -8px;
      background: var(--side);
      border: 1px solid #0004;
      border-radius: 4px;
      display: none;
    }

    .msg:hover .del {
      display: block;
    }

    /* Premium styling: animated gradient name and badge */
    .pm {
      background: linear-gradient(90deg, #ff4d5a, #ffb347, #ffe29a, #ff4d5a);
      background-size: 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: fl 4s linear infinite;
    }

    @keyframes fl {
      to {
        background-position: 300%;
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .pm {
        animation: none;
      }
    }

    .badge {
      background: linear-gradient(135deg, #ff4d5a, #b3091a);
      color: #fff;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 700;
    }

    /* Message box */
    #comp {
      padding: 0 16px 24px;
      position: relative;
      flex: none;
    }

    #cbox {
      background: var(--input);
      border-radius: 8px;
      display: flex;
      align-items: flex-end;
      padding: 0 8px;
    }

    #inp {
      flex: 1;
      background: none;
      border: 0;
      outline: 0;
      resize: none;
      padding: 11px 8px;
      max-height: 200px;
      line-height: 22px;
    }

    #cnt {
      font-size: 11px;
      color: var(--red);
      padding: 0 16px;
      height: 14px;
    }

    /* Emoji picker */
    #emo {
      display: none;
      position: absolute;
      right: 16px;
      bottom: 64px;
      width: 300px;
      max-height: 260px;
      overflow-y: auto;
      background: var(--side);
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 8px 24px #0006;
      z-index: 5;
    }

    #emo.on {
      display: block;
    }

    #emo button {
      background: none;
      border: 0;
      font-size: 22px;
      width: 36px;
      height: 36px;
      border-radius: 4px;
    }

    #emo button:hover {
      background: var(--hover);
    }

    #emo p {
      margin: 6px 4px;
      font-size: 12px;
      color: var(--mute);
      font-weight: 600;
    }

    /* Member list (far right) */
    #mem {
      background: var(--side);
      overflow-y: auto;
      padding: 8px;
    }

    .mm {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }

    .mm:hover {
      background: var(--hover);
    }

    .mm.off {
      opacity: .45;
    }

    .dot {
      position: relative;
    }

    .dot i {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green);
      border: 3px solid var(--side);
    }

    .empty {
      margin: auto;
      text-align: center;
      color: var(--mute);
      padding: 24px;
      max-width: 380px;
    }

    /* Pop-up windows */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000a;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 16px;
    }

    #modal.on {
      display: flex;
    }

    .mbox {
      background: var(--main);
      border-radius: 8px;
      width: 440px;
      max-width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }

    .mbox h2 {
      margin: 0 0 4px;
    }

    .mbox p {
      color: var(--mute);
      margin: 0 0 16px;
    }

    /* Form fields and buttons */
    .f {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--mute);
      text-transform: uppercase;
      margin: 14px 0 6px;
    }

    .t {
      width: 100%;
      background: #1e1f22;
      border: 0;
      border-radius: 4px;
      padding: 10px;
      outline: 0;
    }

    .t:focus {
      outline: 2px solid var(--accent);
    }

    .b {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 9px 16px;
      font-weight: 500;
    }

    .b:hover {
      filter: brightness(.9);
    }

    .b.g {
      background: none;
      color: var(--text);
    }

    .b.r {
      background: var(--red);
    }

    .b.pr {
      background: linear-gradient(135deg, #ff4d5a, #b3091a);
    }

    .row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .err {
      color: var(--red);
      font-size: 14px;
      margin-top: 8px;
      min-height: 20px;
    }

    /* Login / signup screen */
    #auth {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 15%, #7a0a14 0, #050505 60%);
      padding: 16px;
    }

    .card {
      background: var(--main);
      padding: 32px;
      border-radius: 8px;
      width: 480px;
      max-width: 100%;
      box-shadow: 0 2px 10px #0004;
    }

    .card h1 {
      text-align: center;
      margin: 0 0 4px;
      font-size: 24px;
    }

    .card .sub {
      text-align: center;
      color: var(--mute);
      margin-bottom: 8px;
    }

    /* Profile card */
    .ban {
      height: 60px;
      border-radius: 8px 8px 0 0;
      margin: -24px -24px 0;
    }

    .pop {
      margin: -30px 0 0 16px;
      border: 6px solid var(--main);
      border-radius: 50%;
      width: 92px;
      height: 92px;
      overflow: hidden;
    }

    /* Colour swatches in settings */
    .sw {
      display: inline-block;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      margin: 0 6px 0 0;
      border: 2px solid transparent;
      cursor: pointer;
    }

    /* Smaller screens: hide panels */
    @media (max-width: 900px) {
      #app {
        grid-template-columns: 72px 200px 1fr;
      }
      #mem {
        display: none;
      }
    }

    @media (max-width: 560px) {
      #app {
        grid-template-columns: 60px 1fr;
      }
      #side {
        display: none;
      }
    }
  </style>
</head>

<body>
  <!-- Everything is drawn into #root by the script below -->
  <!-- Procord logo, drawn once and reused with <use href="#logo"> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="pc-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff4252"/>
        <stop offset="1" stop-color="#8f0b19"/>
      </linearGradient>
    </defs>
    <symbol id="logo" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="18" fill="url(#pc-grad)"/>
      <path d="M20 15h14a12 12 0 0 1 0 24h-6v10l-8-7z" fill="#fff"/>
      <circle cx="33" cy="27" r="4.5" fill="#a30f1e"/>
    </symbol>
  </svg>

  <div id="root"></div>
  <div id="modal"></div>

  <script>
    // ====== 1. PASTE YOUR SUPABASE KEYS (Project Settings > API) ======
    const SB_URL = "https://tfxnizwovbqamlzqeigm.supabase.co", SB_KEY = "sb_publishable_bUpHpK1CFRKxOXWYnPcirg_kqq0YZCr";
    // ==================================================================

    // ---------- Small helpers ----------
    const $ = s => document.querySelector(s);
    const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const colorFromName = s => {
      let h = 0;
      for (const c of s || '?')
        h = (h * 31 + c.charCodeAt(0)) % 360;
      return `hsl(${h} 50% 45%)`;
    };
    const avatarHtml = (p, n = 40) => p?.avatar_url ? `<img class="av" style="width:${n}px;height:${n}px" src="${escapeHtml(p.avatar_url)}" alt="">` : `<div class="av" style="width:${n}px;height:${n}px;background:${colorFromName(p?.username)};font-size:${n * .42}px">${escapeHtml((p?.username || '?')[0].toUpperCase())}</div>`;
    const nameHtml = p => `<b class="${p?.premium ? 'pm' : ''}" ${!p?.premium && p?.name_color ? `style="color:${escapeHtml(p.name_color)}"` : ''} onclick="showProfile('${p?.id}')">${escapeHtml(p?.username)}</b>${p?.premium ? ' <span class="badge">PREMIUM</span>' : ''}`;
    const formatDateTime = d => new Date(d).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
    const formatTime = d => new Date(d).toLocaleTimeString([], { timeStyle: 'short' });

    // ---------- App state ----------
    let supabaseClient;      // connection to Supabase
    let me;                  // the logged-in user's profile
    let servers = [];        // servers I belong to
    let cur = null;          // the selected server
    let channels = [];       // channels in that server
    let curCh = null;        // the selected channel
    let members = [];        // profiles of that server's members
    let msgs = [];           // messages in the open channel
    let online = new Set();  // ids of members who are online right now
    let rt = null;           // realtime subscription (new messages)
    let pr = null;           // presence subscription (who is online)

    // ---------- Pop-ups and themes ----------
    function modal(h) {
      const m = $('#modal');
      m.innerHTML = `<div class="mbox">${h}</div>`;
      m.classList.add('on');
      m.onmousedown = e => {
        if (e.target === m)
          closeM();
      };
    }

    function closeM() {
      $('#modal').classList.remove('on');
    }

    function theme(t) {
      document.documentElement.dataset.theme = t || 'dark';
    }

    // ---------- Startup: show setup help, or connect to Supabase ----------
    if (!SB_URL) {
      $('#root').innerHTML = `<div id="auth"><div class="card"><svg class="logo" width="64" height="64"><use href="#logo"/></svg><h1>Almost there</h1><p class="sub">Connect Supabase to start chatting.</p><ol style="line-height:1.8"><li>Create a project at supabase.com</li><li>Run <b>schema.sql</b> in the SQL Editor</li><li>Paste your Project URL and anon key at the top of this file's script</li><li>Auth &gt; Providers &gt; Email: turn off "Confirm email" for quick testing</li></ol></div></div>`;
    }
    else {
      supabaseClient = supabase.createClient(SB_URL, SB_KEY);
      supabaseClient.auth.onAuthStateChange((_e, s) => setTimeout(() => start(s), 0));
    }

    // ---------- After login: build the app shell ----------
    async function start(session) {
      if (!session) {
        me = null;
        return authView();
      }
      if (me && me.id === session.user.id)
        return;
      const { data } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
      me = data || { id: session.user.id, username: 'user' };
      theme(me.theme);
      $('#root').innerHTML = `
       <div id="app">
        <div id="rail"></div>
        <div id="side">
         <div id="sh"></div>
         <div id="chl"></div>
         <div id="me"></div>
        </div>
        <div id="main">
         <div id="ch"></div>
         <div id="msgs"></div>
         <div id="comp">
          <div id="emo"></div>
          <div id="cbox">
           <textarea id="inp" rows="1" placeholder="Message"></textarea>
           <button class="ib" onclick="$('#emo').classList.toggle('on')" title="Emoji">😀</button>
          </div>
          <div id="cnt"></div>
         </div>
        </div>
        <div id="mem"></div>
       </div>`;
      const inp = $('#inp');
      inp.onkeydown = e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      };
      inp.oninput = () => {
        inp.style.height = 'auto';
        inp.style.height = inp.scrollHeight + 'px';
        const l = me.premium ? 4000 : 2000, n = inp.value.length;
        $('#cnt').textContent = n > l - 200 ? `${n}/${l}${me.premium ? '' : ' – Premium allows 4000'}` : '';
      };
      buildEmoji();
      await loadServers();
    }

    // ---------- Login and sign-up ----------
    function authView(mode = 'in') {
      $('#root').innerHTML = `<div id="auth"><div class="card"><svg class="logo" width="64" height="64"><use href="#logo"/></svg><h1>${mode === 'in' ? 'Welcome back!' : 'Create an account'}</h1><div class="sub">${mode === 'in' ? "We're so excited to see you again!" : 'Join a community in seconds.'}</div>
     ${mode === 'up' ? `<label class="f">Username</label><input class="t" id="au">` : ''}<label class="f">Email</label><input class="t" id="ae" type="email"><label class="f">Password</label><input class="t" id="ap" type="password">
     <div class="err" id="aerr"></div><button class="b" style="width:100%;padding:12px" onclick="doAuth('${mode}')">${mode === 'in' ? 'Log in' : 'Continue'}</button>
     <p style="margin:16px 0 0;color:var(--mute)">${mode === 'in' ? 'Need an account?' : 'Already registered?'} <a href="#" style="color:#ff6b78" onclick="authView('${mode === 'in' ? 'up' : 'in'}');return false">${mode === 'in' ? 'Register' : 'Log in'}</a></p></div></div>`;
    }

    async function doAuth(mode) {
      const email = $('#ae').value.trim(), password = $('#ap').value;
      let r;
      if (mode === 'in')
        r = await supabaseClient.auth.signInWithPassword({ email, password });
      else {
        r = await supabaseClient.auth.signUp({ email, password });
        if (!r.error && r.data.user) {
          const u = $('#au').value.trim();
          if (u && r.data.session)
            await supabaseClient.from('profiles').update({ username: u }).eq('id', r.data.user.id);
        }
        if (!r.error && !r.data.session) {
          $('#aerr').style.color = 'var(--green)';
          return $('#aerr').textContent = 'Check your email to confirm, then log in.';
        }
      }
      if (r.error)
        $('#aerr').textContent = r.error.message;
    }

    // ---------- Loading data: servers, channels, messages, online status ----------
    async function loadServers(keep) {
      const { data } = await supabaseClient.from('members').select('servers(*)').eq('user_id', me.id);
      servers = (data || []).map(x => x.servers).filter(Boolean);
      if (!keep && servers.length)
        return selectServer(servers[0].id);
      if (!servers.length) {
        cur = null;
        channels = [];
        members = [];
        msgs = [];
      }
      renderAll();
    }

    async function selectServer(id) {
      cur = servers.find(s => s.id === id);
      const [c, m] = await Promise.all([supabaseClient.from('channels').select('*').eq('server_id', id).order('created_at'), supabaseClient.from('members').select('profiles(*)').eq('server_id', id)]);
      channels = c.data || [];
      members = (m.data || []).map(x => x.profiles).filter(Boolean);
      online = new Set();
      if (pr)
        supabaseClient.removeChannel(pr);
      pr = supabaseClient.channel('pres-' + id, { config: { presence: { key: me.id } } });
      pr.on('presence', { event: 'sync' }, () => {
        online = new Set(Object.keys(pr.presenceState()));
        renderMembers();
      }).subscribe(s => {
        if (s === 'SUBSCRIBED')
          pr.track({});
      });
      renderAll();
      if (channels.length)
        selectChannel(channels[0].id);
      else {
        curCh = null;
        msgs = [];
        renderChat();
      }
    }

    async function selectChannel(id) {
      curCh = channels.find(c => c.id === id);
      renderSide();
      const { data } = await supabaseClient.from('messages').select('*,profiles(*)').eq('channel_id', id).order('id', { ascending: false }).limit(60);
      msgs = (data || []).reverse();
      renderChat();
      if (rt)
        supabaseClient.removeChannel(rt);
      rt = supabaseClient.channel('msg-' + id).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'channel_id=eq.' + id }, async (p) => {
        if (msgs.some(m => m.id === p.new.id))
          return;
        const { data } = await supabaseClient.from('profiles').select('*').eq('id', p.new.user_id).single();
        addMsg({ ...p.new, profiles: data });
      })
        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, p => {
        msgs = msgs.filter(m => m.id !== p.old.id);
        renderChat(true);
      }).subscribe();
    }

    function addMsg(m) {
      if (msgs.some(x => x.id === m.id))
        return;
      msgs.push(m);
      renderChat();
    }

    // ---------- Drawing the screen ----------
    function renderAll() {
      renderRail();
      renderSide();
      renderChat();
      renderMembers();
      renderMe();
    }

    function renderRail() {
      $('#rail').innerHTML = `<div class="brand" title="Procord"><svg width="36" height="36"><use href="#logo"/></svg></div><div class="sep"></div>` + servers.map(s => `<button class="sv ${cur?.id === s.id ? 'on' : ''}" title="${escapeHtml(s.name)}" onclick="selectServer('${s.id}')">${escapeHtml(s.name.split(/\s+/).map(w => w[0]).join('').slice(0, 3).toUpperCase())}</button>`).join('') + `<div class="sep"></div><button class="sv add" title="Add a server" onclick="serverModal()">+</button>`;
    }

    function renderSide() {
      if (!cur) {
        $('#sh').textContent = 'Procord';
        $('#chl').innerHTML = '';
        return;
      }
      const own = cur.owner_id === me.id;
      $('#sh').innerHTML = `<span>${escapeHtml(cur.name)}</span><button class="ib" title="Server menu" onclick="serverMenu()">⋯</button>`;
      $('#chl').innerHTML = `<div class="lbl">Text channels ${own ? '<button title="Create channel" onclick="channelModal()">+</button>' : ''}</div>` + channels.map(c => `<button class="ch ${curCh?.id === c.id ? 'on' : ''}" onclick="selectChannel('${c.id}')"># ${escapeHtml(c.name)}</button>`).join('');
    }

    function renderMe() {
      $('#me').innerHTML = `<div class="dot">${avatarHtml(me, 32)}</div><div class="nm"><span class="${me.premium ? 'pm' : ''}">${escapeHtml(me.username)}</span></div><button class="ib" title="Settings" onclick="settings()">⚙</button>`;
    }

    function renderChat(keep) {
      const el = $('#msgs'), ch = $('#ch'), comp = $('#comp');
      if (!el)
        return;
      if (!cur) {
        ch.innerHTML = 'Home';
        comp.style.display = 'none';
        el.innerHTML = `<div class="empty"><h2>No servers yet</h2><p>Create your own space or join one with an invite code.</p><button class="b" onclick="serverModal()">Create or join a server</button></div>`;
        return;
      }
      comp.style.display = '';
      ch.innerHTML = `<span style="color:var(--mute);font-size:22px">#</span> ${escapeHtml(curCh?.name || '')}`;
      $('#inp').placeholder = curCh ? `Message #${curCh.name}` : 'Message';
      const bottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120 || !keep;
      el.innerHTML = msgs.length ? msgs.map((m, i) => {
        const p = m.profiles || {}, pv = msgs[i - 1], g = pv && pv.user_id === m.user_id && new Date(m.created_at) - new Date(pv.created_at) < 3e5;
        return `<div class="msg ${g ? 'grp' : ''}">${g ? `<span class="gt">${formatTime(m.created_at)}</span>` : `<div>${avatarHtml(p)}</div>`}<div class="mb">${g ? '' : `<div class="mh">${nameHtml(p)} <span class="ts">${formatDateTime(m.created_at)}</span></div>`}<div class="mc">${escapeHtml(m.content)}</div></div>${m.user_id === me.id ? `<button class="del ib" onclick="delMsg(${m.id})" title="Delete">🗑</button>` : ''}</div>`;
      }).join('') : `<div class="empty"><h2>Welcome to #${escapeHtml(curCh?.name || '')}</h2><p>This is the start of the channel.</p></div>`;
      if (bottom)
        el.scrollTop = el.scrollHeight;
    }

    function renderMembers() {
      const m = $('#mem');
      if (!m)
        return;
      const on = members.filter(x => online.has(x.id)), off = members.filter(x => !online.has(x.id));
      const row = (p, o) => `<div class="mm ${o ? '' : 'off'}" onclick="showProfile('${p.id}')"><div class="${o ? 'dot' : ''}">${avatarHtml(p, 32)}${o ? '<i></i>' : ''}</div>${p.premium ? `<span class="pm">${escapeHtml(p.username)}</span>` : escapeHtml(p.username)}</div>`;
      m.innerHTML = cur ? `<div class="lbl">Online — ${on.length}</div>${on.map(p => row(p, 1)).join('')}<div class="lbl">Offline — ${off.length}</div>${off.map(p => row(p, 0)).join('')}` : '';
    }

    // ---------- Sending and deleting messages ----------
    async function send() {
      const inp = $('#inp'), t = inp.value.trim(), lim = me.premium ? 4000 : 2000;
      if (!t || !curCh)
        return;
      if (t.length > lim)
        return alert(`Messages are limited to ${lim} characters.`);
      inp.value = '';
      inp.style.height = 'auto';
      $('#cnt').textContent = '';
      const { data, error } = await supabaseClient.from('messages').insert({ channel_id: curCh.id, content: t }).select('*,profiles(*)').single();
      if (error) {
        inp.value = t;
        return alert(error.message);
      }
      addMsg(data);
    }

    async function delMsg(id) {
      await supabaseClient.from('messages').delete().eq('id', id);
      msgs = msgs.filter(m => m.id !== id);
      renderChat(true);
    }

    // ---------- Emoji picker ----------
    const EMO = ['😀', '😂', '🥹', '😍', '😎', '🤔', '😭', '😡', '👍', '👎', '🙏', '🔥', '🎉', '💀', '❤️', '✨', '👀', '🚀'];
    const EMO_P = ['🪩', '🦄', '🐉', '🛸', '🧿', '🌈', '🍕', '🎮', '🎧', '🏆', '💎', '👑', '🧠', '🫡', '🥳', '🤩', '😈', '🦊'];

    function buildEmoji() {
      $('#emo').innerHTML = `<p>Standard</p>${EMO.map(e => `<button onclick="ins('${e}')">${e}</button>`).join('')}<p>Premium pack ${me.premium ? '' : '🔒'}</p>${EMO_P.map(e => me.premium ? `<button onclick="ins('${e}')">${e}</button>` : `<button style="opacity:.35" onclick="settings()">${e}</button>`).join('')}`;
    }

    function ins(e) {
      const i = $('#inp');
      i.value += e;
      i.focus();
      $('#emo').classList.remove('on');
    }

    // ---------- Servers and channels ----------
    function serverModal() {
      modal(`<h2>Create or join a server</h2><p>Your server is where you and your friends hang out.</p>
    <label class="f">Server name</label><input class="t" id="sn" placeholder="${escapeHtml(me.username)}'s server"><div class="row"><button class="b" onclick="createServer()">Create</button></div>
    <label class="f">Have an invite code?</label><input class="t" id="ic" placeholder="e.g. a1b2c3d4"><div class="err" id="merr"></div><div class="row"><button class="b g" onclick="closeM()">Cancel</button><button class="b" onclick="joinServer()">Join server</button></div>`);
    }

    async function createServer() {
      const name = $('#sn').value.trim() || `${me.username}'s server`;
      const { data, error } = await supabaseClient.from('servers').insert({ name }).select().single();
      if (error)
        return $('#merr').textContent = error.message;
      closeM();
      await loadServers(true);
      selectServer(data.id);
    }

    async function joinServer() {
      const { data, error } = await supabaseClient.rpc('join_server', { code: $('#ic').value.trim() });
      if (error)
        return $('#merr').textContent = error.message;
      closeM();
      await loadServers(true);
      selectServer(data);
    }

    function channelModal() {
      modal(`<h2>Create channel</h2><label class="f">Channel name</label><input class="t" id="cn" placeholder="new-channel"><div class="row"><button class="b g" onclick="closeM()">Cancel</button><button class="b" onclick="createChannel()">Create channel</button></div>`);
    }

    async function createChannel() {
      const name = $('#cn').value.trim().toLowerCase().replace(/\s+/g, '-');
      if (!name)
        return;
      const { data, error } = await supabaseClient.from('channels').insert({ server_id: cur.id, name }).select().single();
      if (error)
        return alert(error.message);
      channels.push(data);
      closeM();
      selectChannel(data.id);
    }

    function serverMenu() {
      const own = cur.owner_id === me.id;
      modal(`<h2>${escapeHtml(cur.name)}</h2><p>Share this invite code with friends.</p><input class="t" readonly value="${cur.invite_code}" onfocus="this.select()">
     <div class="row"><button class="b g" onclick="closeM()">Close</button>${own ? `<button class="b r" onclick="delServer()">Delete server</button>` : `<button class="b r" onclick="leave()">Leave server</button>`}</div>`);
    }

    async function delServer() {
      if (!confirm('Delete this server and all its messages?'))
        return;
      await supabaseClient.from('servers').delete().eq('id', cur.id);
      closeM();
      loadServers();
    }

    async function leave() {
      await supabaseClient.from('members').delete().eq('server_id', cur.id).eq('user_id', me.id);
      closeM();
      loadServers();
    }

    // ---------- Profiles, settings and Premium ----------
    function showProfile(id) {
      const p = members.find(x => x.id === id) || msgs.find(m => m.user_id === id)?.profiles || (id === me.id ? me : null);
      if (!p)
        return;
      modal(`<div class="ban" style="background:${p.premium && p.banner_color !== '#5865f2' ? escapeHtml(p.banner_color) : '#e11d2e'}"></div><div class="pop">${avatarHtml(p, 80)}</div>
     <h2 style="margin-top:8px">${nameHtml(p)}</h2><p style="margin:0">${escapeHtml(p.bio || 'No bio yet.')}</p><div class="row"><button class="b g" onclick="closeM()">Close</button></div>`);
    }

    function settings() {
      const sw = ['#e11d2e', '#ff6a00', '#f0b132', '#23a559', '#9b5de5', '#00a8fc'];
      modal(`<h2>My account</h2><p>${me.premium ? 'Premium is active. Enjoy the perks.' : 'Premium unlocks a gradient name, banner colour, themes, 4000-char messages and the extra emoji pack.'}</p>
     <label class="f">Username</label><input class="t" id="su" value="${escapeHtml(me.username)}"><label class="f">Avatar URL (GIFs animate)</label><input class="t" id="sa" value="${escapeHtml(me.avatar_url || '')}">
     <label class="f">About me</label><input class="t" id="sbio" value="${escapeHtml(me.bio || '')}" maxlength="190">
     <label class="f">Profile banner ${me.premium ? '' : '🔒'}</label>${sw.map(c => `<span class="sw" style="background:${c};${me.banner_color === c ? 'border-color:#fff' : ''}" onclick="${me.premium ? `me.banner_color='${c}';settings()` : ''}"></span>`).join('')}
     <label class="f">Theme ${me.premium ? '' : '🔒'}</label><div>${['dark', 'midnight', 'sunset'].map(t => `<button class="b ${me.theme === t ? '' : 'g'}" ${me.premium ? '' : 'disabled'} onclick="me.theme='${t}';theme('${t}');settings()">${t}</button>`).join(' ')}</div>
     <div class="err" id="serr"></div><div class="row"><button class="b r" onclick="supabaseClient.auth.signOut()">Log out</button>${me.premium ? `<button class="b g" onclick="setPrem(false)">Cancel Premium</button>` : `<button class="b pr" onclick="setPrem(true)">Get Premium (demo)</button>`}<button class="b" onclick="saveProfile()">Save changes</button></div>`);
    }

    async function setPrem(v) {
      me.premium = v;
      if (!v)
        me.theme = 'dark', theme('dark');
      await saveProfile(1);
      buildEmoji();
      settings();
    }

    async function saveProfile(quiet) {
      const u = { username: $('#su')?.value.trim() || me.username, avatar_url: $('#sa')?.value.trim() || null, bio: $('#sbio')?.value || '', banner_color: me.banner_color, premium: me.premium, theme: me.theme };
      const { error } = await supabaseClient.from('profiles').update(u).eq('id', me.id);
      if (error)
        return $('#serr').textContent = error.message;
      Object.assign(me, u);
      const i = members.findIndex(x => x.id === me.id);
      if (i > -1)
        members[i] = { ...me };
      if (!quiet)
        closeM();
      renderMe();
      renderMembers();
      renderChat(true);
    }
  </script>
</body>
</html>
