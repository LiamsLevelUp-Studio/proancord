    function categoryModal() {
      if (!cur) return;
      modal(`<button class="ib mx" onclick="closeM()" title="Close">✕</button><h2>Create Category</h2>
        <span class="f2">Category Name</span>
        <div class="nm2"><input id="cn" placeholder="New Category" oninput="$('#cgo').disabled=!this.value.trim()"></div>
        <div class="lockrow"><div><b>🔒 Private Category</b><small>Only you, the server owner, will be able to view this category. Channels inside it follow this setting.</small></div><input type="checkbox" class="tg" id="cpv"></div>
        <div class="err" id="merr"></div>
        <div class="row"><button class="b g" onclick="closeM()">Cancel</button><button class="b" id="cgo" disabled onclick="createCategory()">Create Category</button></div>`);
      setTimeout(() => { const i = $('#cn'); if (i) i.focus(); }, 50);
    }

    async function createCategory() {
      const name = $('#cn').value.trim();
      if (!name) return;
      if (catList.some(c => c.toLowerCase() === name.toLowerCase())) return $('#merr').textContent = 'That category already exists.';
      const { data, error } = await supabaseClient.from('categories').insert({ server_id: cur.id, name, private: $('#cpv').checked }).select().single();
      if (error) return $('#merr').textContent = error.message + ' (Run update3.sql in Supabase first.)';
      cats.push(data);
      closeM();
      renderSide();
    }

    const uuid = () => crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });

    async function createChannel() {
      const name = $('#cn').value.trim().toLowerCase().replace(/\s+/g, '-');
      if (!name) return;
      const category = $('#cc').value.trim() || 'Text channels';
      const row = { id: uuid(), server_id: cur.id, name, kind: document.querySelector('input[name=ck]:checked').value, category, private: $('#cpv').checked || !!cats.find(c => c.name === category)?.private };
      // no .select() here: asking the database to send the new row back needs an extra permission check
      const { error } = await supabaseClient.from('channels').insert(row);
      if (error) return $('#merr').textContent = error.message + ' (If this mentions row-level security, run fix-channels.sql in Supabase.)';
      const data = { ...row, topic: '', created_at: new Date().toISOString() };
      const rids = [...document.querySelectorAll('.rolechk:checked')].map(i => i.value);
      if (row.private && rids.length) await supabaseClient.from('channel_roles').insert(rids.map(role_id => ({ channel_id: data.id, role_id })));
      channels.push(data);
      closeM();
      selectChannel(data.id);
    }

    async function channelSettings(id) {
      const c = channels.find(x => x.id === id);
      const { data } = await supabaseClient.from('channel_roles').select('role_id').eq('channel_id', id);
      const sel = (data || []).map(x => x.role_id);
      modal(`<button class="ib mx" onclick="closeM()" title="Close">✕</button><h2>Channel settings</h2><p>${ICON[c.kind] || '#'} ${escapeHtml(c.name)}</p>
        <label class="f">Channel type</label><select class="t" id="ck">${kindOptions(c.kind)}</select>
        <label class="f">Channel name</label><input class="t" id="cn" value="${escapeHtml(c.name)}">
        <label class="f">Category</label><input class="t" id="cc" list="cats" value="${escapeHtml(c.category || 'Text channels')}">${catOptions()}
        <label class="f">Topic</label><input class="t" id="ct" maxlength="120" value="${escapeHtml(c.topic || '')}">
        <div class="lockrow"><div><b>🔒 Private Channel</b><small>Only you and the roles you choose will be able to view this channel.</small></div><input type="checkbox" class="tg" id="cpv" ${c.private ? 'checked' : ''} onchange="$('#crl').style.display=this.checked?'block':'none'"></div>
        <div id="crl" style="display:${c.private ? 'block' : 'none'}">${roleChecks(sel)}</div>
        <div class="err" id="merr"></div><div class="row"><button class="b r" onclick="delChannel('${id}')">Delete channel</button><button class="b g" onclick="closeM()">Cancel</button><button class="b" onclick="saveChannel('${id}')">Save</button></div>`);
    }

    async function saveChannel(id) {
      const u = { name: $('#cn').value.trim().toLowerCase().replace(/\s+/g, '-') || 'channel', kind: $('#ck').value, category: $('#cc').value.trim() || 'Text channels', topic: $('#ct').value.trim(), private: $('#cpv').checked };
      const { error } = await supabaseClient.from('channels').update(u).eq('id', id);
      if (error) return $('#merr').textContent = error.message;
      await supabaseClient.from('channel_roles').delete().eq('channel_id', id);
      const rids = [...document.querySelectorAll('.rolechk:checked')].map(i => i.value);
      if (u.private && rids.length) await supabaseClient.from('channel_roles').insert(rids.map(role_id => ({ channel_id: id, role_id })));
      Object.assign(channels.find(x => x.id === id), u);
      if (curCh?.id === id) curCh = channels.find(x => x.id === id);
      closeM(); renderSide(); renderChat(true);
    }

    async function delChannel(id) {
      if (!confirm('Delete this channel and all its messages?')) return;
      await supabaseClient.from('channels').delete().eq('id', id);
      channels = channels.filter(x => x.id !== id);
      closeM();
      if (curCh?.id !== id) return renderSide();
      if (channels.length) return selectChannel(channels[0].id);
      curCh = null; msgs = []; renderSide(); renderChat();
    }

    // ---------- Uploads ----------
    async function uploadFile(file) {
      if (file.size > MAX_UPLOAD) { toast('That file is over 1 GB.'); return null; }
      const path = `${me.id}/${Date.now()}-${file.name.replace(/[^\w.-]/g, '_')}`;
      const { error } = await supabaseClient.storage.from('uploads').upload(path, file);
      if (error) { toast(error.message); return null; }
      return supabaseClient.storage.from('uploads').getPublicUrl(path).data.publicUrl;
    }

    async function attach(input) {
      const f = input.files[0];
      input.value = '';
      if (!f || (!curCh && !dmWith)) return;
      toast('Uploading ' + f.name + '…');
      const url = await uploadFile(f);
      if (!url) return;
      const { data, error } = await postMessage({ content: $('#inp').value.trim(), attachment_url: url, attachment_name: f.name });
      if (error) return toast(error.message);
      $('#inp').value = '';
      addMsg(data);
    }

    function pickImage(targetId) {
      const i = document.createElement('input');
      i.type = 'file'; i.accept = 'image/*';
      i.onchange = async () => {
        if (!i.files[0]) return;
        toast('Uploading…');
        const url = await uploadFile(i.files[0]);
        if (url) { $('#' + targetId).value = url; $('#' + targetId).dispatchEvent(new Event('input')); toast('Uploaded'); }
      };
      i.click();
    }

    function attHtml(m) {
      if (!m.attachment_url) return '';
      const u = escapeHtml(m.attachment_url), n = escapeHtml(m.attachment_name || 'file');
      if (/\.(png|jpe?g|gif|webp|avif|svg)$/i.test(n)) return `<div><img class="att" src="${u}" alt="${n}" loading="lazy"></div>`;
      if (/\.(mp4|webm|mov|m4v)$/i.test(n)) return `<div><video class="att" src="${u}" controls preload="metadata"></video></div>`;
      if (/\.(mp3|wav|ogg|m4a)$/i.test(n)) return `<div><audio src="${u}" controls></audio></div>`;
      return `<a class="file" href="${u}" target="_blank" rel="noopener noreferrer">📄 ${n}</a>`;
    }


    async function delServer() {
      if (!confirm('Delete this server and all its messages?'))
        return;
      await supabaseClient.from('servers').delete().eq('id', cur.id);
      closeM();
      loadServers();
    }

    async function leave() {
      await supabaseClient.from('members').delete().eq('server_id', cur.id).eq('user_id', me.id);
      closeM();
      loadServers();
    }

    // ---------- Profiles and settings ----------
    const profileCardHtml = p => `<div class="ban" style="background:${p.banner_url ? `url('${escapeHtml(p.banner_url)}') center/cover` : `linear-gradient(135deg,${escapeHtml(p.banner_color || '#e11d2e')},#000)`}"></div><div class="pop">${avatarHtml(p, 80)}</div><h2 style="margin:8px 0 0">${escapeHtml(p.username)} <span class="badge">PLUS</span>${badgePills(p, true)}</h2><p style="margin:4px 0 0">${escapeHtml(p.bio || '')}</p>`;

    function showProfile(id) {
      const p = members.find(x => x.id === id) || msgs.find(m => m.user_id === id)?.profiles || (id === me.id ? me : null);
      if (!p) return;
      const acts = id === me.id ? '' : myFriends().some(f => f.id === id) ? `<button class="b" onclick="closeM();openDM('${id}')">Message</button>` : `<button class="b" onclick="quickAdd('${id}')">Add Friend</button>`;
      modal(profileCardHtml(p) + `<div class="row"><button class="b g" onclick="closeM()">Close</button>${acts}</div>`);
    }

    function closeSet() {
      if (tdraft) { tdraft = null; applyS(); }
      const e = $('#set');
      if (e) e.remove();
    }

    async function revealEmail() {
      const { data } = await supabaseClient.auth.getUser();
      $('#em2').textContent = data.user.email;
      $('#rev').remove();
    }

    function settings(tab = 'account') {
      const NAV = [['User settings'], ['account', 'My account'], ['profile', 'Profiles'], ['server', 'Server profile'], ['App settings'], ['appearance', 'Theme'], ['look', 'App Icon & Text'], ['access', 'Accessibility'], ['notifications', 'Notifications'], ['perks', 'Perks']];
      const chk = (k, label) => `<label class="opt"><span>${label}</span><input type="checkbox" ${S[k] ? 'checked' : ''} onchange="S.${k}=this.checked;saveS();renderChat(true)"></label>`;
      const field = (id, label, val, ev = '') => `<label class="f">${label}</label><input class="t" id="${id}" value="${escapeHtml(val || '')}" ${ev}>`;
      const upl = (id, label, val, ev = '') => `<label class="f">${label}</label><div style="display:flex;gap:8px"><input class="t" id="${id}" value="${escapeHtml(val || '')}" ${ev}><button class="b g" onclick="pickImage('${id}')">Upload</button></div>`;
      const perk = (a, b) => `<div class="perk"><span>${a}</span><i>${b}</i></div>`;
      const pages = {
        account: ['My account', `<div class="card2"><div class="srow"><div><b>Username</b>${escapeHtml(me.username)}</div><button class="b g" onclick="settings('profile')">Edit</button></div>
          <div class="srow"><div><b>Email</b><span id="em2">••••••••••</span> <a href="#" id="rev" style="color:#ff6b78" onclick="revealEmail();return false">Reveal</a></div></div></div>
          <h3>Password and security</h3><div class="card2"><label class="f" style="margin-top:0">New password</label><input class="t" id="np" type="password" placeholder="At least 6 characters"><div class="err" id="serr"></div><div class="row" style="margin-top:8px"><button class="b" onclick="changePw()">Change password</button></div></div>
          <h3>Account removal</h3><p>Deleting your account permanently removes your profile, your messages and every server you own.</p><button class="b r" onclick="deleteModal()">Delete account</button>`],
        profile: ['Profiles', `<div class="card2 pc" id="pv"></div>${field('su', 'Username', me.username, 'maxlength="32" oninput="pv()"')}
          ${upl('sa', 'Avatar (URL or upload; GIFs animate)', me.avatar_url, 'oninput="pv()"')}${upl('sbn', 'Profile banner image', me.banner_url, 'oninput="pv()"')}
          <label class="f">Profile theme colour</label><input type="color" id="sbc" value="${me.banner_color || '#e11d2e'}" oninput="pv()">
          <label class="f">About me</label><textarea class="t" id="sbio" rows="3" maxlength="190" oninput="pv()">${escapeHtml(me.bio || '')}</textarea>
          <label class="f">Status</label><select class="t" id="sst">${[['online', 'Online'], ['idle', 'Idle'], ['dnd', 'Do not disturb'], ['invisible', 'Invisible']].map(([v, l]) => `<option value="${v}" ${S.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
          <div class="err" id="serr"></div><div class="row"><button class="b" onclick="saveProfile()">Save changes</button></div>`],
        server: ['Server profile', cur ? `<p>A different name, avatar, banner and bio, shown only in <b>${escapeHtml(cur.name)}</b>. Leave a field empty to use your main profile.</p>
          ${field('sn', 'Server nickname', mySP.nick, 'maxlength="32"')}${upl('sav', 'Server avatar', mySP.avatar_url)}${upl('sbn2', 'Server banner', mySP.banner_url)}${field('sbi', 'Server bio', mySP.bio, 'maxlength="190"')}
          <div class="err" id="serr"></div><div class="row"><button class="b" onclick="saveServerProfile()">Save server profile</button></div>` : '<p>Open a server first, then come back here.</p>'],
        appearance: ['Theme', themePageHtml()],
    look: ['App Icon & Text', `<label class="f">Accent colour (overrides the theme's accent)</label><div style="display:flex;align-items:center">${ACCENTS.map(c => `<span class="sw" style="background:${c};${S.accent === c ? 'border-color:#fff' : ''}" onclick="S.accent='${c}';saveS();settings('look')"></span>`).join('')}<input type="color" value="${safeColor(S.accent || currentTheme().accent)}" oninput="S.accent=this.value;saveS()"><button class="b g" style="margin-left:8px" onclick="S.accent=null;saveS();settings('look')">Reset</button></div>
      <label class="f">App icon</label><div>${Object.keys(ICONS).map(k => `<button class="b ${S.icon === k ? '' : 'g'}" onclick="S.icon='${k}';saveS();settings('look')">${k}</button>`).join(' ')}</div>
      <label class="f">Chat font size: <span id="fsv">${S.fs}</span>px</label><input type="range" min="12" max="20" value="${S.fs}" style="width:100%;accent-color:var(--accent)" oninput="S.fs=+this.value;$('#fsv').textContent=this.value;saveS()">
      ${chk('compact', 'Compact message spacing')}`],
    access: ['Accessibility', `${chk('anim', 'Animations')}${chk('h24', '24-hour clock')}`],
        notifications: ['Notifications', `${chk('sound', 'Play a sound for new messages')}<div class="row"><button class="b g" onclick="beep()">Test sound</button></div>`],
        perks: ['Perks', `<p>Every Nitro-style perk that can run on a website is unlocked for everyone, free.</p>
          ${perk('4,000-character messages', 'Unlocked')}${perk('File uploads up to 1 GB', 'Unlocked (limited by your Supabase plan)')}${perk('Animated avatars', 'Unlocked')}${perk('Profile banners', 'Unlocked')}${perk('Custom profile themes', 'Unlocked')}${perk('Server-specific profiles', 'Unlocked')}${perk('Custom app icons', 'Unlocked')}${perk('Custom app colour themes', 'Unlocked')}${perk('Join any number of servers', 'Unlocked')}${perk('Profile badge', 'Unlocked')}
          <h3>Not available</h3>${perk('Custom emojis, stickers, super reactions', 'Not built yet')}${perk('Custom video backgrounds', 'Not built yet')}${perk('HD video streaming, soundboard', 'Needs a calling service')}${perk('Server boosts', 'Not applicable')}`]
      };
      const [title, body] = pages[tab];
      const nav = NAV.map(n => n.length === 1 ? `<div class="sg">${n[0]}</div>` : `<button class="sn ${n[0] === tab ? 'on' : ''}" onclick="settings('${n[0]}')">${n[1]}</button>`).join('');
      const mob = `<div class="tabs mob">${NAV.filter(n => n.length > 1).map(n => `<button class="tab ${n[0] === tab ? 'on' : ''}" onclick="settings('${n[0]}')">${n[1]}</button>`).join('')}</div>`;
      let el = $('#set');
      if (!el) { el = document.createElement('div'); el.id = 'set'; document.body.append(el); }
      el.innerHTML = `<div id="setnav"><div>${nav}<div class="sg"></div><button class="sn" style="color:#ff6b78" onclick="logout()">Log out</button></div></div><div id="setmain"><div>${mob}<h2>${title}</h2>${body}</div></div><button id="setx" title="Close (Esc)" onclick="closeSet()">✕</button>`;
      if (tab === 'profile') pv();
    }

    async function changePw() {
      const p = $('#np').value;
      if (p.length < 6) return $('#serr').textContent = 'Password must be at least 6 characters.';
      const { error } = await supabaseClient.auth.updateUser({ password: p });
      if (error) return $('#serr').textContent = error.message;
      $('#np').value = ''; toast('Password updated');
    }

    function deleteModal() {
      modal(`<h2>Delete account</h2><p>This cannot be undone. Type your username <b>${escapeHtml(me.username)}</b> to confirm.</p><input class="t" id="dc"><div class="err" id="serr"></div><div class="row"><button class="b g" onclick="settings('security')">Cancel</button><button class="b r" onclick="deleteAccount()">Delete my account</button></div>`);
    }

    async function deleteAccount() {
      if ($('#dc').value.trim() !== me.username) return $('#serr').textContent = 'That does not match your username.';
      const { error } = await supabaseClient.rpc('delete_account');
      if (error) return $('#serr').textContent = error.message + ' (Run update.sql in Supabase first.)';
      closeM();
      await supabaseClient.auth.signOut({ scope: 'local' });
      toast('Your account was deleted');
    }


    async function saveProfile() {
      const v = id => $('#' + id).value.trim() || null;
      const u = { username: $('#su').value.trim() || me.username, avatar_url: v('sa'), banner_url: v('sbn'), banner_color: $('#sbc').value, bio: $('#sbio').value };
      S.status = $('#sst').value; saveS();
      if (pr) pr.track({ status: S.status });
  if (gp) gp.track({ status: S.status });
      const { error } = await supabaseClient.from('profiles').update(u).eq('id', me.id);
      if (error) return $('#serr').textContent = error.message + ' (Run update2.sql in Supabase first.)';
      Object.assign(me, u);
      if (cur) await loadMembers();
      msgs.forEach(m => { if (m.user_id === me.id) m.profiles = { ...me }; });
      toast('Changes saved');
      renderMe(); renderMembers(); renderChat(true);
    }

    async function saveServerProfile() {
      const v = id => $('#' + id).value.trim() || null;
      const u = { nick: v('sn'), avatar_url: v('sav'), banner_url: v('sbn2'), bio: v('sbi') };
      const { error } = await supabaseClient.from('members').update(u).eq('server_id', cur.id).eq('user_id', me.id);
      if (error) return $('#serr').textContent = error.message + ' (Run update2.sql in Supabase first.)';
      await loadMembers();
      renderMembers(); renderChat(true); toast('Server profile saved');
    }
  </script>
</body>
</html>
