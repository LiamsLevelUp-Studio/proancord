<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procord</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23d6182a'/%3E%3Cpath d='M20 15h14a12 12 0 0 1 0 24h-6v10l-8-7z' fill='%23fff'/%3E%3C/svg%3E">

  <!-- Supabase client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <style>
    /* Colour palette (dark by default; themes override it below) */
    :root {
      --rail: #050505;
      --side: #0e0e0f;
      --main: #151516;
      --input: #1e1e20;
      --hover: #1b1b1d;
      --text: #efe9e9;
      --mute: #9a9091;
      --accent: #e11d2e;
      --green: #23a559;
      --red: #f23f43;
    }

    [data-theme=midnight] {
      --accent: #ff2d55;
      --rail: #000;
      --side: #08080d;
      --main: #0e0e16;
      --input: #191925;
      --hover: #151520;
    }

    [data-theme=sunset] {
      --accent: #e8590c;
      --main: #2f2a2e;
      --side: #272226;
      --rail: #1c181b;
      --input: #3a3339;
      --hover: #352f34;
    }

    /* Base page styles */
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #2a1114;
      border-radius: 4px;
    }

    .brand {
      width: 48px;
      height: 48px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card .logo {
      display: block;
      margin: 0 auto 12px;
    }

    body {
      background: var(--main);
      color: var(--text);
      font: 16px/1.375 "gg sans", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    button, input, textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    /* Main layout: server rail | channels | chat | members */
    #app {
      display: grid;
      grid-template-columns: 72px 240px 1fr 240px;
      height: 100%;
    }

    /* Server rail (far left) */
    #rail {
      background: var(--rail);
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      overflow-y: auto;
    }

    .sv {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--main);
      border: 0;
      font-weight: 600;
      transition: .15s;
      flex: none;
      position: relative;
    }

    .sv:hover, .sv.on {
      border-radius: 16px;
      background: var(--accent);
      color: #fff;
    }

    .sv.on:before {
      content: "";
      position: absolute;
      left: -12px;
      top: 12px;
      width: 4px;
      height: 24px;
      background: #fff;
      border-radius: 0 4px 4px 0;
    }

    .sv.add {
      color: var(--accent);
      font-size: 24px;
    }

    .sv.add:hover {
      background: var(--accent);
      color: #fff;
    }

    .sep {
      width: 32px;
      height: 2px;
      background: var(--main);
      border-radius: 1px;
    }

    /* Channel sidebar */
    #side {
      background: var(--side);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #sh {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      border-bottom: 1px solid #0003;
      box-shadow: 0 1px 0 #0002;
    }

    #chl {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .lbl {
      display: flex;
      justify-content: space-between;
      color: var(--mute);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 12px 8px 4px;
    }

    .lbl button {
      background: none;
      border: 0;
      color: var(--mute);
      font-size: 18px;
      padding: 0;
    }

    .ch {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-radius: 4px;
      padding: 6px 8px;
      color: var(--mute);
      font-weight: 500;
    }

    .ch:hover {
      background: var(--hover);
      color: var(--text);
    }

    .ch.on {
      background: #4e505899;
      color: #fff;
    }

    /* Your user bar at the bottom of the sidebar */
    #me {
      background: #232428;
      height: 52px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #me .nm {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Icon buttons */
    .ib {
      background: none;
      border: 0;
      color: var(--mute);
      font-size: 18px;
      border-radius: 4px;
      padding: 4px 6px;
    }

    .ib:hover {
      background: var(--hover);
      color: var(--text);
    }

    /* Avatars */
    .av {
      border-radius: 50%;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #fff;
      flex: none;
    }

    /* Chat area */
    #main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    #ch {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      border-bottom: 1px solid #0003;
      flex: none;
    }

    #msgs {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
    }

    /* Messages */
    .msg {
      display: flex;
      gap: 16px;
      padding: 2px 16px 2px 16px;
      position: relative;
      margin-top: 16px;
    }

    .msg.grp {
      margin-top: 0;
    }

    .msg:hover {
      background: #0000000a;
    }

    .msg > div:first-child, .gt {
      width: 40px;
      flex: none;
    }

    .gt {
      font-size: 11px;
      color: var(--mute);
      visibility: hidden;
      text-align: right;
      line-height: 22px;
    }

    .msg:hover .gt {
      visibility: visible;
    }

    .mb {
      min-width: 0;
      flex: 1;
    }

    .mh {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .mh b {
      cursor: pointer;
    }

    .mh b:hover {
      text-decoration: underline;
    }

    .ts {
      font-size: 12px;
      color: var(--mute);
    }

    .mc {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .del {
      position: absolute;
      right: 16px;
      top: -8px;
      background: var(--side);
      border: 1px solid #0004;
      border-radius: 4px;
      display: none;
    }

    .msg:hover .del {
      display: block;
    }


    /* Message box */
    #comp {
      padding: 0 16px 24px;
      position: relative;
      flex: none;
    }

    #cbox {
      background: var(--input);
      border-radius: 8px;
      display: flex;
      align-items: flex-end;
      padding: 0 8px;
    }

    #inp {
      flex: 1;
      background: none;
      border: 0;
      outline: 0;
      resize: none;
      padding: 11px 8px;
      max-height: 200px;
      line-height: 22px;
    }

    #cnt {
      font-size: 11px;
      color: var(--red);
      padding: 0 16px;
      height: 14px;
    }

    /* Emoji picker */
    #emo {
      display: none;
      position: absolute;
      right: 16px;
      bottom: 64px;
      width: 300px;
      max-height: 260px;
      overflow-y: auto;
      background: var(--side);
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 8px 24px #0006;
      z-index: 5;
    }

    #emo.on {
      display: block;
    }

    #emo button {
      background: none;
      border: 0;
      font-size: 22px;
      width: 36px;
      height: 36px;
      border-radius: 4px;
    }

    #emo button:hover {
      background: var(--hover);
    }

    #emo p {
      margin: 6px 4px;
      font-size: 12px;
      color: var(--mute);
      font-weight: 600;
    }

    /* Member list (far right) */
    #mem {
      background: var(--side);
      overflow-y: auto;
      padding: 8px;
    }

    .mm {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }

    .mm:hover {
      background: var(--hover);
    }

    .mm.off {
      opacity: .45;
    }

    .dot {
      position: relative;
    }

    .dot i {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green);
      border: 3px solid var(--side);
    }

    .empty {
      margin: auto;
      text-align: center;
      color: var(--mute);
      padding: 24px;
      max-width: 380px;
    }

    /* Pop-up windows */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000a;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 16px;
    }

    #modal.on {
      display: flex;
    }

    .mbox {
      background: var(--main);
      border-radius: 8px;
      width: 440px;
      max-width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }

    .mbox h2 {
      margin: 0 0 4px;
    }

    .mbox p {
      color: var(--mute);
      margin: 0 0 16px;
    }

    /* Form fields and buttons */
    .f {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--mute);
      text-transform: uppercase;
      margin: 14px 0 6px;
    }

    .t {
      width: 100%;
      background: #1e1f22;
      border: 0;
      border-radius: 4px;
      padding: 10px;
      outline: 0;
    }

    .t:focus {
      outline: 2px solid var(--accent);
    }

    .b {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 9px 16px;
      font-weight: 500;
    }

    .b:hover {
      filter: brightness(.9);
    }

    .b.g {
      background: none;
      color: var(--text);
    }

    .b.r {
      background: var(--red);
    }

    .b.pr {
      background: linear-gradient(135deg, #ff4d5a, #b3091a);
    }

    .row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .err {
      color: var(--red);
      font-size: 14px;
      margin-top: 8px;
      min-height: 20px;
    }

    /* Login / signup screen */
    #auth {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 15%, #7a0a14 0, #050505 60%);
      padding: 16px;
    }

    .card {
      background: var(--main);
      padding: 32px;
      border-radius: 8px;
      width: 480px;
      max-width: 100%;
      box-shadow: 0 2px 10px #0004;
    }

    .card h1 {
      text-align: center;
      margin: 0 0 4px;
      font-size: 24px;
    }

    .card .sub {
      text-align: center;
      color: var(--mute);
      margin-bottom: 8px;
    }

    /* Profile card */
    .ban {
      height: 60px;
      border-radius: 8px 8px 0 0;
      margin: -24px -24px 0;
    }

    .pop {
      margin: -30px 0 0 16px;
      border: 6px solid var(--main);
      border-radius: 50%;
      width: 92px;
      height: 92px;
      overflow: hidden;
    }

    /* Colour swatches in settings */
    .sw {
      display: inline-block;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      margin: 0 6px 0 0;
      border: 2px solid transparent;
      cursor: pointer;
    }

    /* Animations and Discord-style extras */
    @keyframes pop { from { transform: scale(.92); opacity: 0; } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes slide { from { opacity: 0; transform: translateY(10px); } }
    @keyframes blink { 50% { opacity: .2; } }
    #modal.on { animation: fade .15s; }
    .mbox, .card { animation: pop .22s cubic-bezier(.2, .9, .3, 1.2); }
    #emo.on { animation: pop .15s; }
    .msg.new { animation: slide .25s ease-out; }
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #000; color: #fff; border: 1px solid var(--accent); border-radius: 8px; padding: 10px 18px; z-index: 20; animation: slide .25s; }
    .sv:before { content: ""; position: absolute; left: -12px; top: 50%; width: 4px; height: 0; background: #fff; border-radius: 0 4px 4px 0; transform: translateY(-50%); transition: height .15s; }
    .sv:hover:before { height: 20px; }
    .sv.on:before { top: 50%; height: 36px; }
    .ch, .mm, .ib, .b { transition: background .12s, color .12s, filter .12s; }
    .b:active { transform: scale(.97); }
    .dd { display: flex; align-items: center; gap: 8px; margin: 18px 16px 0; color: var(--mute); font-size: 12px; font-weight: 600; }
    .dd:before, .dd:after { content: ""; flex: 1; height: 1px; background: #ffffff18; }
    .acts { position: absolute; right: 16px; top: -14px; display: none; background: var(--side); border: 1px solid #0006; border-radius: 6px; }
    .msg:hover .acts { display: flex; }
    .mc { font-size: var(--fs, 16px); }
    .mc code { background: #000a; padding: 2px 5px; border-radius: 4px; font-family: Consolas, monospace; font-size: .9em; }
    .mc a { color: #ff6b78; }
    .mention { background: #e11d2e33; color: #ffb3b9; border-radius: 3px; padding: 0 3px; }
    .ed { font-size: 11px; color: var(--mute); }
    #typ { height: 20px; padding: 0 16px; font-size: 12px; color: var(--mute); }
    .dots i { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--mute); margin-right: 2px; animation: blink 1.2s infinite; }
    .dots i:nth-child(2) { animation-delay: .2s; }
    .dots i:nth-child(3) { animation-delay: .4s; }
    .dot i.idle { background: #f0b132; }
    .dot i.dnd { background: var(--red); }
    .dot i.off { background: #80848e; }
    #me .nm small { display: block; font-weight: 400; color: var(--mute); font-size: 11px; }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 12px 0 4px; }
    .tab { background: none; border: 0; border-radius: 4px; padding: 6px 12px; color: var(--mute); font-weight: 500; }
    .tab:hover { background: var(--hover); color: var(--text); }
    .tab.on { background: var(--accent); color: #fff; }
    .opt { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #ffffff12; }
    .opt input { width: 18px; height: 18px; accent-color: var(--accent); }
    body.compact .msg { margin-top: 6px; }
    body.compact .msg.grp { margin-top: 0; }
    body.noanim *, body.noanim *:before { animation: none !important; transition: none !important; }

    /* Full-page settings, channels, uploads */
    .badge { background: linear-gradient(135deg, #ff4d5a, #b3091a); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 700; vertical-align: middle; }
    #set { position: fixed; inset: 0; z-index: 12; background: var(--main); display: grid; grid-template-columns: minmax(220px, 36%) 1fr; animation: fade .15s; }
    #setnav { background: var(--side); padding: 60px 8px 20px; display: flex; justify-content: flex-end; overflow-y: auto; }
    #setnav > div { width: 192px; margin-right: 12px; }
    .sg { font-size: 12px; font-weight: 700; color: var(--mute); text-transform: uppercase; padding: 6px 10px; margin-top: 12px; }
    .sn { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 4px; padding: 6px 10px; color: var(--mute); font-weight: 500; margin: 1px 0; transition: background .12s; }
    .sn:hover { background: var(--hover); color: var(--text); }
    .sn.on { background: #ffffff1c; color: #fff; }
    #setmain { overflow-y: auto; padding: 60px 40px 80px; }
    #setmain > div { max-width: 660px; }
    #setx { position: fixed; top: 40px; right: 40px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--mute); background: none; color: var(--mute); font-size: 16px; }
    #setx:hover { color: #fff; border-color: #fff; }
    .srow { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 10px 0; }
    .srow b { display: block; }
    .card2 { background: var(--side); border-radius: 8px; padding: 16px; margin: 12px 0; overflow: hidden; }
    .pc .ban { margin: -16px -16px 0; }
    .mob { display: none; }
    .perk { padding: 8px 0; border-bottom: 1px solid #ffffff12; display: flex; justify-content: space-between; gap: 12px; }
    .perk i { font-style: normal; color: var(--mute); font-size: 13px; text-align: right; }
    .chw { position: relative; }
    .cog { position: absolute; right: 4px; top: 3px; display: none; font-size: 14px; }
    .chw:hover .cog { display: block; }
    .topic { color: var(--mute); font-weight: 400; font-size: 14px; margin-left: 12px; padding-left: 12px; border-left: 1px solid #ffffff22; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .att { max-width: min(420px, 100%); max-height: 320px; border-radius: 8px; margin-top: 6px; display: block; }
    .file { display: inline-block; background: var(--side); border: 1px solid #ffffff18; border-radius: 8px; padding: 10px 14px; margin-top: 6px; }
    #inp:disabled { cursor: not-allowed; }
    @media (max-width: 700px) { #set { grid-template-columns: 1fr; } #setnav { display: none; } .mob { display: flex; } #setmain { padding: 60px 16px 80px; } #setx { top: 12px; right: 12px; } }

    /* Right-click menu and Discord-style create dialogs */
    #ctx { position: fixed; z-index: 30; background: #111214; border-radius: 6px; padding: 6px 8px; min-width: 190px; box-shadow: 0 8px 16px #0009; animation: pop .1s; }
    #ctx button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 3px; padding: 8px; font-size: 14px; color: var(--mute); font-weight: 500; }
    #ctx button:hover { background: var(--accent); color: #fff; }
    #ctx button.dg { color: #f23f43; }
    #ctx button.dg:hover { background: var(--red); color: #fff; }
    #ctx hr { border: 0; border-top: 1px solid #ffffff14; margin: 4px 0; }
    .mbox { position: relative; }
    .mx { position: absolute; top: 14px; right: 14px; font-size: 18px; }
    .f2 { display: block; font-weight: 600; margin: 12px 0 6px; }
    .kind { display: flex; gap: 12px; align-items: center; padding: 6px 12px; border-radius: 8px; cursor: pointer; margin: 1px 0; }
    .kind:has(input:checked) { background: #ffffff12; }
    .kind input { accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
    .kind .ki { font-size: 20px; width: 24px; text-align: center; flex: none; }
    .kind b { font-weight: 600; }
    .kind small, .lockrow small { display: block; color: var(--mute); font-size: 13px; margin-top: 2px; }
    .kind em { font-size: 10px; font-style: normal; background: #ffffff1c; border-radius: 4px; padding: 1px 6px; color: var(--mute); margin-left: 6px; }
    .kind.off { opacity: .45; cursor: not-allowed; }
    .nm2 { display: flex; align-items: center; background: #1e1f22; border-radius: 4px; padding: 0 12px; outline: 2px solid transparent; }
    .nm2:focus-within { outline-color: var(--accent); }
    .nm2 span { color: var(--mute); margin-right: 8px; font-size: 18px; }
    .nm2 input { flex: 1; background: none; border: 0; outline: 0; padding: 11px 0; }
    .lockrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 20px; }
    .tg { appearance: none; -webkit-appearance: none; width: 40px; height: 24px; flex: none; background: #80848e; border-radius: 12px; position: relative; cursor: pointer; transition: background .15s; }
    .tg:before { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
    .tg:checked { background: var(--green); }
    .tg:checked:before { left: 19px; }
    .b:disabled { opacity: .5; cursor: not-allowed; filter: none; }

    /* Voice, forums, friends, badges */
    #vbar { background: #111214; padding: 8px 12px; border-bottom: 1px solid #0006; display: flex; align-items: center; gap: 4px; }
    #vbar:empty { display: none; }
    #vbar small { display: block; color: var(--mute); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vroom, .forum, .fr { padding: 24px; }
    .vroom { text-align: center; }
    .tiles { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 24px 0; }
    .tile { background: var(--side); border-radius: 12px; padding: 20px 28px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 150px; animation: pop .2s; }
    .tile small { color: var(--mute); }
    .thr { padding: 14px 16px; background: var(--side); border-radius: 8px; margin: 8px 0; cursor: pointer; transition: background .12s; }
    .thr:hover { background: var(--hover); }

  <script>
    // ====== 1. PASTE YOUR SUPABASE KEYS (Project Settings > API) ======
    const SB_URL = "https://tfxnizwovbqamlzqeigm.supabase.co", SB_KEY = "sb_publishable_bUpHpK1CFRKxOXWYnPcirg_kqq0YZCr";
    // ==================================================================

    // ---------- Small helpers ----------
    const $ = s => document.querySelector(s);
    const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const colorFromName = s => {
      let h = 0;
      for (const c of s || '?')
        h = (h * 31 + c.charCodeAt(0)) % 360;

    const avatarHtml = (p, n = 40) => p?.avatar_url ? `<img class="av" style="width:${n}px;height:${n}px" src="${escapeHtml(p.avatar_url)}" alt="">` : `<div class="av" style="width:${n}px;height:${n}px;background:${colorFromName(p?.username)};font-size:${n * .42}px">${escapeHtml((p?.username || '?')[0].toUpperCase())}</div>`;
    const BADGES = { owner: ['👑', 'Server owner'], tester: ['🧪', 'Tester'], og: ['OG', 'OG: an early Procord member'] };
    const badgePills = (p, full) => [...(cur && cur.owner_id === p?.id ? ['owner'] : []), ...(p?.badges || [])].filter(k => BADGES[k]).map(k => `<span class="bdg ${k}" title="${BADGES[k][1]}">${BADGES[k][0]}${full && k !== 'og' ? ' ' + BADGES[k][1] : ''}</span>`).join('');
    const safeColor = c => /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '#99aab5';
    const roleColor = uid => { if (!cur) return null; const r = roles.find(x => memberRoles.some(m => m.user_id === uid && m.role_id === x.id)); return r ? safeColor(r.color) : null; };
    const nameHtml = p => `<b ${roleColor(p?.id) ? `style="color:${roleColor(p.id)}"` : ''} onclick="showProfile('${p?.id}')">${escapeHtml(p?.username)}</b>${badgePills(p)}`;
    const formatDateTime = d => new Date(d).toLocaleString([], { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: !S.h24 });
    const formatTime = d => new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: !S.h24 });

    // ---------- App state ----------
    let supabaseClient;      // connection to Supabase
    let me;                  // the logged-in user's profile
    let servers = [];        // servers I belong to
    let cur = null;          // the selected server
    let channels = [];       // channels in that server
    let curCh = null;        // the selected channel
    let members = [];        // profiles of that server's members
    let msgs = [];           // messages in the open channel
    let online = new Map();  // member id -> status (online / idle / dnd)
    let pendingName = null;  // username typed on the sign-up form
    let animateLast = false; // animate the newest message when it arrives
    let typers = {};         // who is typing right now
    let lastTyp = 0;         // when I last announced typing
    let mySP = {};           // my server-specific profile in the open server
    let curThread = null;    // open forum post
    let threads = [];        // posts in the open forum
    let dmWith = null;       // friend I am chatting with
    let friendRows = [];     // friendship rows (pending + accepted)
    let friendTab = 'all';
    let watchers = [];       // always-on realtime subscriptions
    let roles = [];          // roles in the open server
    let memberRoles = [];    // which member has which role
    let cats = [];           // category rows for the open server
    let catList = [];        // channel category names (for the sidebar)
    let collapsed = {};      // which categories are folded up
    const ICON = { text: '#', announcement: '📢', rules: '📜', voice: '🔊', forum: '💬', stage: '🎙️' };
    const KINDS = [['text', '# Text: anyone can post'], ['announcement', '📢 Announcement: only the owner posts'], ['rules', '📜 Rules: only the owner posts'], ['voice', '🔊 Voice'], ['forum', '💬 Forum']];
    const MAX_UPLOAD = 1024 * 1024 * 1024; // 1 GB here; your Supabase project has its own limit too
    let rt = null;           // realtime subscription (new messages)
    let pr = null;           // presence subscription (who is online)

    // ---------- Settings (saved in this browser) ----------
    const DEFAULTS = { theme: 'dark', compact: false, fs: 16, sound: true, h24: false, anim: true, status: 'online', accent: '#e11d2e', icon: 'red' };
    let S = { ...DEFAULTS };

    const ICONS = { red: ['#ff4252', '#8f0b19'], black: ['#4a4a55', '#0a0a0a'], gold: ['#ffd166', '#b8860b'], blue: ['#4da3ff', '#1b3a8a'] };
    const ACCENTS = ['#e11d2e', '#ff6a00', '#f0b132', '#23a559', '#9b5de5', '#00a8fc', '#ff4fa3'];

    function applyS() {
      const root = document.documentElement;
      root.dataset.theme = S.theme;
      root.style.setProperty('--fs', S.fs + 'px');
      root.style.setProperty('--accent', S.accent);
      document.body.classList.toggle('compact', S.compact);
      document.body.classList.toggle('noanim', !S.anim);
      const [a, b] = ICONS[S.icon] || ICONS.red;
      document.querySelectorAll('#pc-grad stop').forEach((s, i) => s.setAttribute('stop-color', i ? b : a));
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='18' fill='${a}'/><path d='M20 15h14a12 12 0 0 1 0 24h-6v10l-8-7z' fill='#fff'/></svg>`;
      const link = document.querySelector('link[rel=icon]');
      if (link) link.href = 'data:image/svg+xml,' + encodeURIComponent(svg);

    function saveS() {

    function toast(text) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = text;
      document.body.append(t);
      setTimeout(() => t.remove(), 2600);
    }

    function beep() {
      if (!S.sound) return;
      try {
        const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
        o.connect(g); g.connect(c.destination); o.frequency.value = 660;
        g.gain.setValueAtTime(.05, c.currentTime);
        g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + .25);
        o.start(); o.stop(c.currentTime + .25);
      } catch (e) {}
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeM(); closeSet(); closeCtx(); }
      if (e.key === 'Enter' && e.target.closest && e.target.closest('#auth')) $('#auth .b').click();
    });

    // Turns **bold**, *italic*, ~~strike~~, `code`, links and @mentions into HTML
    function fmtText(text) {
      return text.split(/(https?:\/\/[^\s<]+)/).map((part, i) => {
        if (i % 2) return `<a href="${escapeHtml(part)}" target="_blank" rel="noopener noreferrer">${escapeHtml(part)}</a>`;
        return escapeHtml(part)
          .replace(/`([^`\n]+)`/g, '<code>$1</code>')
          .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
          .replace(/(^|\s)\*(.+?)\*(?=\s|$)/g, '$1<i>$2</i>')
          .replace(/~~(.+?)~~/g, '<s>$1</s>')
          .replace(/@(\w+)/g, (x, n) => members.some(m => (m.username || '').toLowerCase() === n.toLowerCase()) ? `<span class="mention">${x}</span>` : x);
      }).join('');
    }

    function renderTyping() {
      const el = $('#typ');
      if (!el) return;
      const names = Object.entries(typers).filter(([, t]) => Date.now() - t < 3000).map(([u]) => escapeHtml(u));
      el.innerHTML = names.length ? `<span class="dots"><i></i><i></i><i></i></span> <b>${names.join(', ')}</b> ${names.length > 1 ? 'are' : 'is'} typing…` : '';
    }

    function sendTyping() {
      if (!rt || Date.now() - lastTyp < 2500) return;
      lastTyp = Date.now();
      rt.send({ type: 'broadcast', event: 'typing', payload: { u: me.username, id: me.id } });
    }
    // ---------- Pop-ups and themes ----------
    function modal(h) {
      const m = $('#modal');
      m.innerHTML = `<div class="mbox">${h}</div>`;
      m.classList.add('on');
      m.onmousedown = e => {
        if (e.target === m)
          closeM();
      };
    }

    function closeM() {
      $('#modal').classList.remove('on');
    }

    function theme(t) {
      document.documentElement.dataset.theme = t || 'dark';
    }

    // ---------- Startup: show setup help, or connect to Supabase ----------
    if (!SB_URL) {
      $('#root').innerHTML = `<div id="auth"><div class="card"><svg class="logo" width="64" height="64"><use href="#logo"/></svg><h1>Almost there</h1><p class="sub">Connect Supabase to start chatting.</p><ol style="line-height:1.8"><li>Create a project at supabase.com</li><li>Run <b>schema.sql</b> in the SQL Editor</li><li>Paste your Project URL and anon key at the top of this file's script</li><li>Auth &gt; Providers &gt; Email: turn off "Confirm email" for quick testing</li></ol></div></div>`;
    }
    else {
      supabaseClient = supabase.createClient(SB_URL, SB_KEY);
      supabaseClient.auth.onAuthStateChange((_e, s) => setTimeout(() => start(s), 0));
    }

    // ---------- After login: build the app shell ----------
    async function start(session) {
      if (!session) {
        me = null;
        return authView();
      }
      if (me && me.id === session.user.id)
        return;
      const { data } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
      me = data || { id: session.user.id, username: 'user' };
      if (pendingName && pendingName !== me.username) {
        me.username = pendingName;
        await supabaseClient.from('profiles').update({ username: pendingName }).eq('id', me.id);
      }
      pendingName = null;
      applyS();
      $('#root').innerHTML = `
       <div id="app">
        <div id="rail"></div>
        <div id="side">
         <div id="sh"></div>
         <div id="chl"></div>
         <div id="vbar"></div>
          <div id="me"></div>
        </div>
        <div id="main">
         <div id="ch"></div>
         <div id="msgs"></div>
         <div id="comp">
          <div id="emo"></div>
          <div id="cbox">
           <button class="ib" onclick="$('#file').click()" title="Upload a file">📎</button>
              <input type="file" id="file" hidden onchange="attach(this)">
              <textarea id="inp" rows="1" placeholder="Message"></textarea>
           <button class="ib" onclick="$('#emo').classList.toggle('on')" title="Emoji">😀</button>
          </div>
          <div id="typ"></div>
          <div id="cnt"></div>
         </div>
        </div>
        <div id="mem"></div>
       </div>`;
      const inp = $('#inp');
      inp.onkeydown = e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      };
      inp.oninput = () => {
        inp.style.height = 'auto';

        $('#cnt').textContent = n > 3800 ? `${n}/4000` : '';

      buildEmoji();
      await loadServers();

    // ---------- Login and sign-up ----------
    function authView(mode = 'in') {
      $('#root').innerHTML = `<div id="auth"><div class="card"><svg class="logo" width="64" height="64"><use href="#logo"/></svg><h1>${mode === 'in' ? 'Welcome back!' : 'Create an account'}</h1><div class="sub">${mode === 'in' ? "We're so excited to see you again!" : 'Join a community in seconds.'}</div>
     ${mode === 'up' ? `<label class="f">Username</label><input class="t" id="au">` : ''}<label class="f">Email</label><input class="t" id="ae" type="email"><label class="f">Password</label><input class="t" id="ap" type="password">
     <div class="err" id="aerr"></div><button class="b" style="width:100%;padding:12px" onclick="doAuth('${mode}')">${mode === 'in' ? 'Log in' : 'Continue'}</button>
     <p style="margin:16px 0 0;color:var(--mute)">${mode === 'in' ? 'Need an account?' : 'Already registered?'} <a href="#" style="color:#ff6b78" onclick="authView('${mode === 'in' ? 'up' : 'in'}');return false">${mode === 'in' ? 'Register' : 'Log in'}</a></p></div></div>`;
    }

    async function doAuth(mode) {
      const email = $('#ae').value.trim(), password = $('#ap').value, err = $('#aerr');
      err.style.color = '';
      let r;
      if (mode === 'in') r = await supabaseClient.auth.signInWithPassword({ email, password });
      else {
        const u = $('#au').value.trim();
        if (u.length < 2 || u.length > 32) return err.textContent = 'Username must be 2 to 32 characters.';
        pendingName = u;
        r = await supabaseClient.auth.signUp({ email, password, options: { data: { username: u } } });
        if (!r.error && !r.data.session) {
          err.style.color = 'var(--green)';
          return err.textContent = 'Check your email to confirm, then log in.';

      }
      if (r.error) { pendingName = null; err.textContent = r.error.message; }
    }

    // ---------- Loading data: servers, channels, messages, online status ----------
    async function loadServers(keep) {
      const { data } = await supabaseClient.from('members').select('servers(*)').eq('user_id', me.id);
      servers = (data || []).map(x => x.servers).filter(Boolean);
      if (!keep && servers.length)
        return selectServer(servers[0].id);
      if (!servers.length) {
        cur = null;
        channels = [];
        members = [];
        msgs = [];
      }
      renderAll();
    }

    async function loadMembers() {
      const { data } = await supabaseClient.from('members').select('user_id,nick,avatar_url,bio,banner_url,profiles(*)').eq('server_id', cur.id);
      const rows = data || [];
      mySP = rows.find(x => x.user_id === me.id) || {};
      members = rows.filter(x => x.profiles).map(x => ({ ...x.profiles, username: x.nick || x.profiles.username, avatar_url: x.avatar_url || x.profiles.avatar_url, bio: x.bio || x.profiles.bio, banner_url: x.banner_url || x.profiles.banner_url }));
    }

    async function selectServer(id) {
      cur = servers.find(s => s.id === id);
      const c = await supabaseClient.from('channels').select('*').eq('server_id', id).order('created_at');
  channels = c.data || [];
  const k = await supabaseClient.from('categories').select('*').eq('server_id', id).order('created_at');
  cats = k.data || [];
  await loadRoles(id);
      await loadMembers();
      online = new Map();
      if (pr) supabaseClient.removeChannel(pr);
      pr = supabaseClient.channel('pres-' + id, { config: { presence: { key: me.id } } });
      pr.on('presence', { event: 'sync' }, () => {
        online = new Map(Object.entries(pr.presenceState()).map(([k, v]) => [k, v[0]?.status || 'online']));
        renderMembers();
      }).subscribe(s => { if (s === 'SUBSCRIBED') pr.track({ status: S.status }); });
      renderAll();
      if (channels.length) selectChannel(channels[0].id);
      else { curCh = null; msgs = []; renderChat(); }
    }

    async function selectChannel(id) {
      curCh = channels.find(c => c.id === id);
      curThread = null; dmWith = null; typers = {};
      if (rt) { supabaseClient.removeChannel(rt); rt = null; }
      renderSide();
      if (curCh.kind === 'voice') { msgs = []; return renderChat(); }
      if (curCh.kind === 'forum') await loadThreads(); else await loadMessages();
      const tbl = { schema: 'public', table: 'messages' };
      rt = supabaseClient.channel('msg-' + id)
        .on('postgres_changes', { event: 'INSERT', ...tbl, filter: 'channel_id=eq.' + id }, async p => {
          if ((p.new.thread_id || null) !== (curThread?.id || null)) return;
          if (msgs.some(m => m.id === p.new.id)) return;
          const { data } = await supabaseClient.from('profiles').select('*').eq('id', p.new.user_id).single();
          addMsg({ ...p.new, profiles: data });
          if (p.new.user_id !== me.id) beep();
        })
        .on('postgres_changes', { event: 'UPDATE', ...tbl, filter: 'channel_id=eq.' + id }, p => {
          const m = msgs.find(x => x.id === p.new.id);
          if (m) { Object.assign(m, p.new); renderChat(true); }
        })
        .on('postgres_changes', { event: 'DELETE', ...tbl }, p => { msgs = msgs.filter(m => m.id !== p.old.id); renderChat(true); })
        .on('broadcast', { event: 'typing' }, ({ payload }) => {
          if (payload.id === me.id) return;
          typers[payload.u] = Date.now();
          renderTyping();
          setTimeout(renderTyping, 3200);
        })
        .subscribe();
    }

    function addMsg(m) {
      if (msgs.some(x => x.id === m.id)) return;
      msgs.push(m);
      animateLast = true;
      renderChat();
    }

    // ---------- Drawing the screen ----------
    function renderAll() {
      renderRail();
      renderSide();
      renderChat();
      renderMembers();
      renderMe();
    }

    }

    // ---------- Right-click menus ----------
    function closeCtx() { const e = $('#ctx'); if (e) e.remove(); }
    document.addEventListener('click', closeCtx);
    window.addEventListener('blur', closeCtx);

    // items: ['Label', 'code to run', isDanger] or '-' for a divider
    function ctxMenu(e, items) {

      document.body.append(m);
      const r = m.getBoundingClientRect();
      m.style.left = Math.max(8, Math.min(e.clientX, innerWidth - r.width - 8)) + 'px';
      m.style.top = Math.max(8, Math.min(e.clientY, innerHeight - r.height - 8)) + 'px';
    }

    function sideCtx(e) {
      if (!cur) return;
      const own = cur.owner_id === me.id;
      ctxMenu(e, [...(own ? [['Create Channel', "channelModal('')"], ['Create Category', 'categoryModal()'], ['Manage Roles', 'rolesModal()'], '-'] : []), ['Invite to Server', 'serverMenu()']]);
    }

    function chanCtx(e, id) {
      if (cur.owner_id !== me.id) return sideCtx(e);

      if (cur.owner_id !== me.id) return sideCtx(e);
      ctxMenu(e, [['Create Channel', `channelModal(catList[${i}])`], ['Create Category', 'categoryModal()'], '-', ['Delete Category', `delCategory(${i})`, true]]);

    async function delCategory(i) {
      const name = catList[i];
      if (name === 'Text channels') return toast("The default category can't be deleted.");
      if (!confirm(`Delete the category "${name}"? Its channels will move to Text channels.`)) return;
      await supabaseClient.from('categories').delete().eq('server_id', cur.id).eq('name', name);
      await supabaseClient.from('channels').update({ category: 'Text channels' }).eq('server_id', cur.id).eq('category', name);
      cats = cats.filter(c => c.name !== name);
      channels.forEach(c => { if (c.category === name) c.category = 'Text channels'; });
      renderSide();
    }
    // ---------- Voice and calls ----------
    // Audio goes directly between people (WebRTC). Supabase Realtime only carries the handshake.
    const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }; // add a TURN server here if calls fail on strict networks
    let vc = null; // the voice room I am in: { room, label, stream, sig, peers, muted, deaf }
    const dmRoom = other => 'dm-' + [me.id, other].sort().join('-');
    const vsend = (to, data) => vc.sig.send({ type: 'broadcast', event: 'rtc', payload: { from: me.id, to, ...data } });

    async function joinVoice(room, label) {
      if (vc) await leaveVoice();
      label = label || (channels.find(c => c.id === room)?.name ? '#' + channels.find(c => c.id === room).name : dmWith ? 'Call with ' + dmWith.username : 'Call');
      let stream;
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
      catch (e) { toast('Allow microphone access to join voice.'); return false; }
      const sig = supabaseClient.channel('voice-' + room, { config: { presence: { key: me.id } } });
      vc = { room, label, stream, sig, peers: {}, muted: false, deaf: false };
      sig.on('presence', { event: 'sync' }, voiceSync)
        .on('broadcast', { event: 'rtc' }, ({ payload }) => onSignal(payload))
        .subscribe(s => { if (s === 'SUBSCRIBED') sig.track({ name: me.username, muted: false, deaf: false }); });
      renderMe(); renderChat(true);
      return true;
    }

    function voiceSync() {
      if (!vc) return;
      const ids = Object.keys(vc.sig.presenceState()).filter(k => k !== me.id);
      ids.forEach(id => { if (!vc.peers[id] && me.id < id) makePeer(id, true); }); // the lower id starts the call
      Object.keys(vc.peers).forEach(id => { if (!ids.includes(id)) dropPeer(id); });
      renderChat(true);
    }

    function makePeer(id, initiator) {
      const pc = new RTCPeerConnection(ICE), audio = new Audio();
      audio.autoplay = true; audio.muted = vc.deaf;
      vc.stream.getTracks().forEach(t => pc.addTrack(t, vc.stream));
      pc.ontrack = e => { audio.srcObject = e.streams[0]; };
      pc.onicecandidate = e => { if (e.candidate && vc) vsend(id, { ice: e.candidate }); };
      vc.peers[id] = { pc, audio, q: [] };
      if (initiator) pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => vsend(id, { sdp: pc.localDescription }));
    }

    function dropPeer(id) {
      const p = vc?.peers[id];
      if (!p) return;
      p.pc.close(); p.audio.srcObject = null;
      delete vc.peers[id];
    }

    async function onSignal(p) {
      if (!vc || p.to !== me.id) return;
      if (!vc.peers[p.from]) makePeer(p.from, false);
      const peer = vc.peers[p.from], pc = peer.pc;
      try {
        if (p.sdp) {
          await pc.setRemoteDescription(p.sdp);
          peer.q.forEach(c => pc.addIceCandidate(c).catch(() => {}));
          peer.q = [];
          if (p.sdp.type === 'offer') { await pc.setLocalDescription(await pc.createAnswer()); vsend(p.from, { sdp: pc.localDescription }); }
        } else if (p.ice) {
          if (pc.remoteDescription) await pc.addIceCandidate(p.ice); else peer.q.push(p.ice);
        }
      } catch (e) { console.warn('voice signal', e); }
    }

    async function leaveVoice() {
      if (!vc) return;
      const v = vc;
      vc = null;
      Object.values(v.peers).forEach(p => { p.pc.close(); p.audio.srcObject = null; });
      v.stream.getTracks().forEach(t => t.stop());
      await supabaseClient.removeChannel(v.sig);
      renderMe(); renderChat(true);
    }

    function voiceToggle(kind) {
      if (!vc) return;
      vc[kind] = !vc[kind];
      if (kind === 'deaf') vc.muted = vc.deaf; // deafening also mutes your mic
      vc.stream.getAudioTracks().forEach(t => { t.enabled = !vc.muted; });
      Object.values(vc.peers).forEach(p => { p.audio.muted = vc.deaf; });
      vc.sig.track({ name: me.username, muted: vc.muted, deaf: vc.deaf });
      renderMe(); renderChat(true);
    }

    function voiceRoomHtml() {
      const joined = vc && vc.room === curCh.id;
      const tiles = joined ? Object.entries(vc.sig.presenceState()).map(([id, a]) => {
        const p = members.find(u => u.id === id) || (id === me.id ? me : { username: a[0]?.name || '?' });
        return `<div class="tile">${avatarHtml(p, 72)}<b>${escapeHtml(p.username)}</b>${a[0]?.deaf ? '<small>🙉 deafened</small>' : a[0]?.muted ? '<small>🔇 muted</small>' : ''}</div>`;
      }).join('') : '';
      return `<div class="vroom"><h2>🔊 ${escapeHtml(curCh.name)}</h2>${joined ? `<div class="tiles">${tiles}</div><button class="b r" onclick="leaveVoice()">Leave voice</button>` : `<p style="color:var(--mute)">Join to talk with everyone in this channel.</p><button class="b" onclick="joinVoice('${curCh.id}')">Join Voice</button>`}</div>`;
    }

    // ---------- Forum posts ----------
    async function loadThreads() {
      const { data } = await supabaseClient.from('threads').select('*,profiles(*)').eq('channel_id', curCh.id).order('created_at', { ascending: false });
      threads = data || [];
      renderChat();
    }

    async function loadMessages() {
      let q = supabaseClient.from('messages').select('*,profiles(*)').eq('channel_id', curCh.id);
      q = curThread ? q.eq('thread_id', curThread.id) : q.is('thread_id', null);
      const { data } = await q.order('id', { ascending: false }).limit(60);
      msgs = (data || []).reverse();
      renderChat();
    }

    function forumHtml() {
      return `<div class="forum"><div class="srow"><h2 style="margin:0">💬 ${escapeHtml(curCh.name)}</h2><button class="b" onclick="postModal()">New Post</button></div>`
        + (threads.length ? threads.map(t => `<div class="thr" onclick="openThread(${t.id})"><b>${escapeHtml(t.title)}</b><small>by ${escapeHtml(t.profiles?.username || '?')} · ${formatDateTime(t.created_at)}</small></div>`).join('') : `<div class="empty"><h2>No posts yet</h2><p>Start the first discussion.</p></div>`) + '</div>';
    }

    function postModal() {
      modal(`<button class="ib mx" onclick="closeM()">✕</button><h2>New Post</h2>
        <span class="f2">Title</span><div class="nm2"><input id="pt" maxlength="100" placeholder="What's this about?"></div>
        <span class="f2">Message</span><textarea class="t" id="pb" rows="5" maxlength="4000"></textarea>

    async function createPost() {
      const title = $('#pt').value.trim(), body = $('#pb').value.trim();
      if (!title || !body) return $('#merr').textContent = 'Add a title and a message.';
      const { data: t, error } = await supabaseClient.from('threads').insert({ channel_id: curCh.id, title }).select('*,profiles(*)').single();
      if (error) return $('#merr').textContent = error.message + ' (Run update4.sql in Supabase first.)';
      await supabaseClient.from('messages').insert({ channel_id: curCh.id, thread_id: t.id, content: body });
      closeM();
      threads.unshift(t);
      openThread(t.id);
    }

    async function openThread(id) { curThread = threads.find(t => t.id === id); await loadMessages(); }
    function closeThread() { curThread = null; msgs = []; renderChat(); }

    // ---------- Friends and direct messages ----------
    const friendOf = f => f.requester === me.id ? f.a : f.r;
    const myFriends = () => friendRows.filter(f => f.status === 'accepted').map(friendOf).filter(Boolean);
    const dmRow = r => ({ ...r, user_id: r.sender, dm: true, profiles: r.sender === me.id ? me : (myFriends().find(x => x.id === r.sender) || {}) });

    async function loadFriends() {
      const { data } = await supabaseClient.from('friendships').select('*,r:profiles!friendships_requester_fkey(*),a:profiles!friendships_addressee_fkey(*)');
      friendRows = data || [];
      if (!cur) { renderSide(); if (!dmWith) renderChat(true); }
    }

    function watchDMs() {
      watchers.forEach(c => supabaseClient.removeChannel(c));
      watchers = [
        supabaseClient.channel('dm-in-' + me.id).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'dm_messages', filter: 'recipient=eq.' + me.id }, p => {
          beep();
          if (dmWith && dmWith.id === p.new.sender) addMsg(dmRow(p.new));
          else toast(`New message from ${myFriends().find(x => x.id === p.new.sender)?.username || 'a friend'}${p.new.content === '[call]' ? ' (call invite)' : ''}`);
        }).subscribe(),
        supabaseClient.channel('friends-' + me.id).on('postgres_changes', { event: '*', schema: 'public', table: 'friendships' }, () => loadFriends()).subscribe()
      ];
    }

    function goHome() {
      if (pr) { supabaseClient.removeChannel(pr); pr = null; }
      if (rt) { supabaseClient.removeChannel(rt); rt = null; }
      cur = null; curCh = null; curThread = null; dmWith = null; members = []; msgs = []; channels = [];
      renderAll();
    }

    function showFriends() { dmWith = null; msgs = []; renderAll(); }

    async function openDM(pid) {
      const p = myFriends().find(x => x.id === pid);
      if (!p) return;
      if (cur) goHome();
      dmWith = p; msgs = [];
      const filter = `and(sender.eq.${me.id},recipient.eq.${pid}),and(sender.eq.${pid},recipient.eq.${me.id})`;
      const { data } = await supabaseClient.from('dm_messages').select('*').or(filter).order('id', { ascending: false }).limit(60);
      msgs = (data || []).reverse().map(dmRow);
      renderAll();
    }

    function friendsHtml() {
      const frow = (p, actions) => `<div class="frow">${avatarHtml(p, 36)}<b>${escapeHtml(p.username)}</b>${badgePills(p)}<span style="flex:1"></span>${actions}</div>`;
      const tabs = [['all', 'All'], ['pending', 'Pending'], ['add', 'Add Friend']];
      let body;
      if (friendTab === 'add') body = `<h3>Add Friend</h3><p>Type a username to send a friend request.</p><div class="nm2"><input id="fu" placeholder="Username" onkeydown="if(event.key==='Enter')addFriend()"><button class="b" style="margin:6px 0" onclick="addFriend()">Send Friend Request</button></div><div class="err" id="ferr"></div>`;
      else if (friendTab === 'pending') body = friendRows.filter(f => f.status === 'pending').map(f => frow(friendOf(f), f.addressee === me.id
        ? `<button class="b" onclick="answerFriend(${f.id},true)">Accept</button><button class="b g" onclick="answerFriend(${f.id},false)">Decline</button>`
        : `<span class="ts">Sent</span><button class="b g" onclick="answerFriend(${f.id},false)">Cancel</button>`)).join('') || '<p>No pending requests.</p>';
      else body = myFriends().map(p => frow(p, `<button class="ib" title="Message" onclick="openDM('${p.id}')">💬</button><button class="ib" title="Remove friend" onclick="removeFriend('${p.id}')">✕</button>`)).join('') || '<p>No friends yet. Open Add Friend to send a request.</p>';
      const nudge = servers.length ? '' : `<div class="card2"><b>You are not in any server yet.</b><div class="row" style="justify-content:flex-start"><button class="b" onclick="serverModal()">Create or join a server</button></div></div>`;
      return `<div class="fr">${nudge}<div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${k === friendTab ? 'on' : ''}" onclick="friendTab='${k}';renderChat()">${l}</button>`).join('')}</div>${body}</div>`;
    }

    async function addFriend() {
      const name = $('#fu').value.trim().replace(/[%_]/g, ''), err = $('#ferr');
      err.style.color = '';
      if (!name) return;
      const { data } = await supabaseClient.from('profiles').select('id,username').ilike('username', name).neq('id', me.id).limit(1);
      if (!data || !data.length) return err.textContent = 'No user found with that username.';
      const { error } = await supabaseClient.from('friendships').insert({ addressee: data[0].id });
      if (error) return err.textContent = error.code === '23505' ? 'You already sent a request to that person.' : error.message + ' (Run update4.sql in Supabase first.)';
      err.style.color = 'var(--green)';
      err.textContent = 'Friend request sent to ' + data[0].username + '!';
      $('#fu').value = '';
      loadFriends();
    }

    async function answerFriend(id, accept) {
      if (accept) await supabaseClient.from('friendships').update({ status: 'accepted' }).eq('id', id);
      else await supabaseClient.from('friendships').delete().eq('id', id);
      loadFriends();
    }

    async function removeFriend(pid) {
      const f = friendRows.find(x => x.status === 'accepted' && friendOf(x)?.id === pid);
      if (f && confirm('Remove this friend?')) { await supabaseClient.from('friendships').delete().eq('id', f.id); if (dmWith?.id === pid) dmWith = null; loadFriends(); }
    }

    async function quickAdd(id) {
      const { error } = await supabaseClient.from('friendships').insert({ addressee: id });
      closeM();
      toast(error ? (error.code === '23505' ? 'Request already sent.' : error.message) : 'Friend request sent!');
      loadFriends();
    }

    async function startCall() {
      if (!dmWith) return;
      if (!(vc && vc.room === dmRoom(dmWith.id)) && !(await joinVoice(dmRoom(dmWith.id), 'Call with ' + dmWith.username))) return;
      const { data } = await postMessage({ content: '[call]' });
      if (data) addMsg(data);
    }

    // One place that saves a message, whether it goes to a channel, a forum post or a DM
    async function postMessage(fields) {
      if (dmWith) {
        const { data, error } = await supabaseClient.from('dm_messages').insert({ recipient: dmWith.id, ...fields }).select('*').single();
        return error ? { error } : { data: dmRow(data) };
      }
      return await supabaseClient.from('messages').insert({ channel_id: curCh.id, thread_id: curThread ? curThread.id : null, ...fields }).select('*,profiles(*)').single();
    }
    // ---------- Roles ----------
    async function loadRoles(id) {
      const [r, m] = await Promise.all([
        supabaseClient.from('roles').select('*').eq('server_id', id).order('created_at'),
        supabaseClient.from('member_roles').select('*').eq('server_id', id)]);
      roles = r.data || [];
      memberRoles = m.data || [];
    }

    function setModal(html) {
      const box = $('#modal .mbox');
      if ($('#modal').classList.contains('on') && box) box.innerHTML = html; else modal(html);
    }

    const roleChecks = selected => roles.length
      ? `<span class="f2">Roles that can view it</span>` + roles.map(r => `<label class="opt"><span style="color:${safeColor(r.color)}">${escapeHtml(r.name)}</span><input type="checkbox" class="rolechk" value="${r.id}" ${selected.includes(r.id) ? 'checked' : ''}></label>`).join('')
      : `<small class="ts">Create roles from the server menu to share a private channel with them.</small>`;

    function rolesModal() {
      if (!cur || cur.owner_id !== me.id) return;
      const chips = uid => roles.map(r => `<button class="chip ${memberRoles.some(m => m.user_id === uid && m.role_id === r.id) ? 'on' : ''}" style="--c:${safeColor(r.color)}" onclick="toggleMemberRole('${uid}','${r.id}')">${escapeHtml(r.name)}</button>`).join('');
      setModal(`<button class="ib mx" onclick="closeM()" title="Close">✕</button><h2>Roles</h2><p>Give members coloured roles. Roles can also unlock private channels.</p>
        <div class="nm2"><input id="rn" maxlength="32" placeholder="New role name" onkeydown="if(event.key==='Enter')createRole()"><input type="color" id="rc" value="#e11d2e" style="margin:0 8px;background:none;border:0;width:32px;height:28px;padding:0"><button class="b" style="margin:6px 0" onclick="createRole()">Create role</button></div>
        <div class="err" id="merr"></div>
        <span class="f2">Roles</span>${roles.map(r => `<div class="frow"><span class="dotc" style="background:${safeColor(r.color)}"></span><b style="color:${safeColor(r.color)}">${escapeHtml(r.name)}</b><span class="ts">${memberRoles.filter(m => m.role_id === r.id).length === 1 ? '1 member' : memberRoles.filter(m => m.role_id === r.id).length + ' members'}</span><span style="flex:1"></span><button class="ib" title="Delete role" onclick="delRole('${r.id}')">✕</button></div>`).join('') || '<p class="ts">No roles yet.</p>'}
        <span class="f2">Members</span>${members.map(p => `<div class="frow">${avatarHtml(p, 28)}<b>${escapeHtml(p.username)}</b><span style="flex:1"></span><div class="chips">${chips(p.id) || '<span class="ts">create a role first</span>'}</div></div>`).join('')}
        <div class="row"><button class="b g" onclick="closeM()">Done</button></div>`);
      $('#modal .mbox').classList.add('wide');
    }

    async function createRole() {
      const name = $('#rn').value.trim();
      if (!name) return;
      const { data, error } = await supabaseClient.from('roles').insert({ server_id: cur.id, name, color: $('#rc').value }).select().single();
      if (error) return $('#merr').textContent = error.message + ' (Run update5.sql in Supabase first.)';
      roles.push(data);
      rolesModal();
    }

    async function delRole(id) {
      if (!confirm('Delete this role?')) return;
      await supabaseClient.from('roles').delete().eq('id', id);
      roles = roles.filter(r => r.id !== id);
      memberRoles = memberRoles.filter(m => m.role_id !== id);
      rolesModal(); renderMembers(); renderChat(true);
    }

    async function toggleMemberRole(uid, rid) {
      const has = memberRoles.some(m => m.user_id === uid && m.role_id === rid);
      const { error } = has
        ? await supabaseClient.from('member_roles').delete().eq('user_id', uid).eq('role_id', rid)
        : await supabaseClient.from('member_roles').insert({ server_id: cur.id, user_id: uid, role_id: rid });
      if (error) return toast(error.message);
      memberRoles = has ? memberRoles.filter(m => !(m.user_id === uid && m.role_id === rid)) : [...memberRoles, { server_id: cur.id, user_id: uid, role_id: rid }];
      rolesModal(); renderMembers(); renderChat(true);
    }
    function toggleCat(i) {
      collapsed[catList[i]] = !collapsed[catList[i]];
      renderSide();
    }

    function renderSide() {
      if (!cur) {
    $('#sh').textContent = 'Friends';
    $('#chl').oncontextmenu = null;
    $('#chl').innerHTML = `<button class="ch ${dmWith ? '' : 'on'}" onclick="showFriends()">👥 Friends</button><div class="lbl"><span>Direct messages</span></div>` + myFriends().map(p => `<button class="ch ${dmWith?.id === p.id ? 'on' : ''}" onclick="openDM('${p.id}')">${avatarHtml(p, 22)}${escapeHtml(p.username)}</button>`).join('');
    return;
  }
      $('#sh').innerHTML = `<span>${escapeHtml(cur.name)}</span><button class="ib" title="Server menu" onclick="serverMenu()">⋯</button>`;
      catList = [...new Set([...cats.map(c => c.name), ...channels.map(c => c.category || 'Text channels')])];
      $('#chl').oncontextmenu = e => { if (!e.target.closest('.chw, .lbl')) sideCtx(e); };
      $('#chl').innerHTML = catList.map((cat, i) => {
        const row = cats.find(c => c.name === cat);
        const list = channels.filter(c => (c.category || 'Text channels') === cat);
        return `<div class="lbl" oncontextmenu="catCtx(event,${i})"><span style="cursor:pointer" onclick="toggleCat(${i})">${collapsed[cat] ? '▸' : '▾'} ${escapeHtml(cat)}${row?.private ? ' 🔒' : ''}</span></div>`
          + (collapsed[cat] ? '' : list.map(c => `<div class="chw" oncontextmenu="chanCtx(event,'${c.id}')"><button class="ch ${curCh?.id === c.id ? 'on' : ''}" onclick="selectChannel('${c.id}')">${c.private ? '🔒' : ICON[c.kind] || '#'} ${escapeHtml(c.name)}</button></div>`).join(''));
      }).join('');
    }

    function renderMe() {
      const labels = { online: 'Online', idle: 'Idle', dnd: 'Do not disturb', invisible: 'Invisible' };
      if ($('#vbar')) $('#vbar').innerHTML = vc ? `<div style="flex:1;min-width:0"><b style="color:var(--green);font-size:13px">Voice connected</b><small>${escapeHtml(vc.label)}</small></div><button class="ib" title="${vc.muted ? 'Unmute' : 'Mute'}" onclick="voiceToggle('muted')">${vc.muted ? '🔇' : '🎤'}</button><button class="ib" title="${vc.deaf ? 'Undeafen' : 'Deafen'}" onclick="voiceToggle('deaf')">${vc.deaf ? '🙉' : '🎧'}</button><button class="ib" title="Disconnect" onclick="leaveVoice()">✕</button>` : '';
      $('#me').innerHTML = `<div class="dot">${avatarHtml(me, 32)}<i class="${S.status === 'invisible' ? 'off' : S.status}"></i></div><div class="nm">${escapeHtml(me.username)}<small>${labels[S.status]}</small></div><button class="ib" title="User settings" onclick="settings()">⚙</button>`;
    }

    function renderChat(keep) {
      const el = $('#msgs'), ch = $('#ch'), comp = $('#comp');
      if (!el) return;
      if (!cur && !dmWith) { ch.innerHTML = '👥 Friends'; comp.style.display = 'none'; el.innerHTML = friendsHtml(); return; }
      const isDM = !cur, kind = isDM ? 'dm' : curCh?.kind;
      const composer = isDM || ['text', 'announcement', 'rules'].includes(kind) || (kind === 'forum' && curThread);
      const locked = !isDM && ['announcement', 'rules'].includes(kind) && cur.owner_id !== me.id;
      if (isDM) ch.innerHTML = `<span style="color:var(--mute);font-size:22px">@</span> ${escapeHtml(dmWith.username)}<button class="ib" style="margin-left:auto" title="Start a voice call" onclick="startCall()">📞</button>`;
      else if (curThread) ch.innerHTML = `<button class="ib" onclick="closeThread()">‹ Back</button> ${escapeHtml(curThread.title)}`;
      else ch.innerHTML = `<span style="color:var(--mute);font-size:22px">${ICON[kind] || '#'}</span> ${escapeHtml(curCh?.name || '')}${curCh?.topic ? `<span class="topic">${escapeHtml(curCh.topic)}</span>` : ''}`;
      comp.style.display = composer ? '' : 'none';
      if (kind === 'voice') { el.innerHTML = voiceRoomHtml(); return; }
      if (kind === 'forum' && !curThread) { el.innerHTML = forumHtml(); return; }
      $('#inp').disabled = !!locked;
      $('#inp').placeholder = locked ? 'Only the server owner can post in this channel' : isDM ? `Message @${dmWith.username}` : curThread ? 'Reply to this post' : `Message ${ICON[kind] || '#'}${curCh?.name || ''}`;
      const bottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120 || !keep;
      let html = '', day = '';
      msgs.forEach((m, i) => {
        const p = members.find(u => u.id === m.user_id) || m.profiles || {}, pv = msgs[i - 1], d = new Date(m.created_at).toDateString();
        let divider = '';
        if (d !== day) { day = d; divider = `<div class="dd">${new Date(m.created_at).toLocaleDateString([], { dateStyle: 'long' })}</div>`; }
        const grouped = !divider && pv && pv.user_id === m.user_id && new Date(m.created_at) - new Date(pv.created_at) < 3e5;
        const isNew = animateLast && i === msgs.length - 1;
        const left = grouped ? `<span class="gt">${formatTime(m.created_at)}</span>` : `<div>${avatarHtml(p, 40)}</div>`;
        const head = grouped ? '' : `<div class="mh">${nameHtml(p)} <span class="ts">${formatDateTime(m.created_at)}</span></div>`;
        const acts = m.user_id === me.id && m.content !== '[call]' ? `<div class="acts"><button class="ib" onclick="editMsg(${m.id})" title="Edit">✏️</button><button class="ib" onclick="delMsg(${m.id})" title="Delete">🗑</button></div>` : '';
        const body = m.dm && m.content === '[call]'
          ? `<button class="b" onclick="joinVoice('${dmRoom(m.user_id === me.id ? m.recipient : m.user_id)}','Call with ${escapeHtml(dmWith?.username || 'friend')}')">📞 ${m.user_id === me.id ? 'You started a call' : escapeHtml(p.username) + ' started a call'} · Join</button>`
          : `${fmtText(m.content || '')}${attHtml(m)}${m.edited ? ' <span class="ed">(edited)</span>' : ''}`;
        html += divider + `<div class="msg ${grouped ? 'grouped grp' : ''} ${isNew ? 'new' : ''}">${left}<div class="mb">${head}<div class="mc">${body}</div></div>${acts}</div>`;
      });
      animateLast = false;
      el.innerHTML = html || `<div class="empty"><h2>${isDM ? 'This is the start of your chat with ' + escapeHtml(dmWith.username) : 'Welcome to #' + escapeHtml(curCh?.name || '')}</h2><p>Say something!</p></div>`;

      Object.assign(channels.find(x => x.id === id), u);

    // ---------- Uploads ----------
    async function uploadFile(file) {
      if (file.size > MAX_UPLOAD) { toast('That file is over 1 GB.'); return null; }
      const path = `${me.id}/${Date.now()}-${file.name.replace(/[^\w.-]/g, '_')}`;
      const { error } = await supabaseClient.storage.from('uploads').upload(path, file);
      if (error) { toast(error.message); return null; }
      return supabaseClient.storage.from('uploads').getPublicUrl(path).data.publicUrl;
    }

    async function attach(input) {
      const f = input.files[0];
      input.value = '';
      if (!f || (!curCh && !dmWith)) return;
      toast('Uploading ' + f.name + '…');
      const url = await uploadFile(f);
      if (!url) return;
      const { data, error } = await postMessage({ content: $('#inp').value.trim(), attachment_url: url, attachment_name: f.name });
      if (error) return toast(error.message);
      $('#inp').value = '';
      addMsg(data);
    }

    function pickImage(targetId) {
      const i = document.createElement('input');
      i.type = 'file'; i.accept = 'image/*';
      i.onchange = async () => {
        if (!i.files[0]) return;
        toast('Uploading…');
        const url = await uploadFile(i.files[0]);
        if (url) { $('#' + targetId).value = url; $('#' + targetId).dispatchEvent(new Event('input')); toast('Uploaded'); }
      };
      i.click();
    }

    function attHtml(m) {
      if (!m.attachment_url) return '';
      const u = escapeHtml(m.attachment_url), n = escapeHtml(m.attachment_name || 'file');
      if (/\.(png|jpe?g|gif|webp|avif|svg)$/i.test(n)) return `<div><img class="att" src="${u}" alt="${n}" loading="lazy"></div>`;
      if (/\.(mp4|webm|mov|m4v)$/i.test(n)) return `<div><video class="att" src="${u}" controls preload="metadata"></video></div>`;
      if (/\.(mp3|wav|ogg|m4a)$/i.test(n)) return `<div><audio src="${u}" controls></audio></div>`;
      return `<a class="file" href="${u}" target="_blank" rel="noopener noreferrer">📄 ${n}</a>`;
    }

    async function deleteAccount() {
      if ($('#dc').value.trim() !== me.username) return $('#serr').textContent = 'That does not match your username.';
      const { error } = await supabaseClient.rpc('delete_account');
      if (error) return $('#serr').textContent = error.message + ' (Run update.sql in Supabase first.)';
      closeM();
      await supabaseClient.auth.signOut({ scope: 'local' });
      toast('Your account was deleted');
    }


    async function saveProfile() {
      const v = id => $('#' + id).value.trim() || null;
      const u = { username: $('#su').value.trim() || me.username, avatar_url: v('sa'), banner_url: v('sbn'), banner_color: $('#sbc').value, bio: $('#sbio').value };
      S.status = $('#sst').value; saveS();
      if (pr) pr.track({ status: S.status });
      const { error } = await supabaseClient.from('profiles').update(u).eq('id', me.id);
      if (error) return $('#serr').textContent = error.message + ' (Run update2.sql in Supabase first.)';
      Object.assign(me, u);
      if (cur) await loadMembers();
      msgs.forEach(m => { if (m.user_id === me.id) m.profiles = { ...me }; });
      toast('Changes saved');
      renderMe(); renderMembers(); renderChat(true);
    }

    async function saveServerProfile() {
      const v = id => $('#' + id).value.trim() || null;
      const u = { nick: v('sn'), avatar_url: v('sav'), banner_url: v('sbn2'), bio: v('sbi') };
      const { error } = await supabaseClient.from('members').update(u).eq('server_id', cur.id).eq('user_id', me.id);
      if (error) return $('#serr').textContent = error.message + ' (Run update2.sql in Supabase first.)';
      await loadMembers();
      renderMembers(); renderChat(true); toast('Server profile saved');
    }
  </script>
</body>
</html>
