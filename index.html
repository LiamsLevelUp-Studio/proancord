<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procord</title>
  <meta name="theme-color" content="#08080a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23d6182a'/%3E%3Cpath d='M20 15h14a12 12 0 0 1 0 24h-6v10l-8-7z' fill='%23fff'/%3E%3C/svg%3E">

  <!-- Supabase client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <style>
    /* Colour palette (dark by default; themes override it below) */
    :root {
      --rail: #08080a;
      --side: #101012;
      --main: #161618;
      --input: #1d1d21;
      --hover: #1c1c20;
      --text: #efeded;
      --mute: #a1a1aa;
      --accent: #e11d2e;
      --green: #23a559;
      --red: #f23f43;
      --border: #ffffff10;
    }

    [data-theme=midnight] {
      --accent: #ff2d55;
      --rail: #000;
      --side: #08080d;
      --main: #0e0e16;
      --input: #191925;
      --hover: #151520;
    }

    [data-theme=sunset] {
      --accent: #e8590c;
      --main: #2f2a2e;
      --side: #272226;
      --rail: #1c181b;
      --input: #3a3339;
      --hover: #352f34;
    }

    /* Base page styles */
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #2a1114;
      border-radius: 4px;
    }

    .brand {
      width: 48px;
      height: 48px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card .logo {
      display: block;
      margin: 0 auto 12px;
    }

    body {
      background: var(--main);
      color: var(--text);
      font: 16px/1.375 "gg sans", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    button, input, textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    /* Main layout: server rail | channels | chat | members */
    #app {
      display: grid;
      grid-template-columns: 72px 240px 1fr 240px;
      height: 100%;
    }

    /* Server rail (far left) */
    #rail {
      background: var(--rail);
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      overflow-y: auto;
    }

    .sv {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--main);
      border: 0;
      font-weight: 600;
      transition: .15s;
      flex: none;
      position: relative;
    }

    .sv:hover, .sv.on {
      border-radius: 16px;
      background: var(--accent);
      color: #fff;
    }

    .sv.on:before {
      content: "";
      position: absolute;
      left: -12px;
      top: 12px;
      width: 4px;
      height: 24px;
      background: #fff;
      border-radius: 0 4px 4px 0;
    }

    .sv.add {
      color: var(--accent);
      font-size: 24px;
    }

    .sv.add:hover {
      background: var(--accent);
      color: #fff;
    }

    .sep {
      width: 32px;
      height: 2px;
      background: var(--main);
      border-radius: 1px;
    }

    /* Channel sidebar */
    #side {
      background: var(--side);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #sh {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      border-bottom: 1px solid #0003;
      box-shadow: 0 1px 0 #0002;
    }

    #chl {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .lbl {
      display: flex;
      justify-content: space-between;
      color: var(--mute);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 12px 8px 4px;
    }

    .lbl button {
      background: none;
      border: 0;
      color: var(--mute);
      font-size: 18px;
      padding: 0;
    }

    .ch {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-radius: 4px;
      padding: 6px 8px;
      color: var(--mute);
      font-weight: 500;
    }

    .ch:hover {
      background: var(--hover);
      color: var(--text);
    }

    .ch.on {
      background: #4e505899;
      color: #fff;
    }

    /* Your user bar at the bottom of the sidebar */
    #me {
      background: #232428;
      height: 52px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #me .nm {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Icon buttons */
    .ib {
      background: none;
      border: 0;
      color: var(--mute);
      font-size: 18px;
      border-radius: 4px;
      padding: 4px 6px;
    }

    .ib:hover {
      background: var(--hover);
      color: var(--text);
    }

    /* Avatars */
    .av {
      border-radius: 50%;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #fff;
      flex: none;
    }

    /* Chat area */
    #main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    #ch {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      border-bottom: 1px solid #0003;
      flex: none;
    }

    #msgs {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
    }

    /* Messages */
    .msg {
      display: flex;
      gap: 16px;
      padding: 2px 16px 2px 16px;
      position: relative;
      margin-top: 16px;
    }

    .msg.grp {
      margin-top: 0;
    }

    .msg:hover {
      background: #0000000a;
    }

    .msg > div:first-child, .gt {
      width: 40px;
      flex: none;
    }

    .gt {
      font-size: 11px;
      color: var(--mute);
      visibility: hidden;
      text-align: right;
      line-height: 22px;
    }

    .msg:hover .gt {
      visibility: visible;
    }

    .mb {
      min-width: 0;
      flex: 1;
    }

    .mh {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .mh b {
      cursor: pointer;
    }

    .mh b:hover {
      text-decoration: underline;
    }

    .ts {
      font-size: 12px;
      color: var(--mute);
    }

    .mc {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .del {
      position: absolute;
      right: 16px;
      top: -8px;
      background: var(--side);
      border: 1px solid #0004;
      border-radius: 4px;
      display: none;
    }

    .msg:hover .del {
      display: block;
    }


    /* Message box */
    #comp {
      padding: 0 16px 24px;
      position: relative;
      flex: none;
    }

    #cbox {
      background: var(--input);
      border-radius: 8px;
      display: flex;
      align-items: flex-end;
      padding: 0 8px;
    }

    #inp {
      flex: 1;
      background: none;
      border: 0;
      outline: 0;
      resize: none;
      padding: 11px 8px;
      max-height: 200px;
      line-height: 22px;
    }

    #cnt {
      font-size: 11px;
      color: var(--red);
      padding: 0 16px;
      height: 14px;
    }

    /* Emoji picker */
    #emo {
      display: none;
      position: absolute;
      right: 16px;
      bottom: 64px;
      width: 300px;
      max-height: 260px;
      overflow-y: auto;
      background: var(--side);
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 8px 24px #0006;
      z-index: 5;
    }

    #emo.on {
      display: block;
    }

    #emo button {
      background: none;
      border: 0;
      font-size: 22px;
      width: 36px;
      height: 36px;
      border-radius: 4px;
    }

    #emo button:hover {
      background: var(--hover);
    }

    #emo p {
      margin: 6px 4px;
      font-size: 12px;
      color: var(--mute);
      font-weight: 600;
    }

    /* Member list (far right) */
    #mem {
      background: var(--side);
      overflow-y: auto;
      padding: 8px;
    }

    .mm {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }

    .mm:hover {
      background: var(--hover);
    }

    .mm.off {
      opacity: .45;
    }

    .dot {
      position: relative;
    }

    .dot i {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green);
      border: 3px solid var(--side);
    }

    .empty {
      margin: auto;
      text-align: center;
      color: var(--mute);
      padding: 24px;
      max-width: 380px;
    }

    /* Pop-up windows */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000a;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 16px;
    }

    #modal.on {
      display: flex;
    }

    .mbox {
      background: var(--main);
      border-radius: 8px;
      width: 440px;
      max-width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }

    .mbox h2 {
      margin: 0 0 4px;
    }

    .mbox p {
      color: var(--mute);
      margin: 0 0 16px;
    }

    /* Form fields and buttons */
    .f {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--mute);
      text-transform: uppercase;
      margin: 14px 0 6px;
    }

    .t {
      width: 100%;
      background: #1e1f22;
      border: 0;
      border-radius: 4px;
      padding: 10px;
      outline: 0;
    }

    .t:focus {
      outline: 2px solid var(--accent);
    }

    .b {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 9px 16px;
      font-weight: 500;
    }

    .b:hover {
      filter: brightness(.9);
    }

    .b.g {
      background: none;
      color: var(--text);
    }

    .b.r {
      background: var(--red);
    }

    .b.pr {
      background: linear-gradient(135deg, #ff4d5a, #b3091a);
    }

    .row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .err {
      color: var(--red);
      font-size: 14px;
      margin-top: 8px;
      min-height: 20px;
    }

    /* Login / signup screen */
    #auth {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 15%, #7a0a14 0, #050505 60%);
      padding: 16px;
    }

    .card {
      background: var(--main);
      padding: 32px;
      border-radius: 8px;
      width: 480px;
      max-width: 100%;
      box-shadow: 0 2px 10px #0004;
    }

    .card h1 {
      text-align: center;
      margin: 0 0 4px;
      font-size: 24px;
    }

    .card .sub {
      text-align: center;
      color: var(--mute);
      margin-bottom: 8px;
    }

    /* Profile card */
    .ban {
      height: 60px;
      border-radius: 8px 8px 0 0;
      margin: -24px -24px 0;
    }

    .pop {
      margin: -30px 0 0 16px;
      border: 6px solid var(--main);
      border-radius: 50%;
      width: 92px;
      height: 92px;
      overflow: hidden;
    }

    /* Colour swatches in settings */
    .sw {
      display: inline-block;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      margin: 0 6px 0 0;
      border: 2px solid transparent;
      cursor: pointer;
    }

    /* Animations and Discord-style extras */
    @keyframes pop { from { transform: scale(.92); opacity: 0; } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes slide { from { opacity: 0; transform: translateY(10px); } }
    @keyframes blink { 50% { opacity: .2; } }
    #modal.on { animation: fade .15s; }
    .mbox, .card { animation: pop .22s cubic-bezier(.2, .9, .3, 1.2); }
    #emo.on { animation: pop .15s; }
    .msg.new { animation: slide .25s ease-out; }
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #000; color: #fff; border: 1px solid var(--accent); border-radius: 8px; padding: 10px 18px; z-index: 20; animation: slide .25s; }
    .sv:before { content: ""; position: absolute; left: -12px; top: 50%; width: 4px; height: 0; background: #fff; border-radius: 0 4px 4px 0; transform: translateY(-50%); transition: height .15s; }
    .sv:hover:before { height: 20px; }
    .sv.on:before { top: 50%; height: 36px; }
    .ch, .mm, .ib, .b { transition: background .12s, color .12s, filter .12s; }
    .b:active { transform: scale(.97); }
    .dd { display: flex; align-items: center; gap: 8px; margin: 18px 16px 0; color: var(--mute); font-size: 12px; font-weight: 600; }
    .dd:before, .dd:after { content: ""; flex: 1; height: 1px; background: #ffffff18; }
    .acts { position: absolute; right: 16px; top: -14px; display: none; background: var(--side); border: 1px solid #0006; border-radius: 6px; }
    .msg:hover .acts { display: flex; }
    .mc { font-size: var(--fs, 16px); }
    .mc code { background: #000a; padding: 2px 5px; border-radius: 4px; font-family: Consolas, monospace; font-size: .9em; }
    .mc a { color: #ff6b78; }
    .mention { background: #e11d2e33; color: #ffb3b9; border-radius: 3px; padding: 0 3px; }
    .ed { font-size: 11px; color: var(--mute); }
    #typ { height: 20px; padding: 0 16px; font-size: 12px; color: var(--mute); }
    .dots i { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--mute); margin-right: 2px; animation: blink 1.2s infinite; }
    .dots i:nth-child(2) { animation-delay: .2s; }
    .dots i:nth-child(3) { animation-delay: .4s; }
    .dot i.idle { background: #f0b132; }
    .dot i.dnd { background: var(--red); }
    .dot i.off { background: #80848e; }
    #me .nm small { display: block; font-weight: 400; color: var(--mute); font-size: 11px; }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 12px 0 4px; }
    .tab { background: none; border: 0; border-radius: 4px; padding: 6px 12px; color: var(--mute); font-weight: 500; }
    .tab:hover { background: var(--hover); color: var(--text); }
    .tab.on { background: var(--accent); color: #fff; }
    .opt { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #ffffff12; }
    .opt input { width: 18px; height: 18px; accent-color: var(--accent); }
    body.compact .msg { margin-top: 6px; }
    body.compact .msg.grp { margin-top: 0; }
    body.noanim *, body.noanim *:before { animation: none !important; transition: none !important; }

    /* Full-page settings, channels, uploads */
    .badge { background: linear-gradient(135deg, #ff4d5a, #b3091a); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 700; vertical-align: middle; }
    #set { position: fixed; inset: 0; z-index: 12; background: var(--main); display: grid; grid-template-columns: minmax(220px, 36%) 1fr; animation: fade .15s; }
    #setnav { background: var(--side); padding: 60px 8px 20px; display: flex; justify-content: flex-end; overflow-y: auto; }
    #setnav > div { width: 192px; margin-right: 12px; }
    .sg { font-size: 12px; font-weight: 700; color: var(--mute); text-transform: uppercase; padding: 6px 10px; margin-top: 12px; }
    .sn { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 4px; padding: 6px 10px; color: var(--mute); font-weight: 500; margin: 1px 0; transition: background .12s; }
    .sn:hover { background: var(--hover); color: var(--text); }
    .sn.on { background: #ffffff1c; color: #fff; }
    #setmain { overflow-y: auto; padding: 60px 40px 80px; }
    #setmain > div { max-width: 660px; }
    #setx { position: fixed; top: 40px; right: 40px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--mute); background: none; color: var(--mute); font-size: 16px; }
    #setx:hover { color: #fff; border-color: #fff; }
    .srow { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 10px 0; }
    .srow b { display: block; }
    .card2 { background: var(--side); border-radius: 8px; padding: 16px; margin: 12px 0; overflow: hidden; }
    .pc .ban { margin: -16px -16px 0; }
    .mob { display: none; }
    .perk { padding: 8px 0; border-bottom: 1px solid #ffffff12; display: flex; justify-content: space-between; gap: 12px; }
    .perk i { font-style: normal; color: var(--mute); font-size: 13px; text-align: right; }
    .chw { position: relative; }
    .cog { position: absolute; right: 4px; top: 3px; display: none; font-size: 14px; }
    .chw:hover .cog { display: block; }
    .topic { color: var(--mute); font-weight: 400; font-size: 14px; margin-left: 12px; padding-left: 12px; border-left: 1px solid #ffffff22; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .att { max-width: min(420px, 100%); max-height: 320px; border-radius: 8px; margin-top: 6px; display: block; }
    .file { display: inline-block; background: var(--side); border: 1px solid #ffffff18; border-radius: 8px; padding: 10px 14px; margin-top: 6px; }
    #inp:disabled { cursor: not-allowed; }
    @media (max-width: 700px) { #set { grid-template-columns: 1fr; } #setnav { display: none; } .mob { display: flex; } #setmain { padding: 60px 16px 80px; } #setx { top: 12px; right: 12px; } }

    /* Right-click menu and Discord-style create dialogs */
    #ctx { position: fixed; z-index: 30; background: #111214; border-radius: 6px; padding: 6px 8px; min-width: 190px; box-shadow: 0 8px 16px #0009; animation: pop .1s; }
    #ctx button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 3px; padding: 8px; font-size: 14px; color: var(--mute); font-weight: 500; }
    #ctx button:hover { background: var(--accent); color: #fff; }
    #ctx button.dg { color: #f23f43; }
    #ctx button.dg:hover { background: var(--red); color: #fff; }
    #ctx hr { border: 0; border-top: 1px solid #ffffff14; margin: 4px 0; }
    .mbox { position: relative; }
    .mx { position: absolute; top: 14px; right: 14px; font-size: 18px; }
    .f2 { display: block; font-weight: 600; margin: 12px 0 6px; }
    .kind { display: flex; gap: 12px; align-items: center; padding: 6px 12px; border-radius: 8px; cursor: pointer; margin: 1px 0; }
    .kind:has(input:checked) { background: #ffffff12; }
    .kind input { accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
    .kind .ki { font-size: 20px; width: 24px; text-align: center; flex: none; }
    .kind b { font-weight: 600; }
    .kind small, .lockrow small { display: block; color: var(--mute); font-size: 13px; margin-top: 2px; }
    .kind em { font-size: 10px; font-style: normal; background: #ffffff1c; border-radius: 4px; padding: 1px 6px; color: var(--mute); margin-left: 6px; }
    .kind.off { opacity: .45; cursor: not-allowed; }
    .nm2 { display: flex; align-items: center; background: #1e1f22; border-radius: 4px; padding: 0 12px; outline: 2px solid transparent; }
    .nm2:focus-within { outline-color: var(--accent); }
    .nm2 span { color: var(--mute); margin-right: 8px; font-size: 18px; }
    .nm2 input { flex: 1; background: none; border: 0; outline: 0; padding: 11px 0; }
    .lockrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 20px; }
    .tg { appearance: none; -webkit-appearance: none; width: 40px; height: 24px; flex: none; background: #80848e; border-radius: 12px; position: relative; cursor: pointer; transition: background .15s; }
    .tg:before { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
    .tg:checked { background: var(--green); }
    .tg:checked:before { left: 19px; }
    .b:disabled { opacity: .5; cursor: not-allowed; filter: none; }

    /* Voice, forums, friends, badges */
    #vbar { background: #111214; padding: 8px 12px; border-bottom: 1px solid #0006; display: flex; align-items: center; gap: 4px; }
    #vbar:empty { display: none; }
    #vbar small { display: block; color: var(--mute); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vroom, .forum, .fr { padding: 24px; }
    .vroom { text-align: center; }
    .tiles { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 24px 0; }

    async function doAuth(mode) {
      const email = $('#ae').value.trim(), password = $('#ap').value, err = $('#aerr');

    // ---------- Loading data: servers, channels, messages, online status ----------
    async function loadServers(keep) {
      const { data } = await supabaseClient.from('members').select('servers(*)').eq('user_id', me.id);
      servers = (data || []).map(x => x.servers).filter(Boolean);
      if (!keep && servers.length)

        cur = null;
        channels = [];

        msgs = [];

    async function loadMembers() {
      const { data } = await supabaseClient.from('members').select('user_id,nick,avatar_url,bio,banner_url,profiles(*)').eq('server_id', cur.id);
      const rows = data || [];
      mySP = rows.find(x => x.user_id === me.id) || {};
      members = rows.filter(x => x.profiles).map(x => ({ ...x.profiles, username: x.nick || x.profiles.username, avatar_url: x.avatar_url || x.profiles.avatar_url, bio: x.bio || x.profiles.bio, banner_url: x.banner_url || x.profiles.banner_url }));

    async function selectServer(id) {
      cur = servers.find(s => s.id === id);
      const c = await supabaseClient.from('channels').select('*').eq('server_id', id).order('created_at');
  channels = c.data || [];
  const k = await supabaseClient.from('categories').select('*').eq('server_id', id).order('created_at');
  cats = k.data || [];
  await loadRoles(id);
  liveServer(id);
      await loadMembers();
      online = new Map();
      if (pr) supabaseClient.removeChannel(pr);
      pr = supabaseClient.channel('pres-' + id, { config: { presence: { key: me.id } } });
      pr.on('presence', { event: 'sync' }, () => {
        online = new Map(Object.entries(pr.presenceState()).map(([k, v]) => [k, v[0]?.status || 'online']));
        renderMembers();
      }).subscribe(s => { if (s === 'SUBSCRIBED') pr.track({ status: S.status }); });
      renderAll();
      if (channels.length) selectChannel(channels[0].id);
      else { curCh = null; msgs = []; renderChat(); }
    }

    async function selectChannel(id) {
      curCh = channels.find(c => c.id === id);
      curThread = null; dmWith = null; typers = {};
      if (rt) { supabaseClient.removeChannel(rt); rt = null; }
      renderSide();
      if (curCh.kind === 'voice') { msgs = []; return renderChat(); }
      if (curCh.kind === 'forum') await loadThreads(); else await loadMessages();
      const tbl = { schema: 'public', table: 'messages' };
      rt = supabaseClient.channel('msg-' + id)
        .on('postgres_changes', { event: 'INSERT', ...tbl, filter: 'channel_id=eq.' + id }, async p => {
          if ((p.new.thread_id || null) !== (curThread?.id || null)) return;
          if (msgs.some(m => m.id === p.new.id)) return;
          const { data } = await supabaseClient.from('profiles').select('*').eq('id', p.new.user_id).single();
          addMsg({ ...p.new, profiles: data });
          if (p.new.user_id !== me.id) beep();
        })
        .on('postgres_changes', { event: 'UPDATE', ...tbl, filter: 'channel_id=eq.' + id }, p => {
          const m = msgs.find(x => x.id === p.new.id);
          if (m) { Object.assign(m, p.new); renderChat(true); }
        })
        .on('postgres_changes', { event: 'DELETE', ...tbl }, p => { msgs = msgs.filter(m => m.id !== p.old.id); renderChat(true); })
        .on('broadcast', { event: 'typing' }, ({ payload }) => {
          if (payload.id === me.id) return;
          typers[payload.u] = Date.now();
          renderTyping();
          setTimeout(renderTyping, 3200);
        })
        .subscribe();
    }

    function addMsg(m) {
      if (msgs.some(x => x.id === m.id)) return;
      msgs.push(m);
      animateLast = true;
      renderChat();
    }

    // ---------- Right-click menus ----------

    async function delCategory(i) {
      const name = catList[i];
      if (name === 'Text channels') return toast("The default category can't be deleted.");
      if (!confirm(`Delete the category "${name}"? Its channels will move to Text channels.`)) return;
      await supabaseClient.from('categories').delete().eq('server_id', cur.id).eq('name', name);
      await supabaseClient.from('channels').update({ category: 'Text channels' }).eq('server_id', cur.id).eq('category', name);
      cats = cats.filter(c => c.name !== name);
      channels.forEach(c => { if (c.category === name) c.category = 'Text channels'; });
      renderSide();
    }
    // ---------- Voice and calls ----------
    // Audio goes directly between people (WebRTC). Supabase Realtime only carries the handshake.
    const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }; // add a TURN server here if calls fail on strict networks
    let vc = null; // the voice room I am in: { room, label, stream, sig, peers, muted, deaf }
    const dmRoom = other => 'dm-' + [me.id, other].sort().join('-');
    const vsend = (to, data) => vc.sig.send({ type: 'broadcast', event: 'rtc', payload: { from: me.id, to, ...data } });

    async function joinVoice(room, label) {
      if (vc) await leaveVoice();
      label = label || (channels.find(c => c.id === room)?.name ? '#' + channels.find(c => c.id === room).name : dmWith ? 'Call with ' + dmWith.username : 'Call');
      let stream;
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
      catch (e) { toast('Allow microphone access to join voice.'); return false; }
      const sig = supabaseClient.channel('voice-' + room, { config: { presence: { key: me.id } } });
      vc = { room, label, stream, sig, peers: {}, muted: false, deaf: false };
      sig.on('presence', { event: 'sync' }, voiceSync)
        .on('broadcast', { event: 'rtc' }, ({ payload }) => onSignal(payload))
        .subscribe(s => { if (s === 'SUBSCRIBED') sig.track({ name: me.username, muted: false, deaf: false }); });
      renderMe(); renderChat(true);
      return true;
    }

    function voiceSync() {
      if (!vc) return;
      const ids = Object.keys(vc.sig.presenceState()).filter(k => k !== me.id);
      ids.forEach(id => { if (!vc.peers[id] && me.id < id) makePeer(id, true); }); // the lower id starts the call
      Object.keys(vc.peers).forEach(id => { if (!ids.includes(id)) dropPeer(id); });
      renderChat(true);
    }

    function makePeer(id, initiator) {
      const pc = new RTCPeerConnection(ICE), audio = new Audio();
      audio.autoplay = true; audio.muted = vc.deaf;
      vc.stream.getTracks().forEach(t => pc.addTrack(t, vc.stream));
      pc.ontrack = e => { audio.srcObject = e.streams[0]; };
      pc.onicecandidate = e => { if (e.candidate && vc) vsend(id, { ice: e.candidate }); };
      vc.peers[id] = { pc, audio, q: [] };
      if (initiator) pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => vsend(id, { sdp: pc.localDescription }));
    }

    function dropPeer(id) {
      const p = vc?.peers[id];
      if (!p) return;
      p.pc.close(); p.audio.srcObject = null;
      delete vc.peers[id];
    }

    async function onSignal(p) {
      if (!vc || p.to !== me.id) return;
      if (!vc.peers[p.from]) makePeer(p.from, false);
      const peer = vc.peers[p.from], pc = peer.pc;
      try {
        if (p.sdp) {
          await pc.setRemoteDescription(p.sdp);
          peer.q.forEach(c => pc.addIceCandidate(c).catch(() => {}));
          peer.q = [];
          if (p.sdp.type === 'offer') { await pc.setLocalDescription(await pc.createAnswer()); vsend(p.from, { sdp: pc.localDescription }); }
        } else if (p.ice) {
          if (pc.remoteDescription) await pc.addIceCandidate(p.ice); else peer.q.push(p.ice);
        }
      } catch (e) { console.warn('voice signal', e); }
    }

    async function leaveVoice() {
      if (!vc) return;
      const v = vc;
      vc = null;
      Object.values(v.peers).forEach(p => { p.pc.close(); p.audio.srcObject = null; });
      v.stream.getTracks().forEach(t => t.stop());
      await supabaseClient.removeChannel(v.sig);
      renderMe(); renderChat(true);
    }

    function voiceToggle(kind) {
      if (!vc) return;
      vc[kind] = !vc[kind];
      if (kind === 'deaf') vc.muted = vc.deaf; // deafening also mutes your mic
      vc.stream.getAudioTracks().forEach(t => { t.enabled = !vc.muted; });
      Object.values(vc.peers).forEach(p => { p.audio.muted = vc.deaf; });
      vc.sig.track({ name: me.username, muted: vc.muted, deaf: vc.deaf });
      renderMe(); renderChat(true);
    }

    function voiceRoomHtml() {
      const joined = vc && vc.room === curCh.id;
      const tiles = joined ? Object.entries(vc.sig.presenceState()).map(([id, a]) => {
        const p = members.find(u => u.id === id) || (id === me.id ? me : { username: a[0]?.name || '?' });
        return `<div class="tile">${avatarHtml(p, 72)}<b>${escapeHtml(p.username)}</b>${a[0]?.deaf ? '<small>🙉 deafened</small>' : a[0]?.muted ? '<small>🔇 muted</small>' : ''}</div>`;
      }).join('') : '';
      return `<div class="vroom"><h2>🔊 ${escapeHtml(curCh.name)}</h2>${joined ? `<div class="tiles">${tiles}</div><button class="b r" onclick="leaveVoice()">Leave voice</button>` : `<p style="color:var(--mute)">Join to talk with everyone in this channel.</p><button class="b" onclick="joinVoice('${curCh.id}')">Join Voice</button>`}</div>`;
    }

    // ---------- Forum posts ----------

    // ---------- Friends and direct messages ----------
    const friendOf = f => f.requester === me.id ? f.a : f.r;
    const myFriends = () => friendRows.filter(f => f.status === 'accepted').map(friendOf).filter(Boolean);
    const dmRow = r => ({ ...r, user_id: r.sender, dm: true, profiles: r.sender === me.id ? me : (myFriends().find(x => x.id === r.sender) || {}) });

    function watchDMs() {

        if (!cur) { renderSide(); if (!dmWith) renderChat(true); }
      }).subscribe(s => { if (s === 'SUBSCRIBED') gp.track({ status: S.status }); });
      watchers = [gp,
        supabaseClient.channel('dm-in-' + me.id).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'dm_messages', filter: 'recipient=eq.' + me.id }, p => {

        }).subscribe(),
        supabaseClient.channel('friends-' + me.id).on('postgres_changes', { event: '*', schema: 'public', table: 'friendships' }, () => loadFriends()).subscribe()

    function friendsHtml() {
      const label = { online: 'Online', idle: 'Idle', dnd: 'Do Not Disturb' };
      const row = (p, actions) => `<div class="frow" data-n="${escapeHtml(p.username.toLowerCase())}"><div class="dot">${avatarHtml(p, 36)}<i class="${friendStatus(p) || 'off'}"></i></div><div><b>${escapeHtml(p.username)}</b>${badgePills(p)}<span class="stx">${label[friendStatus(p)] || 'Offline'}</span></div><span style="flex:1"></span>${actions}</div>`;
      let body;
      if (friendTab === 'add') body = `<h3>Add Friend</h3><p>You can add friends with their Procord username.</p><div class="nm2"><input id="fu" placeholder="You can add friends with their username" onkeydown="if(event.key==='Enter')addFriend()"><button class="b" style="margin:6px 0" onclick="addFriend()">Send Friend Request</button></div><div class="err" id="ferr"></div>`;
      else if (friendTab === 'pending') {
        const list = friendRows.filter(f => f.status === 'pending');
        body = `<div class="lbl" style="padding-left:0">Pending — ${list.length}</div>` + (list.map(f => row(friendOf(f), f.addressee === me.id
          ? `<button class="rbtn" title="Accept" onclick="answerFriend(${f.id},true)">✔</button><button class="rbtn" title="Ignore" onclick="answerFriend(${f.id},false)">✕</button>`
          : `<span class="ts">Outgoing</span><button class="rbtn" title="Cancel" onclick="answerFriend(${f.id},false)">✕</button>`)).join('') || '<p class="ts">There are no pending friend requests.</p>');
      } else {
        const list = myFriends().filter(p => friendTab === 'all' || friendStatus(p));
        body = `<div class="nm2" style="margin-bottom:16px"><span>🔍</span><input placeholder="Search" oninput="filterRows(this.value)"></div><div class="lbl" style="padding-left:0">${friendTab === 'all' ? 'All friends' : 'Online'} — ${list.length}</div>`
          + (list.map(p => row(p, `<button class="rbtn" title="Message" onclick="openDM('${p.id}')">💬</button><button class="rbtn" title="Remove friend" onclick="removeFriend('${p.id}')">✕</button>`)).join('') || '<p class="ts">Nobody is here yet.</p>');
      }
      const nudge = servers.length ? '' : `<div class="card2"><b>You are not in any server yet.</b><div class="row" style="justify-content:flex-start"><button class="b" onclick="serverModal()">Create or join a server</button></div></div>`;
      return `<div class="fr">${nudge}${body}</div>`;
    }

    async function addFriend() {
      const name = $('#fu').value.trim().replace(/[%_]/g, ''), err = $('#ferr');
      err.style.color = '';
      if (!name) return;
      const { data } = await supabaseClient.from('profiles').select('id,username').ilike('username', name).neq('id', me.id).limit(1);
      if (!data || !data.length) return err.textContent = 'No user found with that username.';
      const { error } = await supabaseClient.from('friendships').insert({ addressee: data[0].id });
      if (error) return err.textContent = error.code === '23505' ? 'You already sent a request to that person.' : error.message + ' (Run update4.sql in Supabase first.)';
      err.style.color = 'var(--green)';
      err.textContent = 'Friend request sent to ' + data[0].username + '!';
      $('#fu').value = '';
      loadFriends();
    }

    async function answerFriend(id, accept) {
      if (accept) await supabaseClient.from('friendships').update({ status: 'accepted' }).eq('id', id);
      else await supabaseClient.from('friendships').delete().eq('id', id);
      loadFriends();
    }

    async function removeFriend(pid) {
      const f = friendRows.find(x => x.status === 'accepted' && friendOf(x)?.id === pid);
      if (f && confirm('Remove this friend?')) { await supabaseClient.from('friendships').delete().eq('id', f.id); if (dmWith?.id === pid) dmWith = null; loadFriends(); }
    }

    async function quickAdd(id) {
      const { error } = await supabaseClient.from('friendships').insert({ addressee: id });
      closeM();
      toast(error ? (error.code === '23505' ? 'Request already sent.' : error.message) : 'Friend request sent!');
      loadFriends();
    }

    async function startCall() {
      if (!dmWith) return;
      if (!(vc && vc.room === dmRoom(dmWith.id)) && !(await joinVoice(dmRoom(dmWith.id), 'Call with ' + dmWith.username))) return;
      const { data } = await postMessage({ content: '[call]' });
      if (data) addMsg(data);
    }

    // One place that saves a message, whether it goes to a channel, a forum post or a DM
    async function postMessage(fields) {
      if (dmWith) {
        const { data, error } = await supabaseClient.from('dm_messages').insert({ recipient: dmWith.id, ...fields }).select('*').single();
        return error ? { error } : { data: dmRow(data) };
      }
      return await supabaseClient.from('messages').insert({ channel_id: curCh.id, thread_id: curThread ? curThread.id : null, ...fields }).select('*,profiles(*)').single();
    }
    // ---------- Roles ----------
    async function loadRoles(id) {
      const [r, m] = await Promise.all([
        supabaseClient.from('roles').select('*').eq('server_id', id).order('position').order('created_at'),
        supabaseClient.from('member_roles').select('*').eq('server_id', id)]);
      roles = r.data || [];
      memberRoles = m.data || [];
    }

    function setModal(html) {
      const box = $('#modal .mbox');
      if ($('#modal').classList.contains('on') && box) box.innerHTML = html; else modal(html);
    }

    const roleChecks = selected => roles.length
      ? `<span class="f2">Roles that can view it</span>` + roles.map(r => `<label class="opt"><span style="color:${safeColor(r.color)}">${escapeHtml(r.name)}</span><input type="checkbox" class="rolechk" value="${r.id}" ${selected.includes(r.id) ? 'checked' : ''}></label>`).join('')
      : `<small class="ts">Create roles from the server menu to share a private channel with them.</small>`;



    async function delRole(id) {
      if (!confirm('Delete this role?')) return;
      const { error } = await supabaseClient.from('roles').delete().eq('id', id);
      if (error) return toast(error.message);
      roles = roles.filter(r => r.id !== id);
      memberRoles = memberRoles.filter(m => m.role_id !== id);
      closeRole(); renderMembers(); renderChat(true);
    }

    async function toggleMemberRole(uid, rid) {
      const has = memberRoles.some(m => m.user_id === uid && m.role_id === rid);
      const { error } = has
        ? await supabaseClient.from('member_roles').delete().eq('user_id', uid).eq('role_id', rid)
        : await supabaseClient.from('member_roles').insert({ server_id: cur.id, user_id: uid, role_id: rid });
      if (error) return toast(error.message);
      memberRoles = has ? memberRoles.filter(m => !(m.user_id === uid && m.role_id === rid)) : [...memberRoles, { server_id: cur.id, user_id: uid, role_id: rid }];
      serverSettings('roles'); renderMembers(); renderChat(true);
    }
    // ---------- Permissions ----------
    const PERMS = [
      ['administrator', 'Administrator', 'Full control. Sees every channel and can do everything below.'],
      ['manage_channels', 'Manage Channels', 'Create, edit and delete channels and categories.'],
      ['manage_roles', 'Manage Roles', 'Create and edit roles and give them to members.'],
      ['manage_messages', 'Manage Messages', 'Delete messages from other members.'],
      ['kick_members', 'Kick Members', 'Remove members from the server.']];
    const ROLE_COLORS = ['#1abc9c', '#2ecc71', '#3498db', '#9b59b6', '#e91e63', '#f1c40f', '#e67e22', '#e74c3c', '#95a5a6', '#607d8b', '#11806a', '#1f8b4c', '#206694', '#71368a', '#ad1457', '#c27c0e', '#a84300', '#992d22', '#979c9f', '#546e7a'];
    const can = p => !!cur && (cur.owner_id === me.id || roles.some(r => memberRoles.some(m => m.user_id === me.id && m.role_id === r.id) && (r.perms || []).some(x => x === p || x === 'administrator')));
    const friendStatus = p => { const s = onlineAll.get(p.id); return s && s !== 'invisible' ? s : null; };

    // ---------- Live updates: other people's changes appear without a refresh ----------
    function liveServer(id) {
      if (sl) supabaseClient.removeChannel(sl);
      sl = supabaseClient.channel('srv-' + id);
      ['channels', 'categories', 'roles', 'member_roles', 'members', 'threads', 'servers', 'profiles'].forEach(t =>
        sl.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => liveReload(t)));
      sl.subscribe();
    }

    function liveReload(t) {
      clearTimeout(rtimers[t]);
      rtimers[t] = setTimeout(async () => {
        if (!cur) return;
        const id = cur.id;
        if (t === 'channels') {
          const c = await supabaseClient.from('channels').select('*').eq('server_id', id).order('created_at');
          channels = c.data || [];
          if (curCh && !channels.some(x => x.id === curCh.id)) { curCh = null; if (channels.length) selectChannel(channels[0].id); }
          else if (curCh) curCh = channels.find(x => x.id === curCh.id);
          renderSide(); renderChat(true);
        } else if (t === 'categories') {
          const k = await supabaseClient.from('categories').select('*').eq('server_id', id).order('created_at');
          cats = k.data || []; renderSide();
        } else if (t === 'roles' || t === 'member_roles') {
          await loadRoles(id); renderMembers(); renderSide(); renderChat(true);
          if ($('#set')?.dataset.kind === 'server' && !sset.rid) serverSettings(sset.tab);
        } else if (t === 'members' || t === 'profiles') {
          await loadMembers();
          if (t === 'members' && !members.some(m => m.id === me.id)) return loadServers();
          renderMembers(); renderChat(true);
        } else if (t === 'threads') {
          if (curCh?.kind === 'forum' && !curThread) loadThreads();
        } else if (t === 'servers') {
          const { data } = await supabaseClient.from('servers').select('*').eq('id', id);
          if (!data || !data.length) { toast('This server no longer exists.'); servers = servers.filter(s => s.id !== id); return goHome(); }
          Object.assign(cur, data[0]); renderRail(); renderSide();
        }
      }, 250);
    }

    // ---------- Server dropdown (click the server name) ----------
    function serverDrop(e) {
      e.stopPropagation();
      const r = $('#sh').getBoundingClientRect();
      const it = (ic, t, code, danger) => [`<span class="ci">${ic}</span>${t}`, code, danger];
      const items = [it('🔗', 'Invite to Server', 'serverMenu()')];
      if (can('manage_roles') || can('manage_channels')) items.push(it('⚙️', 'Server Settings', 'serverSettings()'));
      if (can('manage_channels')) items.push('-', it('➕', 'Create Channel', "channelModal('')"), it('📁', 'Create Category', 'categoryModal()'));
      items.push('-', it('🧑', 'Edit Per-server Profile', "settings('server')"), '-', cur.owner_id === me.id ? it('🗑️', 'Delete Server', 'delServer()', true) : it('🚪', 'Leave Server', 'leave()', true));
      ctxMenu({ preventDefault() {}, clientX: r.left + 8, clientY: r.bottom + 6 }, items);
    }

    function serverMenu() {
      modal(`<button class="ib mx" onclick="closeM()" title="Close">✕</button><h2>Invite friends to ${escapeHtml(cur.name)}</h2><p>Share this invite code. They can paste it under Join a server.</p><input class="t" readonly value="${cur.invite_code}" onfocus="this.select()">
        <div class="row"><button class="b g" onclick="closeM()">Close</button><button class="b" onclick="navigator.clipboard.writeText('${cur.invite_code}');toast('Invite code copied')">Copy code</button></div>`);
    }

    // ---------- Server settings page: Overview, Roles, Members ----------
    function serverSettings(tab = 'roles') {
      if (!cur) return;
      sset.tab = tab;
      const NAV = [['Server settings'], ['overview', 'Overview'], ['roles', 'Roles'], ['members', 'Members']];
      const pages = { overview: overviewHtml, roles: rolesHtml, members: membersHtml };
      const go = k => `sset.rid=null;sset.dirty=false;serverSettings('${k}')`;
      const nav = NAV.map(n => n.length === 1 ? `<div class="sg">${escapeHtml(cur.name)}</div>` : `<button class="sn ${n[0] === tab ? 'on' : ''}" onclick="${go(n[0])}">${n[1]}</button>`).join('');
      const mob = `<div class="tabs mob">${NAV.filter(n => n.length > 1).map(n => `<button class="tab ${n[0] === tab ? 'on' : ''}" onclick="${go(n[0])}">${n[1]}</button>`).join('')}</div>`;
      let el = $('#set');
      if (!el) { el = document.createElement('div'); el.id = 'set'; document.body.append(el); }
      el.dataset.kind = 'server';
      el.innerHTML = `<div id="setnav"><div>${nav}</div></div><div id="setmain"><div>${mob}${pages[tab]()}</div></div><button id="setx" title="Close (Esc)" onclick="closeSet()">✕</button><span class="esc">ESC</span>`;
    }

    function overviewHtml() {
      const own = cur.owner_id === me.id;
      return `<h2>Server Overview</h2><span class="f2">Server name</span><div class="nm2"><input id="sname" value="${escapeHtml(cur.name)}" maxlength="50" ${own ? '' : 'disabled'}></div>
        ${own ? `<div class="row" style="justify-content:flex-start"><button class="b" onclick="renameServer()">Save changes</button></div>` : '<p class="ts">Only the server owner can rename the server.</p>'}
        <span class="f2">Invite code</span><div class="nm2"><input readonly value="${cur.invite_code}" onfocus="this.select()"></div>`;
    }

    async function renameServer() {
      const name = $('#sname').value.trim();
      if (!name) return;
      const { error } = await supabaseClient.from('servers').update({ name }).eq('id', cur.id);
      if (error) return toast(error.message);
      cur.name = name; renderRail(); renderSide(); toast('Server renamed'); serverSettings('overview');
    }

    function membersHtml() {
      return `<h2>Members</h2><p>${members.length} member${members.length === 1 ? '' : 's'}</p>` + members.map(p => {
        const mine = roles.filter(r => memberRoles.some(m => m.user_id === p.id && m.role_id === r.id)).map(r => `<span class="chip on" style="--c:${safeColor(r.color)}">${escapeHtml(r.name)}</span>`).join(' ');
        const kick = can('kick_members') && p.id !== cur.owner_id && p.id !== me.id ? `<button class="b g" onclick="kick('${p.id}')">Kick</button>` : '';
        return `<div class="frow">${avatarHtml(p, 36)}<div><b ${roleAttr(p.id)}>${escapeHtml(p.username)}</b>${roleIcon(p.id)}${badgePills(p)}<span class="stx">${mine}</span></div><span style="flex:1"></span>${kick}</div>`;
      }).join('');
    }

    async function kick(uid) {
      if (!confirm('Kick this member from the server?')) return;
      const { error } = await supabaseClient.from('members').delete().eq('server_id', cur.id).eq('user_id', uid);
      if (error) return toast(error.message);
      await loadMembers(); renderMembers(); serverSettings('members');
    }

    function rolesListHtml() {
      const canR = can('manage_roles'), q = sset.q.toLowerCase();
      return roles.filter(r => r.name.toLowerCase().includes(q)).map(r => {
        const n = memberRoles.filter(m => m.role_id === r.id).length, c = safeColor(r.color);
        return `<div class="frow"><span class="dotc" style="background:${c}"></span><b ${roleStyleAttr(r)}>${escapeHtml(r.name)}</b>${iconHtml(r)}${(r.perms || []).includes('administrator') ? '<span class="ts">🛡️ Administrator</span>' : ''}<span style="flex:1"></span><span class="ts">${n} 👥</span>${canR ? `<button class="ib" title="Move up" onclick="moveRole('${r.id}',-1)">▲</button><button class="ib" title="Move down" onclick="moveRole('${r.id}',1)">▼</button><button class="ib" title="Edit role" onclick="editRole('${r.id}')">✎</button>` : ''}</div>`;
      }).join('') || '<p class="ts">No roles yet.</p>';
    }

    function rolesHtml() {
      if (sset.rid) return roleEditHtml();
      return `<h2>Roles</h2><p>Use roles to group your server members and assign permissions.</p>
        <div class="srow" style="gap:8px"><div class="nm2" style="flex:1"><span>🔍</span><input placeholder="Search Roles" value="${escapeHtml(sset.q)}" oninput="sset.q=this.value;$('#rlist').innerHTML=rolesListHtml()"></div>${can('manage_roles') ? '<button class="b" onclick="newRole()">Create Role</button>' : ''}</div>
        <p class="ts">Members use the colour of the highest role they have on this list. Use the arrows to reorder roles.</p><div id="rlist">${rolesListHtml()}</div>`;
    }

    function roleEditHtml() {
      const r = sset.draft, st = r.style || 'solid';
      const tabs = [['display', 'Display'], ['perms', 'Permissions'], ['members', `Manage Members (${memberRoles.filter(m => m.role_id === r.id).length})`]];
      const swatch = f => `<div class="swatches">${ROLE_COLORS.map(x => `<span class="sw2 ${safeColor(r[f] || r.color) === x ? 'on' : ''}" style="background:${x}" onclick="sset.draft.${f}='${x}';dirty();roleTab('display')"></span>`).join('')}<input type="color" value="${safeColor(r[f] || r.color)}" oninput="sset.draft.${f}=this.value;dirty()" title="Custom colour"></div>`;
      let body = '';
      if (sset.rtab === 'display') body = `<span class="f2">Role name <span style="color:var(--red)">*</span></span><div class="nm2"><input value="${escapeHtml(r.name)}" maxlength="32" oninput="sset.draft.name=this.value;dirty()"></div>
        <span class="f2">Role style</span><div class="styles">${STYLES.map(([k, l]) => `<button class="stylecard ${st === k ? 'on' : ''}" onclick="sset.draft.style='${k}';dirty();roleTab('display')"><span ${roleStyleAttr({ ...r, style: k })}>${escapeHtml(me.username)}</span><small>${l}</small></button>`).join('')}</div>
        ${st === 'holo' ? '' : `<span class="f2">Role colour</span>${swatch('color')}`}
        ${st === 'gradient' ? `<span class="f2">Second gradient colour</span>${swatch('color2')}` : ''}
        <span class="f2">Role icon</span><div style="display:flex;gap:8px"><div class="nm2" style="flex:1"><input id="ricon" placeholder="An emoji like 🛡️ or an image URL" value="${escapeHtml(r.icon || '')}" maxlength="400" oninput="sset.draft.icon=this.value.trim();dirty()"></div><button class="b g" onclick="pickImage('ricon')">Upload</button></div>
        <p class="ts">Shown next to the name of members whose top icon role is this one. Small square images work best.</p>
        <div class="card2" style="margin-top:20px"><div class="msg" style="margin:0;padding:0"><div>${avatarHtml(me, 40)}</div><div class="mb"><div class="mh"><b ${roleStyleAttr(r)}>${escapeHtml(me.username)}</b>${iconHtml(r)} <span class="ts">Today</span></div><div class="mc">This is how the role looks in chat.</div></div></div></div>
        <div class="row" style="justify-content:flex-start"><button class="b r" onclick="delRole('${r.id}')">Delete role</button></div>`;
      else if (sset.rtab === 'perms') body = PERMS.map(([k, l, d]) => `<label class="opt"><span><b>${l}</b><small class="ts">${d}</small></span><input type="checkbox" class="tg" ${(r.perms || []).includes(k) ? 'checked' : ''} onchange="togglePerm('${k}',this.checked)"></label>`).join('')
        + '<p class="ts">Give Manage Roles only to people you trust: they can create an Administrator role.</p>';
      else body = members.map(p => `<label class="opt"><span style="display:flex;align-items:center;gap:10px">${avatarHtml(p, 28)}${escapeHtml(p.username)}</span><input type="checkbox" ${memberRoles.some(m => m.user_id === p.id && m.role_id === r.id) ? 'checked' : ''} onchange="toggleMemberRole('${p.id}','${r.id}')"></label>`).join('');
      return `<div class="srow"><div><button class="ib" onclick="closeRole()">‹ Back</button> <b style="display:inline">Edit Role: ${escapeHtml(roles.find(x => x.id === r.id)?.name || r.name)}</b></div></div>
        <div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${sset.rtab === k ? 'on' : ''}" onclick="roleTab('${k}')">${l}</button>`).join('')}</div>${body}
        <div id="savebar" class="savebar" style="display:${sset.dirty ? 'flex' : 'none'}"><span>Careful, you have unsaved changes!</span><button class="b g" onclick="editRole('${r.id}')">Reset</button><button class="b" style="background:var(--green)" onclick="saveRole()">Save Changes</button></div>`;
    }

    function editRole(id) {
      const r = roles.find(x => x.id === id);
      sset.rid = id; sset.rtab = 'display'; sset.dirty = false;
      sset.draft = { ...r, perms: [...(r.perms || [])] };
      serverSettings('roles');
    }
    function closeRole() { sset.rid = null; sset.draft = null; sset.dirty = false; serverSettings('roles'); }
    function roleTab(t) { sset.rtab = t; serverSettings('roles'); }
    function dirty() { sset.dirty = true; const b = $('#savebar'); if (b) b.style.display = 'flex'; }
    function togglePerm(k, on) {
      const p = new Set(sset.draft.perms);
      if (on) p.add(k); else p.delete(k);
      sset.draft.perms = [...p]; dirty();
    }

    async function newRole() {
      const { data, error } = await supabaseClient.from('roles').insert({ server_id: cur.id, name: 'new role', color: '#99aab5', position: roles.length }).select().single();
      if (error) return toast(error.message + ' (Run update6.sql in Supabase first.)');
      roles.push(data);
      editRole(data.id);
    }

    async function saveRole() {
      const d = sset.draft;
      if (!d.name.trim()) return toast('A role needs a name.');
      const u = { name: d.name.trim(), color: d.color, perms: d.perms, style: d.style || 'solid', color2: d.color2 || d.color, icon: d.icon || null };
      const { error } = await supabaseClient.from('roles').update(u).eq('id', d.id);
      if (error) return toast(error.message + ' (Run update7.sql in Supabase first.)');
      Object.assign(roles.find(r => r.id === d.id), u);
      sset.dirty = false; toast('Role saved');
      serverSettings('roles'); renderMembers(); renderChat(true); renderSide();
    }

    async function moveRole(id, dir) {
      const i = roles.findIndex(r => r.id === id), j = i + dir;
      if (j < 0 || j >= roles.length) return;
      [roles[i], roles[j]] = [roles[j], roles[i]];
      await Promise.all(roles.map((r, k) => { if (r.position === k) return null; r.position = k; return supabaseClient.from('roles').update({ position: k }).eq('id', r.id); }));
      serverSettings('roles'); renderMembers(); renderChat(true);
    }

    function filterRows(v) { document.querySelectorAll('#msgs .frow[data-n]').forEach(r => { r.style.display = r.dataset.n.includes(v.toLowerCase()) ? '' : 'none'; }); }
    function filterDMs(v) { document.querySelectorAll('#chl .dmrow').forEach(r => { r.style.display = r.dataset.n.includes(v.toLowerCase()) ? '' : 'none'; }); }
    const friendHeaderHtml = () => `👥 <b>Friends</b><span class="vsep"></span>` + [['online', 'Online'], ['all', 'All'], ['pending', 'Pending']].map(([k, l]) => `<button class="ftab ${friendTab === k ? 'on' : ''}" onclick="friendTab='${k}';renderChat()">${l}</button>`).join('') + `<button class="ftab add ${friendTab === 'add' ? 'on' : ''}" onclick="friendTab='add';renderChat()">Add Friend</button>`;
    // ---------- Colour themes ----------
    // Default themes just recolour the panels. Colour themes paint a gradient behind see-through panels.
    const THEMES = {
      dark: { id: 'dark', name: 'Dark', accent: '#e11d2e' },
      ash: { id: 'ash', name: 'Ash', accent: '#e11d2e', vars: { '--rail': '#17171a', '--side': '#232327', '--main': '#2a2a2f', '--input': '#323238', '--hover': '#2e2e34' } },
      onyx: { id: 'onyx', name: 'Onyx', accent: '#e11d2e', vars: { '--rail': '#000000', '--side': '#050506', '--main': '#0a0a0b', '--input': '#141416', '--hover': '#101012' } }
    };
    const GRADS = [
      ['Nebula', '#1a0933', '#c2561f', 135, '#ff7a3d'], ['Aurora', '#04141f', '#0b8f7a', 160, '#19d3a2'], ['Crimson Night', '#1a0000', '#7a0c0c', 135, '#ff3b3b'],
      ['Ultraviolet', '#0f0a2e', '#5b2bd6', 135, '#8b5cf6'], ['Ocean', '#03122b', '#0b5fa5', 150, '#38bdf8'], ['Sunset', '#2a0a2e', '#e8590c', 160, '#ff8a3d'],
      ['Forest', '#04150c', '#1f6b3a', 145, '#34d399'], ['Rose Gold', '#2b0f1b', '#b4536a', 135, '#fb7185'], ['Midnight Blue', '#050b24', '#1e3a8a', 135, '#60a5fa'],
      ['Candy', '#2a0a3a', '#d6338a', 135, '#f472b6'], ['Ember', '#1a0600', '#b34a00', 150, '#fb923c'], ['Cyberpunk', '#1a0536', '#0aa3c2', 120, '#22d3ee'],
      ['Slate', '#0f1115', '#3b4252', 135, '#94a3b8'], ['Mocha', '#1a1210', '#6b4a3a', 135, '#d6a77a'], ['Toxic', '#0a1a05', '#6aa312', 135, '#a3e635'],
      ['Royal', '#1a0b3d', '#c9971c', 135, '#fbbf24'], ['Lavender Haze', '#1c1033', '#7c6ad6', 150, '#c4b5fd'], ['Deep Sea', '#021a1a', '#0e6b6b', 150, '#2dd4bf']
    ].map(([name, c1, c2, angle, accent]) => ({ id: 'g_' + name.toLowerCase().replace(/\W+/g, '_'), name, c1, c2, angle, accent, dark: .38 }));
    const findTheme = id => THEMES[id] || GRADS.find(t => t.id === id) || (S.custom || []).find(t => t.id === id);

    function currentTheme() {
      let t = findTheme(S.theme);
      if (!t) { S.theme = S.theme === 'sunset' ? 'g_sunset' : S.theme === 'midnight' ? 'onyx' : 'dark'; t = findTheme(S.theme); }
      if (S.accent === '#e11d2e') S.accent = null;
      return { ...t, accent: S.accent || t.accent };
    }

    function applyTheme(t) {
      const root = document.documentElement;
      ['--rail', '--side', '--main', '--input', '--hover', '--solid'].forEach(k => root.style.removeProperty(k));
      let bg = '';
      if (t.vars) Object.entries(t.vars).forEach(([k, v]) => root.style.setProperty(k, v));
      if (t.c1) {
        const d = t.dark ?? .38, c1 = safeColor(t.c1), c2 = safeColor(t.c2 || t.c1);
        root.style.setProperty('--rail', `rgba(0,0,0,${Math.min(.92, d + .2)})`);
        root.style.setProperty('--side', `rgba(0,0,0,${Math.min(.9, d + .06)})`);
        root.style.setProperty('--main', `rgba(0,0,0,${Math.max(.05, d - .08)})`);
        root.style.setProperty('--input', `rgba(0,0,0,${d})`);
        root.style.setProperty('--hover', 'rgba(255,255,255,.07)');
        root.style.setProperty('--solid', `color-mix(in srgb, ${c1} 55%, #0c0c0f)`);
        bg = `linear-gradient(${+t.angle || 0}deg, ${c1}, ${c2}) fixed`;
      }
      document.body.style.background = bg;
      document.body.classList.toggle('grad', !!bg);
      root.style.setProperty('--accent', safeColor(t.accent));
    }

    function pickTheme(id) { S.theme = id; S.accent = null; tdraft = null; saveS(); settings('appearance'); }

    function editTheme(id) {
      const t = id && (S.custom || []).find(x => x.id === id);
      tdraft = t ? { ...t } : { id: 'c_' + Date.now(), name: 'My theme', c1: '#1a0933', c2: '#c2561f', angle: 135, accent: '#ff7a3d', dark: .38, isNew: true };
      applyS(); settings('appearance');
    }

    function tdPrev(k, v) { tdraft[k] = v; applyS(); }
    function cancelTheme() { tdraft = null; applyS(); settings('appearance'); }

    function saveTheme() {
      const t = { ...tdraft }; delete t.isNew;
      t.name = (t.name || '').trim() || 'My theme';
      S.custom = [...(S.custom || []).filter(x => x.id !== t.id), t];
      S.theme = t.id; S.accent = null; tdraft = null;
      saveS(); settings('appearance'); toast('Theme saved');
    }

    function deleteTheme() {
      const id = tdraft.id;
      S.custom = (S.custom || []).filter(x => x.id !== id);
      if (S.theme === id) S.theme = 'dark';
      tdraft = null; saveS(); settings('appearance');
    }

    function tdHtml() {
      const d = tdraft;
      return `<div class="card2"><h3 style="margin-top:0">${d.isNew ? 'Create your own theme' : 'Edit theme'}</h3><p class="ts">Changes preview live. Save to keep the theme.</p>
        <span class="f2">Theme name</span><div class="nm2"><input value="${escapeHtml(d.name)}" maxlength="24" oninput="tdraft.name=this.value"></div>
        <div class="trow"><div><span class="f2">Colour 1</span><input type="color" value="${safeColor(d.c1)}" oninput="tdPrev('c1',this.value)"></div><div><span class="f2">Colour 2</span><input type="color" value="${safeColor(d.c2)}" oninput="tdPrev('c2',this.value)"></div><div><span class="f2">Accent</span><input type="color" value="${safeColor(d.accent)}" oninput="tdPrev('accent',this.value)"></div></div>
        <span class="f2">Gradient angle: <span id="tdang">${d.angle}</span>°</span><input type="range" min="0" max="360" value="${d.angle}" style="width:100%;accent-color:var(--accent)" oninput="$('#tdang').textContent=this.value;tdPrev('angle',+this.value)">
        <span class="f2">Panel darkness</span><input type="range" min="10" max="85" value="${Math.round(d.dark * 100)}" style="width:100%;accent-color:var(--accent)" oninput="tdPrev('dark',this.value/100)">
        <div class="row"><button class="b g" onclick="cancelTheme()">Cancel</button>${d.isNew ? '' : '<button class="b r" onclick="deleteTheme()">Delete</button>'}<button class="b" onclick="saveTheme()">Save theme</button></div></div>`;
    }

    function themePageHtml() {
      const bg = t => t.c1 ? `linear-gradient(${+t.angle || 0}deg,${safeColor(t.c1)},${safeColor(t.c2 || t.c1)})` : (t.vars?.['--main'] || '#161618');
      const sw = t => `<button class="tsw ${S.theme === t.id && !tdraft ? 'on' : ''}" title="${escapeHtml(t.name)}" style="background:${bg(t)}" onclick="pickTheme('${t.id}')">${S.theme === t.id && !tdraft ? '✓' : ''}</button>`;
      const mine = (S.custom || []).map(t => `<div class="tw">${sw(t)}<button class="tedit" title="Edit theme" onclick="editTheme('${t.id}')">✎</button></div>`).join('');
      return `<p>Choose how Procord looks. Themes are saved in this browser.</p>${tdraft ? tdHtml() : ''}
        <h3>Default Themes</h3><div class="tsws">${['dark', 'ash', 'onyx'].map(k => sw(THEMES[k])).join('')}</div>
        <h3>Colour Themes</h3><p class="ts">Make Procord yours. Free for everyone.</p>
        <div class="tsws"><button class="tsw create" title="Create your own theme" onclick="editTheme()">🎨</button>${GRADS.map(sw).join('')}</div>
        ${mine ? `<h3>My Themes</h3><div class="tsws">${mine}</div>` : ''}`;
    }
    function toggleCat(i) {
      collapsed[catList[i]] = !collapsed[catList[i]];
      renderSide();
    }

    function renderSide() {
      if (!cur) {
        $('#sh').innerHTML = '<span>Procord</span>';
        $('#sh').onclick = null;
        $('#chl').oncontextmenu = null;
        $('#chl').innerHTML = `<input class="find" placeholder="Find or start a conversation" oninput="filterDMs(this.value)"><button class="ch ${dmWith ? '' : 'on'}" onclick="showFriends()">👥 Friends</button><div class="lbl"><span>Direct messages</span></div>`
          + myFriends().map(p => `<button class="ch dm dmrow ${dmWith?.id === p.id ? 'on' : ''}" data-n="${escapeHtml(p.username.toLowerCase())}" onclick="openDM('${p.id}')"><div class="dot">${avatarHtml(p, 32)}<i class="${friendStatus(p) || 'off'}"></i></div><span>${escapeHtml(p.username)}</span></button>`).join('');
        return;
      }
      $('#sh').innerHTML = `<span>${escapeHtml(cur.name)}</span><span class="chev">⌄</span>`;
      $('#sh').onclick = serverDrop;
      catList = [...new Set([...cats.map(c => c.name), ...channels.map(c => c.category || 'Text channels')])];
      $('#chl').oncontextmenu = e => { if (!e.target.closest('.chw, .lbl')) sideCtx(e); };
      $('#chl').innerHTML = catList.map((cat, i) => {
        const row = cats.find(c => c.name === cat);
        const list = channels.filter(c => (c.category || 'Text channels') === cat);
        return `<div class="lbl" oncontextmenu="catCtx(event,${i})"><span style="cursor:pointer" onclick="toggleCat(${i})">${collapsed[cat] ? '▸' : '▾'} ${escapeHtml(cat)}${row?.private ? ' 🔒' : ''}</span></div>`
          + (collapsed[cat] ? '' : list.map(c => `<div class="chw" oncontextmenu="chanCtx(event,'${c.id}')"><button class="ch ${curCh?.id === c.id ? 'on' : ''}" onclick="selectChannel('${c.id}')">${c.private ? '🔒' : ICON[c.kind] || '#'} ${escapeHtml(c.name)}</button></div>`).join(''));
      }).join('');

    function renderMe() {
      const labels = { online: 'Online', idle: 'Idle', dnd: 'Do not disturb', invisible: 'Invisible' };
      if ($('#vbar')) $('#vbar').innerHTML = vc ? `<div style="flex:1;min-width:0"><b style="color:var(--green);font-size:13px">Voice connected</b><small>${escapeHtml(vc.label)}</small></div><button class="ib" title="${vc.muted ? 'Unmute' : 'Mute'}" onclick="voiceToggle('muted')">${vc.muted ? '🔇' : '🎤'}</button><button class="ib" title="${vc.deaf ? 'Undeafen' : 'Deafen'}" onclick="voiceToggle('deaf')">${vc.deaf ? '🙉' : '🎧'}</button><button class="ib" title="Disconnect" onclick="leaveVoice()">✕</button>` : '';
      $('#me').innerHTML = `<div class="dot">${avatarHtml(me, 32)}<i class="${S.status === 'invisible' ? 'off' : S.status}"></i></div><div class="nm">${escapeHtml(me.username)}<small>${labels[S.status]}</small></div><button class="ib" title="User settings" onclick="settings()">⚙</button>`;
    }

    function renderChat(keep) {
      const el = $('#msgs'), ch = $('#ch'), comp = $('#comp');
      if (!el) return;
      if (!cur && !dmWith) { ch.innerHTML = friendHeaderHtml(); comp.style.display = 'none'; el.innerHTML = friendsHtml(); return; }
      const isDM = !cur, kind = isDM ? 'dm' : curCh?.kind;
      const composer = isDM || ['text', 'announcement', 'rules'].includes(kind) || (kind === 'forum' && curThread);
      const locked = !isDM && ['announcement', 'rules'].includes(kind) && !can('administrator');
      if (isDM) ch.innerHTML = `<span style="color:var(--mute);font-size:22px">@</span> ${escapeHtml(dmWith.username)}<button class="ib" style="margin-left:auto" title="Start a voice call" onclick="startCall()">📞</button>`;
      else if (curThread) ch.innerHTML = `<button class="ib" onclick="closeThread()">‹ Back</button> ${escapeHtml(curThread.title)}`;
      else ch.innerHTML = `<span style="color:var(--mute);font-size:22px">${ICON[kind] || '#'}</span> ${escapeHtml(curCh?.name || '')}${curCh?.topic ? `<span class="topic">${escapeHtml(curCh.topic)}</span>` : ''}`;
      comp.style.display = composer ? '' : 'none';
      if (kind === 'voice') { el.innerHTML = voiceRoomHtml(); return; }
      if (kind === 'forum' && !curThread) { el.innerHTML = forumHtml(); return; }
      $('#inp').disabled = !!locked;
      $('#inp').placeholder = locked ? 'Only the server owner can post in this channel' : isDM ? `Message @${dmWith.username}` : curThread ? 'Reply to this post' : `Message ${ICON[kind] || '#'}${curCh?.name || ''}`;
      const bottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120 || !keep;
      let html = '', day = '';
      msgs.forEach((m, i) => {
        const p = members.find(u => u.id === m.user_id) || m.profiles || {}, pv = msgs[i - 1], d = new Date(m.created_at).toDateString();
        let divider = '';
        if (d !== day) { day = d; divider = `<div class="dd">${new Date(m.created_at).toLocaleDateString([], { dateStyle: 'long' })}</div>`; }
        const grouped = !divider && pv && pv.user_id === m.user_id && new Date(m.created_at) - new Date(pv.created_at) < 3e5;
        const isNew = animateLast && i === msgs.length - 1;
        const left = grouped ? `<span class="gt">${formatTime(m.created_at)}</span>` : `<div>${avatarHtml(p, 40)}</div>`;
        const head = grouped ? '' : `<div class="mh">${nameHtml(p)} <span class="ts">${formatDateTime(m.created_at)}</span></div>`;
        const acts = (m.user_id === me.id || (!m.dm && can('manage_messages'))) && m.content !== '[call]' ? `<div class="acts">${m.user_id === me.id ? `<button class="ib" onclick="editMsg(${m.id})" title="Edit">✏️</button>` : ''}<button class="ib" onclick="delMsg(${m.id})" title="Delete">🗑</button></div>` : '';
        const body = m.dm && m.content === '[call]'
          ? `<button class="b" onclick="joinVoice('${dmRoom(m.user_id === me.id ? m.recipient : m.user_id)}','Call with ${escapeHtml(dmWith?.username || 'friend')}')">📞 ${m.user_id === me.id ? 'You started a call' : escapeHtml(p.username) + ' started a call'} · Join</button>`
          : `${fmtText(m.content || '')}${attHtml(m)}${m.edited ? ' <span class="ed">(edited)</span>' : ''}`;
        html += divider + `<div class="msg ${grouped ? 'grouped grp' : ''} ${isNew ? 'new' : ''}">${left}<div class="mb">${head}<div class="mc">${body}</div></div>${acts}</div>`;
      });
      animateLast = false;
      el.innerHTML = html || `<div class="empty"><h2>${isDM ? 'This is the start of your chat with ' + escapeHtml(dmWith.username) : 'Welcome to #' + escapeHtml(curCh?.name || '')}</h2><p>Say something!</p></div>`;
      if (bottom) el.scrollTop = el.scrollHeight;
    }

    function renderMembers() {
      const box = $('#mem');
      if (!box) return;
      $('#app').classList.toggle('nomem', !cur);
      const st = p => { const s = p.id === me.id ? S.status : online.get(p.id); return s && s !== 'invisible' ? s : null; };
      const row = p => `<div class="mm ${st(p) ? '' : 'off'}" onclick="showProfile('${p.id}')"><div class="dot">${avatarHtml(p, 32)}${st(p) ? `<i class="${st(p)}"></i>` : ''}</div><span ${roleAttr(p.id)}>${escapeHtml(p.username)}</span>${roleIcon(p.id)}${badgePills(p)}</div>`;
      const on = members.filter(st), off = members.filter(p => !st(p));
      box.innerHTML = cur ? `<div class="lbl">Online — ${on.length}</div>${on.map(row).join('')}<div class="lbl">Offline — ${off.length}</div>${off.map(row).join('')}` : '';
    }

    // ---------- Sending and deleting messages ----------
    async function send() {
      const inp = $('#inp'), t = inp.value.trim();
      if (!t || (!curCh && !dmWith)) return;
      if (t.length > 4000) return toast('Messages are limited to 4000 characters.');
      inp.value = ''; inp.style.height = 'auto'; $('#cnt').textContent = '';
      const { data, error } = await postMessage({ content: t });
      if (error) { inp.value = t; return toast(error.message); }
      addMsg(data);
    }

    function editMsg(id) {
      const m = msgs.find(x => x.id === id);
      if (!m) return;
      modal(`<h2>Edit message</h2><textarea class="t" id="em" rows="4" maxlength="4000">${escapeHtml(m.content)}</textarea><div class="row"><button class="b g" onclick="closeM()">Cancel</button><button class="b" onclick="saveEdit(${id})">Save</button></div>`);
    }

    async function saveEdit(id) {
      const m = msgs.find(x => x.id === id), t = $('#em').value.trim();
      if (!t || !m) return;
      const { error } = await supabaseClient.from(m.dm ? 'dm_messages' : 'messages').update({ content: t, edited: true }).eq('id', id);
      if (error) return toast('Could not edit: ' + error.message);
      Object.assign(m, { content: t, edited: true });
      closeM(); renderChat(true);
    }

    async function delMsg(id) {
      const m = msgs.find(x => x.id === id);
      const { error } = await supabaseClient.from(m?.dm ? 'dm_messages' : 'messages').delete().eq('id', id);
      if (error) return toast(error.message);
      msgs = msgs.filter(x => x.id !== id);
      renderChat(true);
    }

    // ---------- Emoji picker ----------
    const EMO = ['😀', '😂', '🥹', '😍', '😎', '🤔', '😭', '😡', '👍', '👎', '🙏', '🔥', '🎉', '💀', '❤️', '✨', '👀', '🚀'];
    const EMO_P = ['🪩', '🦄', '🐉', '🛸', '🧿', '🌈', '🍕', '🎮', '🎧', '🏆', '💎', '👑', '🧠', '🫡', '🥳', '🤩', '😈', '🦊'];

    function buildEmoji() {
      $('#emo').innerHTML = [...EMO, ...EMO_P].map(e => `<button onclick="ins('${e}')">${e}</button>`).join('');

    function ins(e) {
      const i = $('#inp');
      i.value += e;
      i.focus();
      $('#emo').classList.remove('on');
    }

    // ---------- Servers and channels ----------
    function serverModal() {
      modal(`<h2>Create or join a server</h2><p>Your server is where you and your friends hang out.</p>
    <label class="f">Server name</label><input class="t" id="sn" placeholder="${escapeHtml(me.username)}'s server"><div class="row"><button class="b" onclick="createServer()">Create</button></div>
    <label class="f">Have an invite code?</label><input class="t" id="ic" placeholder="e.g. a1b2c3d4"><div class="err" id="merr"></div><div class="row"><button class="b g" onclick="closeM()">Cancel</button><button class="b" onclick="joinServer()">Join server</button></div>`);
    }

    async function createServer() {
      const name = $('#sn').value.trim() || `${me.username}'s server`;
      const { data, error } = await supabaseClient.from('servers').insert({ name }).select().single();
      if (error)
        return $('#merr').textContent = error.message;
      closeM();
      await loadServers(true);
      selectServer(data.id);

    async function joinServer() {
      const { data, error } = await supabaseClient.rpc('join_server', { code: $('#ic').value.trim() });
      if (error)
        return $('#merr').textContent = error.message;
      closeM();
      await loadServers(true);
      selectServer(data);

    const kindOptions = sel => KINDS.map(([v, l]) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${l}</option>`).join('');
    const catOptions = () => `<datalist id="cats">${catList.map(c => `<option value="${escapeHtml(c)}">`).join('')}</datalist>`;

    const NEWKINDS = [
      ['text', '#', 'Text', 'Send messages, images, GIFs, emoji, opinions and puns'],
      ['voice', '🔊', 'Voice', 'Hang out together with voice chat'],
      ['forum', '💬', 'Forum', 'Create a space for organised discussions'],
      ['announcement', '📢', 'Announcement', 'Important updates for people in and out of the server'],
      ['stage', '🎙️', 'Stage', 'Host events, panels and Q&As for an audience', 1]];

    function channelModal(cat = '') {
      if (!cur) return;
      const where = cat || 'Text channels';
      modal(`<button class="ib mx" onclick="closeM()" title="Close">✕</button><h2>Create Channel</h2><p style="margin:0">in ${escapeHtml(where)}</p>
        <span class="f2">Channel Type</span>
        ${NEWKINDS.map(([v, ic, t, d, off], i) => `<label class="kind ${off ? 'off' : ''}"><input type="radio" name="ck" value="${v}" ${i === 0 ? 'checked' : ''} ${off ? 'disabled' : ''}><span class="ki">${ic}</span><span><b>${t}</b>${off ? '<em>Coming soon</em>' : ''}<small>${d}</small></span></label>`).join('')}
        <span class="f2">Channel Name</span>
        <div class="nm2"><span>#</span><input id="cn" placeholder="new-channel" oninput="this.value=this.value.toLowerCase().replace(/ +/g,'-');$('#cgo').disabled=!this.value.trim()"></div>
        <input type="hidden" id="cc" value="${escapeHtml(where)}">
        <div class="lockrow"><div><b>🔒 Private Channel</b><small>Only you and the roles you choose will be able to view this channel.</small></div><input type="checkbox" class="tg" id="cpv" onchange="$('#crl').style.display=this.checked?'block':'none'"></div><div id="crl" style="display:none">${roleChecks([])}</div>
        <div class="err" id="merr"></div>
        <div class="row"><button class="b g" onclick="closeM()">Cancel</button><button class="b" id="cgo" disabled onclick="createChannel()">Create Channel</button></div>`);
      setTimeout(() => { const i = $('#cn'); if (i) i.focus(); }, 50);
