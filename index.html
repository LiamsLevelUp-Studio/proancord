    function emojiHtml(e, clickable = false) {
      const m = /^:(\w+):$/.exec(e);

    function closeEtip() { const t = $('#etip'); if (t) t.remove(); }

    function showEmojiTip(ev, name) {
      ev.stopPropagation();
      closeEtip();
      const url = EM[name];
      if (!url) return;
      const owned = LIB.emojis.some(e => e.name.toLowerCase() === name);

    async function cloneEmoji(name) {
      const url = EM[name];
      if (!url) return;
      const tryName = LIB.emojis.some(e => e.name.toLowerCase() === name) ? name + '_' + (Math.random() * 90 + 10 | 0) : name;
      const { error } = await supabaseClient.from('custom_emojis').insert({ name: tryName, url });
      closeEtip();
      if (error) return toast(error.message.includes('duplicate') ? 'That shortcode is already taken' : error.message);
      await loadLibrary();
      toast('Saved :' + tryName + ': to your library');

    function rxHtml(m) {
      const mine = rx.filter(r => r.message_id === m.id && !!r.dm === !!m.dm);
      if (!mine.length) return '';
      const groups = {};
      mine.forEach(r => { const k = r.emoji + '|' + !!r.super; (groups[k] = groups[k] || []).push(r); });
      return '<div class="rxs">' + Object.entries(groups).map(([k, list]) => {
        const [e, sup] = [list[0].emoji, !!list[0].super], did = list.some(r => r.user_id === me.id);
        return `<button class="rx ${did ? 'mine' : ''} ${sup ? 'super' : ''}" onclick="rxToggle(${m.id},${m.dm ? 1 : 0},'${e.replace(/'/g, '')}',${sup})">${sup ? '⚡' : ''}${emojiHtml(e)} ${list.length}</button>`;
      }).join('') + '</div>';
    }

    async function rxToggle(id, dm, emoji, sup) {
      const mine = rx.find(r => r.message_id === id && !!r.dm === !!dm && r.emoji === emoji && !!r.super === !!sup && r.user_id === me.id);
      const { error } = mine
        ? await supabaseClient.from('reactions').delete().eq('id', mine.id)
        : await supabaseClient.from('reactions').insert({ message_id: id, dm: !!dm, emoji, super: !!sup });
      if (error) return toast(error.message);
      loadReactions();
    }

    function rxPick(ev, id, dm) {
      const old = $('#rxp'); if (old) old.remove();
      const d = document.createElement('div');
      d.id = 'rxp';
      d.style.left = Math.min(ev.clientX, innerWidth - 330) + 'px';
      d.style.top = Math.max(10, Math.min(ev.clientY - 140, innerHeight - 300)) + 'px';
      const customSeen = new Set();
      const customList = ALL_EMOJIS.filter(e => { const k = e.name.toLowerCase(); if (customSeen.has(k)) return false; customSeen.add(k); return true; });
      const all = [...QUICK, ...EMO, ...customList.map(e => ':' + e.name + ':')];
      const renderGrid = q => {
        const ql = (q || '').trim().toLowerCase();
        const filtered = all.filter(e => !ql || e.toLowerCase().includes(ql) || (EMO_NAMES[e] || '').includes(ql));
        return filtered.slice(0, 64).map(e => `<button data-e="${escapeHtml(e)}" title="${escapeHtml(EMO_NAMES[e] ? ':' + EMO_NAMES[e] + ':' : e)}">${emojiHtml(e)}</button>`).join('') || '<small style="color:var(--mute);padding:8px">No matching emojis</small>';
      };
      d.innerHTML = `<input class="emo-search" id="rxq" placeholder="Search reaction…"><div class="rx-grid">${renderGrid('')}</div><label><input type="checkbox" id="rxs"> ⚡ Super reaction (glows)</label>`;
      d.querySelector('#rxq').oninput = e => { d.querySelector('.rx-grid').innerHTML = renderGrid(e.target.value); };
      d.onclick = e => { const b = e.target.closest('button'); if (!b) return; rxToggle(id, dm, b.dataset.e, $('#rxs').checked); d.remove(); };
      document.body.append(d);
      setTimeout(() => { const q = d.querySelector('#rxq'); if (q) q.focus(); document.addEventListener('mousedown', function f(e) { if (!d.contains(e.target)) { d.remove(); document.removeEventListener('mousedown', f); } }); }, 0);

    async function sendSticker(i) {

    // Library management (Settings > Emojis & Stickers)
    async function libAdd(kind) {
      const name = ($('#ln').value || '').trim().replace(/[^\w]/g, '').toLowerCase(), f = $('#lf').files[0];
      if (!/^\w{2,32}$/.test(name)) return toast('Give it a name of 2 to 32 letters, numbers or _');
      if (!f) return toast('Choose a file first');

      toast('Uploading…');
      const url = await uploadFile(f);
      if (!url) return;
      const row = { name, url, ...(kind === 'sounds' ? { emoji: '🔊' } : {}) };
      const { error } = await supabaseClient.from(TABLES[kind]).insert(row);

      await loadLibrary();
      if ($('#set')?.dataset.kind === 'server') serverSettings(sset.tab);
      else settings(kind === 'sounds' ? 'voice' : 'emojis');

      if (error) return toast(error.message);
      await loadLibrary();
      if ($('#set')?.dataset.kind === 'server') serverSettings(sset.tab);

    const libList = (kind, items) => items.map(i => kind === 'sounds'

      : `<div class="libcard"><img src="${escapeHtml(i.url)}" alt=""><code>${kind === 'emojis' ? ':' + escapeHtml(i.name) + ':' : escapeHtml(i.name)}</code><button class="b r" style="padding:5px 10px;font-size:12px;width:100%" onclick="libDel('${kind}',${i.id})">Remove</button></div>`
    ).join('') || '<p class="ts">Nothing here yet.</p>';
    const libForm = (kind, accept) => `<div class="card2"><label class="f" style="margin-top:0">Name</label><input class="t" id="ln" maxlength="32" placeholder="e.g. pepe_dance"><label class="f">File</label><input type="file" id="lf" accept="${accept}" class="t"><div class="row" style="margin-top:8px"><button class="b" onclick="libAdd('${kind}')">Add</button></div></div>`;

    // Soundboard: plays for everyone in your voice call
    const TONES = { '📯 Horn': [[440, .15], [554, .15], [659, .4]], '🥁 Drum': [[120, .1], [90, .1], [60, .3]], '😂 Laugh': [[600, .08], [500, .08], [600, .08], [500, .08], [400, .2]], '🔔 Bell': [[1320, .5]] };
    function playTone(steps) {
      try {
        const c = new (window.AudioContext || window.webkitAudioContext)(); let t = c.currentTime;
        steps.forEach(([f, d]) => { const o = c.createOscillator(), g = c.createGain(); o.type = 'square'; o.frequency.value = f; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.start(t); o.stop(t + d); t += d; });
      } catch (e) {}
    }
    function playSfx(p) {
      if (!p || (vc && vc.deaf)) return;
      if (p.tone && TONES[p.tone]) playTone(TONES[p.tone]);
      else if (/^https?:\/\//.test(p.url || '')) { const a = new Audio(p.url); a.volume = .8; a.play().catch(() => {}); }
    }
    function sfx(payload) {
      if (!vc) return toast('Join a voice channel first');
      playSfx(payload);
      vc.sig.send({ type: 'broadcast', event: 'sfx', payload });
    }
    function soundboard() {
      if (!vc) return toast('Join a voice channel first');
      modal(`<h2>Soundboard</h2><p>Your sounds work in every server. Everyone in the call hears them.</p>${Object.keys(TONES).map(k => `<button class="b g sfx" onclick="sfx({tone:'${k}'})">${k}</button>`).join('')}${LIB.sounds.map(s => `<button class="b sfx" onclick="sfx({url:'${escapeHtml(s.url)}'})">🔊 ${escapeHtml(s.name)}</button>`).join('')}<div class="row"><button class="b g" onclick="closeM();settings('voice')">Add your own sounds</button><button class="b g" onclick="closeM()">Close</button></div>`);
    }

    // HD video: picks resolution and frame rate, then lifts the bitrate so it stays sharp
    const VQ = { '720p30': [1280, 720, 30, 2.5e6], '1080p60': [1920, 1080, 60, 8e6], '4k60': [3840, 2160, 60, 25e6] };
    const vqc = () => { const [w, h, f] = VQ[S.vq || '720p30']; return { width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: f } }; };
    function boostVideo() {
      if (!vc) return;
      const bps = VQ[S.vq || '720p30'][3];
      Object.values(vc.peers).forEach(p => p.pc.getSenders().forEach(async s => {
        if (!s.track || s.track.kind !== 'video') return;
        try { const pr = s.getParameters(); if (!pr.encodings || !pr.encodings.length) pr.encodings = [{}]; pr.encodings[0].maxBitrate = bps; pr.encodings[0].maxFramerate = VQ[S.vq || '720p30'][2]; await s.setParameters(pr); } catch (e) {}
      }));
    }

    // ---------- Emoji & Sticker Picker + :shortcode: Autocomplete ----------
    const EMO_CATS = [
      ['Smileys', [['😀', 'grin'], ['😂', 'joy'], ['🥹', 'holding_back_tears'], ['😍', 'heart_eyes'], ['😎', 'sunglasses'], ['🤔', 'thinking'], ['😭', 'sob'], ['😡', 'rage'], ['🥳', 'party'], ['🤩', 'star_struck'], ['😈', 'smiling_imp'], ['💀', 'skull'], ['🫡', 'salute'], ['🤯', 'exploding_head'], ['😴', 'sleeping'], ['🫠', 'melting']]],

      ['Fun & Gaming', [['🔥', 'fire'], ['🎉', 'tada'], ['✨', 'sparkles'], ['🚀', 'rocket'], ['🎮', 'video_game'], ['🎧', 'headphones'], ['🏆', 'trophy'], ['💎', 'gem'], ['👑', 'crown'], ['🪩', 'mirror_ball'], ['🦄', 'unicorn'], ['🐉', 'dragon'], ['🛸', 'ufo'], ['🍕', 'pizza'], ['🦊', 'fox'], ['🌈', 'rainbow']]],

    const EMO = EMO_CATS[0][1].map(x => x[0]);
    const EMO_NAMES = Object.fromEntries(EMO_CATS.flatMap(([, items]) => items));
    let emoTab = 'emoji';
    let eaList = [], eaIdx = 0, eaRange = null;

    function previewEmo(val, label) {
      const f = $('#emo-foot');
      if (!f) return;
      if (!val) { f.innerHTML = `<span class="ef-ico">✨</span><div><b>Pick an emoji</b><small>Type :name: in chat for quick autocomplete</small></div>`; return; }

    function renderEmoBody() {
      const body = $('#emo-body');
      if (!body) return;
      const q = ($('#emo-q')?.value || '').trim().toLowerCase();

        const stks = LIB.stickers.filter(s => !q || s.name.toLowerCase().includes(q));

          : `<p class="ts" style="padding:12px 4px">No stickers${q ? ' matching "' + escapeHtml(q) + '"' : ''}. Add stickers in Settings &gt; Emojis &amp; Stickers.</p>`;
        return;
      }
      let out = '';
      const recents = (S.recentEmojis || []).filter(e => !q || e.toLowerCase().includes(q) || (EMO_NAMES[e] || '').includes(q));
      if (recents.length && !q) {
        out += `<div class="emo-sec">Recently Used</div><div class="emo-grid">${recents.slice(0, 16).map(e => {
          const m = /^:(\w+):$/.exec(e);
          if (m && EM[m[1].toLowerCase()]) return `<button data-v="${escapeHtml(e)}" data-l="${escapeHtml(m[1])}" onclick="ins('${escapeHtml(e)}')" onmouseenter="previewEmo('${escapeHtml(e)}')"><img src="${escapeHtml(EM[m[1].toLowerCase()])}" alt=""></button>`;

      }
      const seen = new Set();
      const customUnique = [...LIB.emojis, ...ALL_EMOJIS].filter(e => {

        out += `<div class="emo-sec">Custom Emojis (${customUnique.length})</div><div class="emo-grid">${customUnique.map(e => `<button onclick="ins(':${escapeHtml(e.name)}:')" onmouseenter="previewEmo(':${escapeHtml(e.name)}:')" title=":${escapeHtml(e.name)}:"><img src="${escapeHtml(e.url)}" alt=""></button>`).join('')}</div>`;
      } else if (!q) {
        out += `<div class="emo-sec">Custom Emojis</div><p class="ts" style="margin:4px 2px">Add custom or animated GIF emojis in Settings &gt; Emojis &amp; Stickers.</p>`;
      }
      EMO_CATS.forEach(([cat, items]) => {
        const list = items.filter(([e, n]) => !q || n.includes(q) || e.includes(q));

    function ins(e) {

      S.recentEmojis = [e, ...(S.recentEmojis || []).filter(x => x !== e)].slice(0, 16);

    function updateEmojiAuto() {
      const inp = $('#inp'), box = $('#eauto');
      if (!inp || !box) return;
      const pos = inp.selectionStart ?? inp.value.length;
      const before = inp.value.slice(0, pos);
      const m = /(?:^|\s)(:[a-zA-Z0-9_]{1,32})$/.exec(before);
      if (!m) { box.classList.remove('on'); eaList = []; return; }
      const q = m[1].slice(1).toLowerCase();
      eaRange = [pos - m[1].length, pos];
      const seen = new Set();
      const customHits = ALL_EMOJIS.filter(e => {
        const k = e.name.toLowerCase();
        if (!k.includes(q) || seen.has(k)) return false;
        seen.add(k); return true;
      }).map(e => ({ label: ':' + e.name + ':', val: ':' + e.name + ':', url: e.url, kind: 'Custom' }));
      const stdHits = Object.entries(EMO_NAMES).filter(([, n]) => n.includes(q)).map(([emo, n]) => ({ label: ':' + n + ':', val: emo, emo, kind: 'Emoji' }));
      eaList = [...customHits, ...stdHits].slice(0, 8);
      if (!eaList.length) { box.classList.remove('on'); return; }
      eaIdx = 0;
      renderEmojiAuto();
    }

    function renderEmojiAuto() {
      const box = $('#eauto');
      if (!box) return;
      box.classList.add('on');
      box.innerHTML = eaList.map((it, idx) => `<button class="ea-item ${idx === eaIdx ? 'on' : ''}" onmousedown="event.preventDefault();pickAuto(${idx})">${it.url ? `<img src="${escapeHtml(it.url)}" alt="">` : `<span style="font-size:20px;width:24px;text-align:center">${it.emo}</span>`}<b>${escapeHtml(it.label)}</b><small>${it.kind}</small></button>`).join('');
    }

    function pickAuto(idx) {
      const it = eaList[idx], inp = $('#inp'), box = $('#eauto');
      if (!it || !inp || !eaRange) return;
      const [a, b] = eaRange;
      const add = it.val + ' ';
      inp.value = inp.value.slice(0, a) + add + inp.value.slice(b);
      inp.selectionStart = inp.selectionEnd = a + add.length;
      inp.style.height = 'auto'; inp.style.height = inp.scrollHeight + 'px';
      S.recentEmojis = [it.val, ...(S.recentEmojis || []).filter(x => x !== it.val)].slice(0, 16);
      saveS();
      box.classList.remove('on');
      eaList = [];
      inp.focus();
    }

    function handleAutoKey(e) {
      const box = $('#eauto');
      if (!box || !box.classList.contains('on') || !eaList.length) return false;
      if (e.key === 'ArrowDown') { e.preventDefault(); eaIdx = (eaIdx + 1) % eaList.length; renderEmojiAuto(); return true; }
      if (e.key === 'ArrowUp') { e.preventDefault(); eaIdx = (eaIdx - 1 + eaList.length) % eaList.length; renderEmojiAuto(); return true; }
      if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); pickAuto(eaIdx); return true; }
      if (e.key === 'Escape') { e.preventDefault(); box.classList.remove('on'); return true; }
      return false;
    }

    let micTest = null;
    function stopMicTest() {
      if (!micTest) return;
      clearInterval(micTest.timer);

      try { micTest.actx.close(); } catch (e) {}
      micTest = null;
    }

    async function toggleMicTest() {
      const btn = $('#mictest-btn'), lvl = $('#test-lvl');
      if (micTest) {
        stopMicTest();
        if (btn) btn.textContent = "Let's Check";
        if (lvl) lvl.style.width = '0%';
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints() });
        const actx = new (window.AudioContext || window.webkitAudioContext)();
        const an = actx.createAnalyser();
        an.fftSize = 512;
        actx.createMediaStreamSource(stream).connect(an);
        const buf = new Uint8Array(512);
        if (btn) btn.textContent = 'Stop Test';
        micTest = {
          stream, actx,
          timer: setInterval(() => {
            if (!$('#test-lvl')) return stopMicTest();
            an.getByteTimeDomainData(buf);
            let max = 0; buf.forEach(v => { max = Math.max(max, Math.abs(v - 128)); });
            $('#test-lvl').style.width = Math.min(100, Math.round(max * 2.4)) + '%';
          }, 75)
        };
      } catch (e) { toast('Allow microphone access to test your mic.'); }
    }

    function showProfile(id, keepRolePop = false) {
      const mProf = members.find(x => x.id === id);
      const p = mProf || msgs.find(m => m.user_id === id)?.profiles || (id === me.id ? me : null);
      if (!p) return;
      modal(profileCardHtml(p, { serverId: cur?.id || '' }), 'ppop-box');
      if (keepRolePop) openRolePop(id);
      if (cur && p.id !== me.id) {
        supabaseClient.from('members').select('server_id').eq('user_id', p.id).then(({ data }) => {
          const el = $('#ppop-mut');
          if (el && data) el.textContent = `🛡️ ${data.length} Mutual Server${data.length === 1 ? '' : 's'}`;
        }).catch(() => {});
      }
    }

    function openRolePop(uid) {
      const slot = $('#rpop-slot');
      if (!slot || !cur || !can('manage_roles')) return;
      if (slot.innerHTML) { slot.innerHTML = ''; return; }
      slot.innerHTML = `<div class="rpop"><input id="rpop-q" placeholder="Search roles to add or remove…" oninput="filterRolePop('${uid}',this.value)"><div class="rpop-list" id="rpop-list"></div></div>`;
      filterRolePop(uid, '');
      setTimeout(() => { const q = $('#rpop-q'); if (q) q.focus(); }, 0);
    }

    function filterRolePop(uid, q) {
      const list = $('#rpop-list');
      if (!list) return;
      const ql = (q || '').trim().toLowerCase();
      const filtered = roles.filter(r => !ql || r.name.toLowerCase().includes(ql));
      list.innerHTML = filtered.map(r => {
        const has = memberRoles.some(m => m.user_id === uid && m.role_id === r.id);
        return `<button class="rpop-item" onclick="toggleProfileRole('${uid}','${r.id}',true)"><i class="rdot" style="background:${safeColor(r.color)}"></i>${iconHtml(r)}<span style="flex:1">${escapeHtml(r.name)}</span><span style="font-weight:700;color:${has ? 'var(--green)' : 'var(--mute)'}">${has ? '✓' : '+'}</span></button>`;
      }).join('') || '<small class="ts" style="padding:6px">No roles yet — create one in Server Settings &gt; Roles.</small>';
    }

    async function toggleProfileRole(uid, rid, keepOpen = false) {
      if (!cur || !can('manage_roles')) return toast('You do not have Manage Roles permission.');
      const has = memberRoles.some(m => m.user_id === uid && m.role_id === rid);
      const { error } = has
        ? await supabaseClient.from('member_roles').delete().eq('user_id', uid).eq('role_id', rid)
        : await supabaseClient.from('member_roles').insert({ server_id: cur.id, user_id: uid, role_id: rid });
      if (error) return toast(error.message);
      memberRoles = has ? memberRoles.filter(m => !(m.user_id === uid && m.role_id === rid)) : [...memberRoles, { server_id: cur.id, user_id: uid, role_id: rid }];
      renderMembers(); renderChat(true);
      showProfile(uid, keepOpen);
    }

    async function quickDMFromPop(id) {
      const inp = $('#ppop-dm'), t = inp ? inp.value.trim() : '';
      if (!t) {
        if (myFriends().some(f => f.id === id)) { closeM(); return openDM(id); }
        return toast('Type a message or add them as a friend first.');
      }
      const { data, error } = await supabaseClient.from('dm_messages').insert({ recipient: id, content: t }).select('*').single();
      if (error) return toast(error.message.includes('policy') || error.code === '42501' ? 'Add this user as a friend first to send a DM.' : error.message);
      inp.value = '';
      if (myFriends().some(f => f.id === id)) { closeM(); await openDM(id); addMsg(dmRow(data)); }
      else toast('Direct message sent!');
    }

    async function quickKickFromPop(id) {
      if (!cur || !can('kick_members')) return;
      if (!confirm('Kick this member from the server?')) return;
      const { error } = await supabaseClient.from('members').delete().eq('server_id', cur.id).eq('user_id', id);
      if (error) return toast(error.message);
      closeM();
      await loadMembers(); renderMembers();
      toast('Member kicked');
    }

    async function logout() {
      closeSet();
      closeM();
      await leaveVoice();
      if (rt) { supabaseClient.removeChannel(rt); rt = null; }
      if (pr) { supabaseClient.removeChannel(pr); pr = null; }
      if (sl) { supabaseClient.removeChannel(sl); sl = null; }

      watchers.forEach(w => supabaseClient.removeChannel(w));
      watchers = [];

      await supabaseClient.auth.signOut({ scope: 'local' });
      authView('in');

      const mob = `<div class="tabs mob" style="overflow-x:auto;flex-wrap:nowrap">${NAV.filter(Array.isArray).filter(n => n[0] !== '__logout').map(([k, l]) => `<button class="tab ${k === tab ? 'on' : ''}" style="white-space:nowrap" onclick="settings('${k}')">${l}</button>`).join('')}</div>`;
      let el = $('#set');
      if (!el) { el = document.createElement('div'); el.id = 'set'; document.body.append(el); }
      delete el.dataset.kind;
      const isWide = tab === 'profile' || tab === 'server';
      el.innerHTML = `<div id="setnav"><div>${profHead}${navHtml}</div></div><div id="setmain"><div class="${isWide ? 'wide' : ''}">${mob}<h2>${title}</h2>${body}</div></div><button id="setx" title="Close (Esc)" onclick="closeSet()">✕</button><span class="esc">ESC</span>`;
      if (usetQ) {
        const qEl = $('#uset-q');
        if (qEl) qEl.value = usetQ;
        filterUSetNav(usetQ);
      }
      if (tab === 'profile' || tab === 'server') pv();
      if (tab === 'voice') populateVoiceDevices();
    }

    async function changePw() {
      const p = $('#np').value;
      if (p.length < 6) return $('#serr').textContent = 'Password must be at least 6 characters.';
      const { error } = await supabaseClient.auth.updateUser({ password: p });
      if (error) return $('#serr').textContent = error.message;
      $('#np').value = ''; toast('Password updated');
    }

    function deleteModal() {
      modal(`<h2>Delete account</h2><p>This cannot be undone. Type your username <b>${escapeHtml(me.username)}</b> to confirm.</p><input class="t" id="dc"><div class="err" id="serr"></div><div class="row"><button class="b g" onclick="closeM()">Cancel</button><button class="b r" onclick="deleteAccount()">Delete my account</button></div>`);
    }

    async function deleteAccount() {
      if ($('#dc').value.trim() !== me.username) return $('#serr').textContent = 'That does not match your username.';
      const { error } = await supabaseClient.rpc('delete_account');
      if (error) return $('#serr').textContent = error.message + ' (Run update.sql in Supabase first.)';
      closeM();
      await supabaseClient.auth.signOut({ scope: 'local' });
      toast('Your account was deleted');
    }

    async function saveProfile() {
      const v = id => ($('#' + id)?.value || '').trim() || null;
      const u = { username: ($('#su')?.value || '').trim() || me.username, avatar_url: v('sa'), banner_url: v('sbn'), banner_color: $('#sbc')?.value || '#e11d2e', bio: $('#sbio')?.value || '' };
      S.status = $('#sst')?.value || 'online';
      setFlair(me.id, {
        pronouns: ($('#spn')?.value || '').trim(),
        nameStyle: $('#snst')?.value || 'default',
        color2: $('#sbc_2')?.value || '',
        deco: $('#sdeco')?.value || 'none',
        effect: $('#sfx')?.value || 'none'
      });
      if (pr) pr.track({ status: S.status });
      if (gp) gp.track({ status: S.status });
      const { error } = await supabaseClient.from('profiles').update(u).eq('id', me.id);
      if (error) return $('#serr').textContent = error.message + ' (Run update2.sql in Supabase first.)';
      Object.assign(me, u);
      if (cur) await loadMembers();
      msgs.forEach(m => { if (m.user_id === me.id) m.profiles = { ...me }; });
      toast('Changes saved');
      renderMe(); renderMembers(); renderChat(true);
    }

    async function saveServerProfile() {
      if (!cur) return;
      const v = id => ($('#' + id)?.value || '').trim() || null;
      const u = { nick: v('sn'), avatar_url: v('sav'), banner_url: v('sbn2'), bio: $('#sbi')?.value.trim() || null };
      setFlair(me.id, {
        ...getFlair(me.id),
        pronouns: ($('#spn')?.value || '').trim(),
        nameStyle: $('#snst')?.value || 'default',
        deco: $('#sdeco')?.value || 'none',
        effect: $('#sfx')?.value || 'none'
      }, cur.id);
      const { error } = await supabaseClient.from('members').update(u).eq('server_id', cur.id).eq('user_id', me.id);
      if (error) return $('#serr').textContent = error.message + ' (Run update2.sql in Supabase first.)';
      await loadMembers();
      renderMembers(); renderChat(true); toast('Server profile saved');
    }
  </script>
</body>
</html>
